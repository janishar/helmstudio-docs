  /v1/studio/loras/{lora_id}/complete:
    post:
      tags:
        - Library and LoRAs
      operationId: studioCompleteLoraUpload
      summary: Check the uploaded file and index it
      description: "Studio never trusts the client: it HEADs the object (size = the declared `size_bytes`), reads the safetensors header with range GETs, then streams the whole object once to hash it (SHA-256; a 2 GB file takes seconds) and checks it. Success: `state: ready` with `sha256`, `rank`, `key_style`, `family` (the first registry family by name the normaliser fits, else `unknown`) and `licence`. A failed check: 422 with the reason, and the LoRA stays listed `rejected` with that `reason` (until deleted; the sweep removes its object): `size differs from the declared bytes`, `pickle checkpoints are not accepted; convert it to safetensors`, `not a safetensors file`, `safetensors header is larger than 8 MB`, `tensor <key> lies outside the file`, `tensor <key> has dtype <d>; LoRAs must be F32, F16 or BF16`, `no LoRA keys found (is it a full model?)`, `<key> is not a LoRA weight`, `<module>: lora_A and lora_B ranks differ`, `<module>: lora_B is video), not a stack LoRA`. 409 `upload not received` while the object is not there yet (PUT it, then call again). Calling again after it ended answers the same (200 ready, or the same 422). 404 for an id that is unknown, another user's or shared."
      parameters:
        - $ref: "#/components/parameters/LoraId"
      responses:
        "200":
          description: The LoRA, ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lora"
        "401":
          $ref: "#/components/responses/Unauthorized"
