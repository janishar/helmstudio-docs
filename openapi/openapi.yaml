      operationId: studioCreateLoraUpload
      summary: Start uploading an own LoRA
      description: "Stores the caller's LoRA `pending` (`name` = the file name without `.safetensors`, trimmed, cut to 80) and signs a single-use `PUT` link for `u/<caller>/loras/<lora_id>.safetensors` with `Content-Type: application/octet-stream`, valid 15 minutes (`PUT /files/{path}`, the take upload's pattern). 422 `only .safetensors files can be uploaded` (the name must end in `.safetensors`, any case; the bytes are checked at complete), `file is larger than 2 GB` (over 2147483648 bytes). 409 `You have 50 LoRAs; delete some first.` (every own LoRA counts, whatever its state) and 409 `Your LoRAs would use more than 20 GB; delete some first.` (`size_bytes` of the pending and ready ones, deleted ones included until the sweep removes their object a day later, plus this one, over 21474836480). A LoRA still `pending` an hour after it was created is deleted (with its object)."
      requestBody:
        required: true
