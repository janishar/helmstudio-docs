          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/admin/loras/{lora_id}:
    delete:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminDeleteSharedLora
      summary: Queue a delete of a shared LoRA's file on one host (a model job)
      description: "Admin only (403). 202 with the job (kind `lora_delete`, sent to the first env by name whose loras key on that host lists the id); 200 with the existing job when the same delete is queued or running. Every file of that host's index with this SHA-256 is removed; the other envs of the host drop it at their next rescan (at most 60 s). 404 for an id the host does not list (an own LoRA's UUID included: users delete their own with `DELETE /v1/studio/loras/{lora_id}`). 409 `LoRA <name> is part of <title> (pre-fused); delete the model instead`, `LoRA <name> is baked into a loaded component on <host>; unload it first`, `LoRA <name> is in use by a queued or running run on <host>`."
      parameters:
        - $ref: "#/components/parameters/LoraId"
        - name: host
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9]{1,32}$
      responses:
        "200":
          description: The same delete, already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelJob"
        "202":
          description: The job, queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/admin/model-jobs:
