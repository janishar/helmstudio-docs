  /v1/studio/sessions/{session_id}/events:
    get:
      tags:
        - Runs and events
      operationId: studioSessionEvents
      summary: Session events after a cursor — JSON polling, or server-sent events with `Accept text/event-stream`
      description: "The session, oldest first, each numbered by a per-session `seq`. JSON: the events with `seq > since` (at most 500) and `last_seq`. SSE: replays `seq > since` (or `Last-Event-ID`, which wins), then streams new ones; `id:` = seq, `event:` = the event's `type`, `data:` = the `SessionEvent` JSON; `: keep-alive` comments every 15 s. The stream does not end by itself. An `output` event whose output is gone (its take deleted, or the attempt that made it retried) is left out, so seqs may skip; `last_seq` still moves past it."
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Cursor — the last seq the client has
        - name: Last-Event-ID
          in: header
