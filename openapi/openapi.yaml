      operationId: studioCreateTimeline
      summary: New sequence, optionally with its first clips (target defaults from the first clip)
      description: "Creates the sequence (revision 1) and its own session (`session_id`: New shot and Re-render runs go there). Missing `target` fields come from the first take of `take_ids`, else 1280 × 720, 24 fps, 48000 Hz. `take_ids` are added as `POST …/clips` adds them. 409 at 100 sequences (`You have 100 sequences; delete some first.`). 422 `take_ids[2]: take <id> not found` (unknown, another user's, deleted or a pending upload), `name must be 1-80 characters`."
