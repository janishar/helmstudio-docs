  /v1/studio/batches/{batch_id}/rows/{row}/retry:
    post:
      tags:
        - Pipelines and batches
      operationId: studioRetryBatchRow
      summary: Run one failed row again, or any row from one step of its execution ("Retry row from here")
      description: "Sets the row `queued` with `attempt` + 1 (error, run and takes cleared from the row; the old run and its takes The row gets a new run (its idempotency key carries the attempt). A `done` batch becomes `running` again until the row ends. 409 unless the row is `failed`, the batch's `status` is not `failed` or `stopped` and its `control` is not `stop`. With a body `{from_step}` (a pipeline batch): the row re-runs from that step of its current attempt's execution, reusing the state before it. Allowed when the row is `failed`, `succeeded`, `cancelled` or `waiting` (a pending pick is dropped) and the batch is `queued`, `running`, `waiting` or `paused` with `control` not `stop`; else 409 (a `done` batch: `this batch has finished; its checkpoints are gone`). 422 when the step is not in the row's execution or has no state (`row <n> has no step <s>`). `from_step: 1` is the same as no body, for any of those row states."
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/BatchRowN"
