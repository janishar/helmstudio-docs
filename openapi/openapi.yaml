        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/timelines/{timeline_id}:
    get:
      tags:
        - Timelines
      operationId: studioGetTimeline
      description: The sequence at its current revision, normalized, with `takes` (every take it names, signed), offline clips marked and each pending shot's status.
      parameters:
        - $ref: "#/components/parameters/TimelineId"
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum:
              - agent
          description: "`agent` = TimelineAgentView"
      responses:
        "200":
          description: The sequence
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Timeline"
                  - $ref: "#/components/schemas/TimelineAgentView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags:
        - Timelines
      operationId: studioUpdateTimeline
      summary: "An edit: the whole document at the revision it was made on"
      description: "Every edit is a whole-document write: `target` and `tracks` as the editor computed them (the shared edit functions), with the `revision` they were made on. Studio normalizes it (Timeline rules) and stores it as revision + 1; the answer is the normalized sequence. 409 when `revision` is not the current one: `timeline changed since you opened it (now revision <n>)` (re-read, then re-apply the edit). 422 `TimelineError` when a rule fails (`problems`, the first in `detail`), or `{detail}` for a body that does not fit the schema."
      parameters:
        - $ref: "#/components/parameters/TimelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineUpdate"
      responses:
        "200":
          description: The sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/TimelineUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags:
        - Timelines
      operationId: studioPatchTimeline
      summary: Rename, or set the defaults for new shots (no revision; not undone)
      parameters:
        - $ref: "#/components/parameters/TimelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelinePatch"
      responses:
        "200":
          description: The sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags:
        - Timelines
      operationId: studioDeleteTimeline
      summary: Delete a sequence (soft)
      description: Gone from every answer at once; its unfinished exports are cancelled; its runs and batches go on and their takes stay in the gallery. An export take keeps naming it (`Take.export`).
      parameters:
        - $ref: "#/components/parameters/TimelineId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/timelines/{timeline_id}/clips:
    post:
      tags:
        - Timelines
      operationId: studioAddTimelineClips
      summary: '"Add to timeline": append takes in order (no revision needed)'
      description: "Applies the `add` edit to the current revision (so a gallery action never holds a revision) and stores revision + 1. V1 (default): a video take whole (`in` 0, `out` its length), an image take held 3 s. An audio track (`track: A2`…): a video take's sound or an audio take, whole, at the track's end. 422 `take_ids[2]: take <id> not found`, `take_ids[1]: take <id> has no sound` (on an audio track), `take_ids[1]: an image cannot go on an audio track`, `take_ids[1]: an audio take goes on an audio track` (on V1), `unknown track A4`, or a rule (`TimelineError`, e.g. `too_many_clips`)."
      parameters:
        - $ref: "#/components/parameters/TimelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineAddClips"
      responses:
        "200":
          description: The sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/TimelineUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/timelines/{timeline_id}/clips/{clip_id}/actions:
    get:
      tags:
        - Timelines
      operationId: studioListClipActions
      summary: "A clip's take actions: Extend, Retake…, with inputs pre-filled from the clip"
      description: "The clip's take's offers (`…/takes/{take_id}/uses`) restricted to templates of the family of the workflow that made the take (an upload, import or export: every family), with `start` / `end` (the selection in sequence seconds; absent = the clip's extent; clamped to the clip) mapped to the take's own time (t − `at` + `in`), snapped to the take's frames, for every `span` param and a `trim` media param's in / out. `ltx-extend` only at an end of the take: `extend.direction` `after` when the range ends at the take's end (within one frame), else `before` when it starts at 0, else not offered. Run one with `POST …/shots` (`slot {clip}` = replace; insert: `slot {after: <clip>}`, an extend before `slot {at: <clip's at>}`). Empty for an empty slot, an offline clip or a take nothing fits. 404 unknown sequence; 422 `unknown clip <id>`, `start must be before end`. family into one `media` param (not rows) of a workflow whose media is video (Audio to video: `ltx-audio-to-video`, `echo-a2v`), with the range = the selection or the clip's in..out (an audio take snapped to whole ms, a video's sound to its frames; the offer caps the part at the param's `max_s`, 13.375 s) and `slot {at: <the clip's at>, length: <out − in>, exact: true}`: run it with `POST …/shots` and that slot. 422 `clip <id> is not on V1` is gone (A1 is V1's own sound, not a track: it has no clips of its own)."
      parameters:
        - $ref: "#/components/parameters/TimelineId"
        - name: clip_id
          in: path
          required: true
          schema:
            type: string
          description: "A slot id: V1, or an audio track's clip"
        - name: start
          in: query
          required: false
          schema:
            type: number
            minimum: 0
          description: The selection's start, sequence seconds
        - name: end
