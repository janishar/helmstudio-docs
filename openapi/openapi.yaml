      operationId: studioReuseTake
      summary: The settings that made a take, to pre-fill Create
      description: "`workflow_id` and `inputs` = `made_with.inputs` (every param, the seed the runner used instead of random), ready to post as a `RunRequest` or to load into the form; image values come back as recorded (`{take_id}`), so a reference deleted since makes that request 422. Nothing is created. 409 for an upload or an import (it has no settings). `workflow_status` compares the workflow now with the one that made the take: `current` (a template still published, or a user workflow at `made_with.workflow_version`), `changed` (a user workflow edited since: keys that are no longer a settable param of it are dropped from `inputs`, the rest kept), `deleted` (no longer published, or deleted: `inputs` as recorded; a run of it is 422). With elements: `inputs` = `made_with.inputs` with `made_with.typed` laid over it, so the prompt comes back as typed (with its mentions) and the reference rows without the element images; `elements_status` says, per element of `made_with.elements`, whether running it again would resolve the same (`current`), differently (`changed`: edited since) or not at all (`deleted`). With LoRAs: `inputs` hold them as recorded (`{lora_id}`); `loras_status` says, per `made_with.loras` entry, `current` (the caller can use it now), `missing` (shared: no live host lists it now; it may come back) or `deleted` (own: deleted since). Running a missing or deleted one is 422 (`… LoRA <id> not found`). With looks: `inputs` come back without what the looks added (the typed view), `looks` = the ids of `made_with.looks` (send them as RunRequest.looks), `looks_status` per look: `current`, `changed`, `deleted` (own) or `missing` (starter, no live host publishes it now)."
      parameters:
