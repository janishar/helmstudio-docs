openapi: 3.1.0
info:
  title: helmstudio API
  version: 1.59.0
  description: The HTTP API of helmstudio, served through its gateway. See the API overview for authentication, errors and live updates.
servers:
  - url: http://localhost:8300
    description: A local install (the gateway)
security:
  - ApiKey: []
    BearerJWT: []
tags:
  - name: Auth
  - name: Sessions
  - name: Workflows
  - name: Runs and events
  - name: Takes and uploads
  - name: Files
  - name: Library and LoRAs
  - name: Pipelines and batches
  - name: Timelines
  - name: Assistant
  - name: Models and hosts
  - name: "Admin: users and API keys"
  - name: "Admin: models and hosts"
  - name: "Admin: AI providers"
paths:
  /v1/studio/sessions:
    get:
      tags:
        - Sessions
      operationId: studioListSessions
      summary: The caller's sessions, newest first (at most 100, not paginated)
      description: "`naming` says how new sessions get their title, so Create can say so before a prompt leaves the machine."
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Sessions
      operationId: studioCreateSession
      summary: A new, empty session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/sessions/{session_id}:
    get:
      tags:
        - Sessions
      operationId: studioGetSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags:
        - Sessions
      operationId: studioRenameSession
      description: "A rename makes the title the user's (`title_source` user, `named_by` null): the namer never replaces it."
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPatch"
      responses:
        "200":
          description: The renamed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags:
        - Sessions
      operationId: studioDeleteSession
      summary: Delete a session with its runs and events
      description: 409 while one of its runs is queued or running (cancel it first), or while a batch in it is queued, running or paused (stop it first). Its takes stay in the gallery with `session_id` and `run_id` set to null (`made_with` is a snapshot); its finished batches stay with `session_id` and their rows' `run_id` set to null.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/workflows:
    get:
      tags:
        - Workflows
      operationId: studioListWorkflows
      summary: The templates the runners publish in the registry, then the caller's own workflows
      description: "Whether or not a host with that env is live now (`GET /v1/studio/hosts` tells); the same id from several hosts is listed once; sorted by title. Then the caller's own workflows (`source: mine`, at most 200), newest `updated_at` first. `problems` is never in a list (only `GET /v1/studio/workflows/{workflow_id}`)."
      parameters:
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkflowSource"
          description: Only templates or only the caller's own; absent = both
        - name: media
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkflowMedia"
          description: Only workflows whose takes are images, videos or audio (the Image / Video / Audio switch); absent = all three. Another value is 422
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Workflows
      operationId: studioCreateWorkflow
      summary: Save a workflow of the caller's own, from a whole document or as a copy of another
      description: "Two forms (`WorkflowCreate`): a whole document (`title`, `family`, `env`, `nodes`, optional `studio`, optional `based_on`), or `{based_on, title?}` to copy a template or one of the caller's workflows (nodes, positions, studio, family, env; `title` absent = `<source title> copy`, cut to 80 characters). The new workflow's id is a UUID, `version` 1. The document is checked with the graph rules: any problem that blocks saving is 422 `WorkflowError` with every problem; problems that only block running (`unknown_kind`, `env_mismatch`, `required_input`, `no_output`) do not stop the save and are in the answer's `problems`. 404 when `based_on` is unknown or another user's. 409 when the caller already has 200 workflows (`You have 200 workflows; delete some first.`). 503 while studio's registry watches have not delivered yet."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreate"
      responses:
        "201":
          description: The workflow, with problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/workflows/validate:
    post:
      tags:
        - Workflows
      operationId: studioValidateWorkflow
      summary: Check a workflow document with the graph rules without saving it
      description: "Runs every graph rule against the live node palette (`GET /v1/studio/nodes`) and answers every problem, with `can_save` and `can_run`. A body that does not fit `WorkflowDoc` (the JSON schema: a node id that is not a slug, a missing `kind`, …) is a plain 422 `{detail}`; graph problems are never a 422 here. 503 while studio's registry watches have not delivered yet."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDoc"
      responses:
        "200":
          description: The problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/workflows/{workflow_id}:
    get:
      tags:
        - Workflows
      operationId: studioGetWorkflow
      description: "A template (a registry slug) or one of the caller's workflows (a UUID; another user's is 404), with `node_schemas` for every kind of its nodes found in the registry (live or not; a kind no runner publishes at all is left out) and `problems`: the graph rules against the live palette now (an offline env makes its kinds `unknown_kind`)."
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: The workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags:
        - Workflows
      operationId: studioReplaceWorkflow
      summary: Replace one of the caller's workflows with an edited document
      description: "Optimistic concurrency: `version` is the version the edit started from. When it is not the stored version, 409 `workflow changed since you opened it (now version <n>)` and nothing changes; the client reloads and re-applies. On success `version` + 1 and `updated_at` now. Checked like POST: save-blocking problems are 422 `WorkflowError`. Runs, batches and takes made before keep their snapshot. 409 for a template id (`templates cannot be changed; save a copy`). 404 for another user's."
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: The workflow, with problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags:
        - Workflows
      operationId: studioRenameWorkflow
      summary: Rename one of the caller's workflows
      description: "`version` + 1 (an editor holding the old version gets 409 on its next PUT). 409 for a template id."
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowPatch"
      responses:
        "200":
          description: The workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags:
        - Workflows
      operationId: studioDeleteWorkflow
      summary: Delete one of the caller's workflows
      description: "409 while a run of it is `queued` or `running` (`a run of this workflow is unfinished; cancel it or wait`) or a batch of it is `queued`, `running` or `paused` (`a batch of this workflow is unfinished; stop it or wait`), and for a template id. Past runs, batches and takes keep their snapshots; reuse of their takes answers `workflow_status: deleted`. Deleting again is 404."
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/nodes:
    get:
      tags:
        - Workflows
      operationId: studioListNodes
      summary: The node palette — every node kind a live runner publishes now, grouped by family
      description: "A kind published by several live hosts or envs is listed once, with every env (`envs`) and the schema of the newest `published_at`. Groups: core kinds (`family: null`, title `Core`) first, then each family sorted by title (the model title from the family's live `models` entry, else the family id); kinds in a group in the order the newest publisher lists them. `env` keeps only kinds that env publishes. 503 while studio's registry watches have not delivered yet."
      parameters:
        - name: env
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z0-9]{1,32}$
          description: Only kinds this env publishes (a workflow's env); absent = all
      responses:
        "200":
          description: The palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePalette"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/pipelines:
    get:
      tags:
        - Pipelines and batches
      operationId: studioListPipelines
      summary: The caller's pipelines, newest `updated_at` first (at most 100, not paginated)
      description: Each with `workflow_titles` and `last_batch`; `problems` is never in a list (only `GET /v1/studio/pipelines/{pipeline_id}`).
      responses:
        "200":
          description: Pipelines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Pipelines and batches
      operationId: studioCreatePipeline
      summary: Save a pipeline, from a whole document or as a copy of one of the caller's pipelines
      description: "Mirrors `POST /v1/studio/workflows`. Two forms (`PipelineCreate`): a whole document (optional `based_on`), or `{based_on, title?}` to copy one of the caller's pipelines (\"Duplicate\"; `title` absent = `<source title> copy`, cut to 80 characters). The new pipeline's id is a UUID, `version` 1. Checked with the pipeline rules as the caller: any save-blocking problem is 422 `PipelineError` with every problem; run-blocking problems are saved and returned in `problems`. 404 when `based_on` is unknown or another user's. 409 when the caller already has 100 pipelines (`You have 100 pipelines; delete some first.`). 503 while studio's registry watches have not delivered yet."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineCreate"
      responses:
        "201":
          description: The pipeline, with problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PipelineUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/pipelines/validate:
    post:
      tags:
        - Pipelines and batches
      operationId: studioValidatePipeline
      summary: Check a pipeline document with the pipeline rules without saving it
      description: Every pipeline rule, as the caller (the workflows it names are looked up among the templates and the caller's workflows, each checked with the graph rules against the live palette). A body that does not fit `PipelineDoc` is a plain 422 `{detail}`; pipeline problems are never a 422 here. 503 while studio's registry watches have not delivered yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineDoc"
      responses:
        "200":
          description: The problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/pipelines/{pipeline_id}:
    get:
      tags:
        - Pipelines and batches
      operationId: studioGetPipeline
      description: One of the caller's pipelines (another user's is 404) with `problems` against the workflows and the live palette now.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: The pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags:
        - Pipelines and batches
      operationId: studioReplacePipeline
      summary: Replace one of the caller's pipelines with an edited document
      description: "Like `PUT /v1/studio/workflows/{workflow_id}`: `version` is the version the edit started from; stale = 409 `pipeline changed since you opened it (now version <n>)` and nothing changes. On success `version` + 1 and `updated_at` now. Save-blocking problems are 422 `PipelineError`. Batches made before keep their snapshot."
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineUpdate"
      responses:
        "200":
          description: The pipeline, with problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PipelineUnprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      tags:
        - Pipelines and batches
      operationId: studioRenamePipeline
      summary: Rename one of the caller's pipelines
      description: "`version` + 1 (an editor holding the old version gets 409 on its next PUT)."
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelinePatch"
      responses:
        "200":
          description: The pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags:
        - Pipelines and batches
      operationId: studioDeletePipeline
      summary: Delete one of the caller's pipelines
      description: 409 while a batch of it is `queued`, `running`, `waiting` or `paused` (`a batch of this pipeline is unfinished; stop it or wait`). Past batches and takes keep their snapshots. Deleting again is 404.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/pipelines/{pipeline_id}/judge-tests:
    post:
      tags:
        - Pipelines and batches
      operationId: studioCreateJudgeTest
      summary: Test a judge of the saved pipeline on takes the caller picks (the Judge panel's Test on takes)
      description: "One ask run of the judge as saved (criteria, keep, model, memory: the pipeline's memory now), on 1 to 8 of the caller's image or video takes in the order given; nothing is stored in memory and no batch is made. The brief is the first take's prompt. Studio resolves the model as at Submit (a `server:` or `remote:` `prompt`, 5 s: else 503) and makes an interactive run of the ask workflow in the first take's session (else the caller's newest session; none: 422). 202 with the test `queued` (or `failed` at once with no live host); Another user's pipeline or take: 404; a node that is not a judge, a take that is not an image or video: 422; too many open runs: 409."
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeTestCreate"
      responses:
        "202":
          description: The test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeTest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/judge-tests/{test_id}:
    get:
      tags:
        - Pipelines and batches
      operationId: studioGetJudgeTest
      summary: A judge test, with each take's verdict and reason once its run has answered
      description: "`status` follows the ask run. Once it succeeded, pipelines derives the verdict from the answer and studio keeps it; an answer that fails the checks is `failed` with that error (a test never re-asks)."
      parameters:
        - name: test_id
          in: path
          required: true
          schema:
            type: string
          description: Judge test UUID (unknown, another user's or malformed = 404)
      responses:
        "200":
          description: The test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JudgeTest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/library:
    get:
      tags:
        - Library and LoRAs
      operationId: studioListLibrary
      summary: The caller's library items and the starter looks of the live hosts (not paginated); the `@` menu searches it with `q`, the visual picker asks with `workflow`
      description: "The caller's own items (at most 200) plus every starter look a live host publishes. Filters combine with AND. `q` (trimmed, a leading `@` dropped, lower-cased; blank = no filter) matches an item whose `handle` starts with it or whose `name`, lower-cased, starts with it. `source` keeps one source; `family` keeps the items whose `family` is null or equal to it. Order: with `q`, the item whose handle equals it first, then by `handle` (code points; null handles last), then `name`; without `q`, own items newest `updated_at` first, then starter looks by `name` (code points), then `id`. `limit` cuts the list (the `@` menu asks for 8). Images of deleted takes are left out of every item. `workflow` (a template slug or one of the caller's workflow UUIDs; 422 `unknown workflow <id>`) filters nothing: it adds `fits` and `reason` to every item, against that workflow's graph and the caller's LoRAs now; the picker greys the items that do not fit with the reason. items); `kind=voice` keeps only voices. With `workflow`, a voice's `fits` / `reason` is the voice fit (`this workflow takes no voice`, `this workflow cannot use a designed voice`, `this workflow cannot use a preset voice`, `this workflow cannot clone a voice`, `voice <name> is for <family>`), and in a workflow whose media is audio every look answers `looks do not apply to speech` and every element `mentions are not read aloud; use a dialogue script`."
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LibraryKind"
        - name: group
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LibraryGroup"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
          description: Prefix of a handle or a name
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LibrarySource"
        - name: family
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: "Items for this family: `family` null or equal"
        - name: workflow
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: Annotate every item with `fits` / `reason` for this workflow
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItemList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Library and LoRAs
      operationId: studioCreateLibraryItem
      summary: Make an element from 1 to 4 of the caller's gallery images, a look (also "Save as look" on a take) or a voice (also "Save as voice")
      description: "Looks: `group` film|camera|colour|lighting, no handle, 0-4 images (checked as an element's), 0-4 `loras`, at least one of text, an image, a LoRA. 422 `group <g> is not a look group` (or `… is not an element group`), `a look has no handle`, `a look needs text, an image or a LoRA`, `loras: a look has at most 4 LoRAs`, `loras[2]: LoRA <name> is listed twice`, `loras: an element has no LoRAs`, `from_take makes looks and voices only`, `from_take: take <id> was not made by a run` (an upload); 404 `loras[2].lora: LoRA <id> not found` (unknown, another user's, deleted, pending, rejected, or shared and listed by no live host), `from_take: take <id> not found` (unknown, another user's, deleted). `from_take` fills `text` (option `prompt`) and `loras` (option `loras`) when the body leaves them out, then every rule above applies. Looks count in the same 200 items as elements; handle uniqueness concerns elements only. `name` and `text` are trimmed. 422: `name must be 1-80 characters`, `handle must be a slug: a-z, 0-9, - and _, starting with a letter, ending with a letter or digit, at most 40 characters`, `text must be at most 2000 characters` (code points), `name must not contain control characters`, `text must not contain control characters other than newlines and tabs`, `images: an element has 1 to 4 images`, `images[2]: take <id> is listed twice`, `images[2]: take <id> is not an image`, `images[2]: take <id> has no size` (items from 1). 404 `images[2]: take <id> not found` for a take that is unknown, another user's, deleted or a pending upload. 409 `handle @<handle> is already used` (unique per owner, over every kind), 409 `You have 200 library items; delete some first.` 201 with `version` 1. Voices: only `group: designed` can be made (`name`, `voice {design, language?, style?}`); the item's `voice.source` is `designed`, `handle` null, `text` \"\", no images or LoRAs; voices count in the same 200 items. 422 `group <g> is not a voice group`, `preset voices come from packs`, `cloned voices are not available yet` (group cloned), `a voice has no handle`, `a voice has no text; describe it in voice.design`, `images: a voice has no images`, `loras: a voice has no LoRAs`, `voice: a designed voice needs voice.design`, `voice.design must be 1-2000 characters`, `voice.language: <tag> is not a BCP 47 language tag`, `voice.style must be at most 500 characters`, `voice.design must not contain control characters other than newlines and tabs`, `voice: only a voice has voice fields` (an element or look with `voice`). of the caller's voices or a starter voice a live host publishes, resolved as the caller. 422 `voice_id: only a character has a voice` (a location, prop, look or voice with a non-null `voice_id`); 404 `voice_id: voice <id> not found` (unknown, another user's, deleted, an element or look, or a starter voice no live host publishes). Its fit is not checked here (a dialogue's run checks it per line). PUT checks the same. MediaRef, consent: true, language?, style?}`; a designed voice may carry a clip too (then it also needs `consent`). The clip is checked like a `media` param with `accepts: [audio]`, `trim`, `min_s` 3, `max_s` 30 (in / out snapped, missing in = 0, out = min(duration, 30)) and stored as the take id with the snapped in / out; the voice's `from_take_id` is that take. \"Save as voice\" = `from_take {take_id, in?, out?}` with `kind: voice`: the take (an audio take or a video with sound, an upload included) is the clip; with `group: designed` and no `voice.design` the design, language and style are copied from the first designed voice in the take's `made_with.voices`. 404 `voice.clip: take <id> not found` / `from_take: take <id> not found` (unknown, another user's, deleted, pending). 422 `cloned voices are not available yet` is gone; new: `voice: a cloned voice needs voice.clip`, `voice.design: a cloned voice has no design`, `voice.clip: give the clip or from_take, not both`, `voice.consent: tick \"I have the right to use this voice\"` (a clip without `consent: true`), `from_take: take <id> was not made with a designed voice` (group designed, no `voice.design`, none in `made_with.voices`), `from_take: voice <name> was deleted` (that designed voice is gone), `from_take: a look takes the whole take (no in or out)`, and the media texts under `voice.clip: ` or `from_take: ` (`take <id> has no sound`, `take <id> lasts <d> s; this input takes at least 3.0 s`, `in must be before out`, `out <x> is past the take's end <d>`, `the part lasts <d> s; this input takes at most 30.0 s`, `the part lasts <d> s; this input takes at least 3.0 s`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryItemCreate"
      responses:
