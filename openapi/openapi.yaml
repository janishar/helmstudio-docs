    TakePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed; blank = 422
        starred:
          type: boolean
    TakeRef:
      type: object
      required:
        - id
        - kind
        - title
        - thumb_url
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TakeKind"
        title:
          type: string
          maxLength: 200
        thumb_url:
          $ref: "#/components/schemas/SignedUrl"
          description: The take's thumbnail (Take.thumb_url)
    TakeUse:
      type: object
