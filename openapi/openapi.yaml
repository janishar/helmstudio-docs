      operationId: studioAdminGetProviderKey
      summary: Is a provider's key file there? (never the key)
      description: Admin only (403). Studio asks `pipelines.providers.key` (5 s, else 503); pipelines stats the file in its key folders and never opens it. `path` is the deploy-side text, never a container path. 404 for a malformed name.
      parameters:
        - name: key_secret
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      tags:
        - "Admin: AI providers"
      operationId: studioAdminSaveProviderKey
      summary: Save a provider's key — checked with the provider, then written to the key file (never read back)
      description: ". Admin only (403). The body names one source, as Fetch does: `preset` (studio takes its `kind`, `base_url` and `compat` from the presets file) or `provider` (a saved provider's row); never a URL from the browser (a `base_url` is 422). Studio asks `pipelines.providers.key.write` (30 s, else 503): pipelines lists `GET <base_url>/models` with the key in memory (the host rule and the remote switch as for any call, 15 s), and `check` is `ok` (written), `refused` (401 or 403: nothing written), `unreachable` (anything else: nothing written; `detail` is our own short reason) or `skipped` (`force: true`: written without a call). The key is trimmed, then 1-1024 printable ASCII characters only (0x21-0x7E: no spaces, no `…`, curly quote, non-breaking or zero-width space), written into the first key folder only (temp file and rename, owner-only) and never returned or logged. 404 malformed name, unknown preset or provider; 422 a bad key (the detail names the rule, never the value; a character outside 0x21-0x7E is always `the key has a character keys never have (like … or a curly quote): copy it again from the provider`), both or neither source, an unknown field; 409 `keys are set in files on this deployment` (not writable) or a folder of that name."
      parameters:
        - name: key_secret
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderKeySave"
      responses:
        "200":
          description: The check and the status after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKeySaved"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags:
        - "Admin: AI providers"
      operationId: studioAdminRemoveProviderKey
      summary: Remove a provider's key file (the provider then shows Missing)
      description: ". Admin only (403). Studio asks `pipelines.providers.key.write` with `op: remove` (5 s, else 503); pipelines deletes the file of that name in its first key folder only (missing is fine). The answer is the status after it: `found` stays true when a later key folder still has a file of that name. 404 malformed name; 409 not writable."
      parameters:
        - name: key_secret
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The status after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
