            - $ref: "#/components/schemas/SignedUrl"
            - type: "null"
    TimelineList:
      type: object
      required:
        - timelines
      properties:
        timelines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TimelineSummary"
    TimelineSlot:
      description: "Where a New shot goes: an existing V1 slot (an empty slot is filled; a take's clip is redone: \"from this clip\"; a take action's \"replace\"), a new empty slot at the V1 cut nearest `at` of `length` seconds, or a new empty slot of `length` right after V1 clip `after`"
      oneOf:
        - type: object
          required:
            - clip
          additionalProperties: false
          properties:
            clip:
              $ref: "#/components/schemas/TimelineClipId"
        - type: object
          required:
            - after
            - length
          additionalProperties: false
          properties:
            after:
              $ref: "#/components/schemas/TimelineClipId"
            length:
              type: number
              exclusiveMinimum: 0
              maximum: 3600
              description: The placeholder's length until the take fills it (the client's estimate)
            id:
              $ref: "#/components/schemas/TimelineClipId"
              description: The new slot's id; absent = studio makes one
        - type: object
          required:
            - at
            - length
          additionalProperties: false
          properties:
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            length:
              type: number
              exclusiveMinimum: 0
              maximum: 3600
            id:
              $ref: "#/components/schemas/TimelineClipId"
              description: The new slot's id; absent = studio makes one
            exact:
              type: boolean
              const: true
              description: "(Make shot): the `place` edit, the slot at exactly frames(at), not the nearest cut"
    TimelineLineSlot:
      description: "Where a New line goes: a placeholder on audio track `track` at `at` (the playhead) of `length` seconds (the client's estimate, the template's planned seconds), or an existing audio clip to redo"
      oneOf:
        - type: object
          required:
            - clip
          additionalProperties: false
          properties:
            clip:
              $ref: "#/components/schemas/TimelineClipId"
        - type: object
          required:
            - track
            - at
            - length
          additionalProperties: false
          properties:
            track:
              type: string
              pattern: ^A[2-9]$
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            length:
              type: number
              exclusiveMinimum: 0
              maximum: 600
            id:
              $ref: "#/components/schemas/TimelineClipId"
              description: The placeholder's id; absent = studio makes one
    TimelineLineCreate:
      type: object
      required:
        - slot
        - run
      additionalProperties: false
      description: New line (POST …/timelines/{id}/lines)
      properties:
        slot:
          $ref: "#/components/schemas/TimelineLineSlot"
        run:
          $ref: "#/components/schemas/RunRequest"
          description: "The docked voice composer's run: a voice-over or dialogue template (media audio), prefilled with the sequence's cast as a script"
    TimelineShotCreate:
      type: object
      required:
        - slot
        - run
      additionalProperties: false
      properties:
        slot:
          $ref: "#/components/schemas/TimelineSlot"
        run:
          $ref: "#/components/schemas/RunRequest"
          description: "As the docked composer sends it: the sequence's defaults, and the first/last keyframe rows bound to frame takes (POST /v1/studio/takes/{take_id}/frame) when those options are on"
    TimelineShot:
      type: object
      required:
        - timeline
        - run
      properties:
        timeline:
          $ref: "#/components/schemas/Timeline"
        run:
          $ref: "#/components/schemas/Run"
    TimelineRerender:
      type: object
      required:
        - revision
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        clips:
          type: array
          minItems: 1
          maxItems: 22
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TimelineClipId"
          description: V1 clips to re-render; absent = every V1 clip with a take
        preset:
          type: string
          minLength: 1
          maxLength: 40
          description: A preset every selected clip's workflow has in `studio.presets` (for example final); applied over the clip's own settings; absent = the clip's own settings and seed
    TimelineRerenderAnswer:
      type: object
      required:
        - timeline
        - batch
      properties:
        timeline:
          $ref: "#/components/schemas/Timeline"
        batch:
          $ref: "#/components/schemas/Batch"
    TimelineExportCreate:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: "Export: required (409 when not current)"
        host:
          type: string
          pattern: ^[a-z0-9]{1,32}$
          description: Run it on this host (one of its envs with `media`); absent = automatic
    ExportReason:
      type: object
      required:
        - code
        - clip
        - message
      properties:
        code:
          type: string
          enum:
            - gap
            - image
            - transition
            - not_probed
            - container
            - codec
            - pixel_format
            - size
            - aspect
            - field_order
            - frame_rate
            - trimmed
            - profile
            - level
            - time_base
            - colour
            - parameter_sets
            - offline
            - empty
            - too_large
            - no_host
        clip:
          oneOf:
            - $ref: "#/components/schemas/TimelineClipId"
            - type: "null"
        message:
          type: string
          examples:
            - Shot 2 is 704 × 448; the sequence is 1280 × 704
    ExportPlan:
      type: object
      required:
        - revision
        - stream_copy
        - reasons
        - blocked
        - output
        - frames
        - duration_s
        - estimated_bytes
        - host
        - env
        - hardware
      properties:
        revision:
          type: integer
          minimum: 1
        stream_copy:
          type: boolean
          description: The picture is copied as it is; the sound is always re-encoded
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/ExportReason"
          description: Why the picture must be re-encoded, per V1 clip in order; empty with stream_copy
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/ExportReason"
          description: Why it cannot export now (offline clips, empty, no host); empty = it can
        output:
          type: object
          required:
            - width
            - height
            - fps
            - sample_rate
            - container
            - video_codec
            - audio_codec
            - video_bitrate
          properties:
            width:
              type: integer
            height:
              type: integer
            fps:
              type: number
            sample_rate:
              type: integer
            container:
              type: string
              const: mp4
            video_codec:
              type: string
              const: h264
            audio_codec:
              type: string
              const: aac
              description: AAC-LC 192 kb/s stereo
            video_bitrate:
              type:
                - integer
                - "null"
              description: "Re-encode: bits per second; null for a stream copy"
        frames:
          type: integer
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        estimated_bytes:
          type: integer
          minimum: 0
        sounds:
          type: array
          maxItems: 1000
          description: "(always sent): every sound the mix reads, V1 then the audio tracks in order (V1 video clips with sound and audio-track clips with a take; not muted, not offline), with the facts each is resampled from: every one is resampled to `output.sample_rate` and up-mixed to stereo before the mix"
          items:
            type: object
            required:
              - clip
              - track
              - sample_rate
              - channels
            properties:
              clip:
                $ref: "#/components/schemas/TimelineClipId"
              track:
                type: string
                pattern: ^(V1|A[2-9])$
              sample_rate:
                type:
                  - integer
                  - "null"
                description: "An audio take's own rate (`audio.sample_rate`: 24000, 44100); null when studio does not know it (a video's sound, an upload): ffmpeg reads it"
              channels:
                type:
                  - integer
                  - "null"
                description: 1 for an audio take made by a run (mono WAV); null when not known
        host:
          type:
            - string
            - "null"
          description: The env that would run it now (automatic choice, or the named host's); null when none
        env:
          type:
            - string
            - "null"
        hardware:
          type:
            - boolean
            - "null"
          description: "True: a hardware encoder; false: software (libx264); null without a host"
    MediaJobKind:
      type: string
      enum:
        - export
        - frame
    MediaJobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    MediaJob:
      type: object
      required:
        - id
        - kind
        - status
        - host
        - env
        - timeline_id
        - revision
        - source_take_id
        - mode
        - progress
        - take_id
        - failure
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/MediaJobKind"
        status:
          $ref: "#/components/schemas/MediaJobStatus"
        host:
          type: string
        env:
          type: string
        timeline_id:
          type:
            - string
            - "null"
          format: uuid
          description: "Export: the sequence"
        revision:
          type:
            - integer
            - "null"
          minimum: 1
          description: "Export: the revision exported"
        source_take_id:
          type:
            - string
            - "null"
          format: uuid
          description: "Frame: the video take"
        mode:
          type:
            - string
            - "null"
          enum:
            - copy
            - conform
            - null
          description: "Export: what was planned (copy = picture stream copy); once it ended, what the runner did (copy can fall back to conform)"
        reason:
          type:
            - string
            - "null"
          description: "Export: why the runner fell back to conform; null otherwise"
        progress:
          oneOf:
            - type: object
              required:
                - frames
                - total
              properties:
                frames:
                  type: integer
                  minimum: 0
                total:
                  type: integer
                  minimum: 1
            - type: "null"
          description: "Export: frames written of the sequence's frames (a succeeded export: all of them); null before the first progress and for frame jobs"
        take_id:
          type:
            - string
            - "null"
          format: uuid
          description: "Succeeded: the take it made (an export: a video take, source export; a frame: an image take, source frame)"
        failure:
          oneOf:
            - type: object
              required:
                - class
                - detail
              properties:
                class:
                  type: string
                  enum:
                    - input
                    - invalid
                    - ffmpeg
                    - verify
                    - internal
                    - host_lost
                  description: "Host_lost: its host stopped responding; export again: another live host is chosen"
                detail:
                  type: string
            - type: "null"
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
    MediaJobList:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MediaJob"
    TakeFrameRequest:
      type: object
      required:
        - at
      additionalProperties: false
      properties:
        at:
          type: string
          enum:
            - first
            - last
    TakeFrame:
      type: object
      description: "Exactly one: `take` (200), or `job` (202) whose `take_id` is the frame take once it succeeded"
      oneOf:
        - required:
            - take
        - required:
            - job
      properties:
        take:
          $ref: "#/components/schemas/Take"
        job:
          $ref: "#/components/schemas/MediaJob"
    TakeFrameOf:
      type: object
      required:
        - take_id
        - at
      properties:
        take_id:
          type: string
          format: uuid
          description: The video take (it may be deleted since)
        at:
          type: string
          enum:
            - first
            - last
    TakeExport:
      type: object
      required:
        - timeline_id
        - timeline_name
        - revision
        - job_id
        - mode
      properties:
        timeline_id:
          type: string
          format: uuid
          description: The sequence (it may be deleted since)
        timeline_name:
          type: string
          description: As it was when exported
        revision:
          type: integer
          minimum: 1
        job_id:
          type: string
          format: uuid
        mode:
          type: string
          enum:
            - copy
            - conform
    WorkflowKeyframes:
      oneOf:
        - type: object
          required:
            - param
            - image
            - seconds
            - last
          additionalProperties: false
          properties:
            param:
              type: string
              examples:
                - keyframes.images
            image:
              type: string
              description: The rows' Image field
              examples:
                - image
            seconds:
              type: string
              description: "The rows' `position: seconds` field"
              examples:
                - seconds
            last:
              type: boolean
              description: "It takes 2 rows or more: \"End on the next clip's first frame\" is offered"
        - $ref: "#/components/schemas/WorkflowFrameParams"
    WorkflowFrameParams:
      type: object
      required:
        - first
        - last
      additionalProperties: false
      description: "The image param the previous clip's last frame goes into, and the one the next clip's first frame goes into (null: \"End on the next clip's first frame\" is not offered)"
      properties:
        first:
          $ref: "#/components/schemas/StudioPath"
        last:
          oneOf:
            - $ref: "#/components/schemas/StudioPath"
            - type: "null"
      examples:
        - first: first.image
          last: last.image
    SigninRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: Normalised like sign-up; a malformed one is just a failed sign-in (401)
        password:
          type: string
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Empty = 401
    PasswordChange:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 256
          description: Common passwords are refused
    User:
      type: object
      required:
        - id
        - email
        - name
        - roles
        - disabled
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          description: Sorted; may be empty
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserList:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    Session:
      type: object
      required:
        - access_token
        - refresh_token
        - user
      properties:
        access_token:
          type: string
          description: RS256 JWT (kid in the header; claims iss, sub, email, roles, jti, fid = session family, iat, exp); ACCESS_TTL, default 15 min
        refresh_token:
          type: string
          description: Opaque; REFRESH_TTL, default 30 days; single use, rotated by /auth/refresh
        user:
          $ref: "#/components/schemas/User"
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
              - kty
              - use
              - alg
              - kid
              - n
              - e
            properties:
              kty:
                const: RSA
              use:
                const: sig
              alg:
                const: RS256
              kid:
                type: string
              n:
                type: string
                description: Base64url modulus
              e:
                type: string
                description: Base64url exponent
    Role:
      type: string
      enum:
        - user
        - dev
        - admin
      description: "User: the studio; dev: also developer views"
    GrantableRole:
      type: string
      enum:
        - user
        - dev
      description: A role the admin can give
    UserCreate:
      type: object
      required:
        - email
        - password
        - roles
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lower-cased; a plain address
        password:
          type: string
          minLength: 10
          maxLength: 256
          description: Common passwords are refused (422 "password is too common")
        name:
          type: string
          maxLength: 200
          description: Trimmed; empty or missing = the part of the email before @
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GrantableRole"
    DisabledRequest:
      type: object
      required:
        - disabled
      properties:
        disabled:
          type: boolean
          description: True disables (and revokes all sessions), false re-enables; a missing field reads as false
    RolesRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GrantableRole"
          description: Replaces the roles; duplicates are ignored
    PasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 256
          description: Common passwords are refused
    ApiKeyCreate:
      type: object
      required:
        - client
      properties:
        client:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          description: Client name; created if new
        scopes:
          type:
            - array
            - "null"
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          description: Default []
    ApiKey:
      type: object
      required:
        - id
        - client_id
        - client
        - prefix
        - scopes
        - created_at
        - revoked_at
        - last_used_at
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        client:
          type: string
        prefix:
          type: string
          description: First 12 characters of the key ("helm_" + 7), for recognising it
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
          description: Updated at most once a minute
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              pattern: ^helm_[A-Za-z0-9_-]{43}$
              description: The raw key; returned only here
    ApiKeyList:
      type: object
      required:
        - api_keys
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
