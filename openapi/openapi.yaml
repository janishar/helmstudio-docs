      description: "Admin only (403). Studio builds the provider from the preset file (its `kind`, `base_url` and `compat`; never a URL from the browser: a body with `base_url` is 422), `key_secret` from the body or the preset, `timeout_s` 15, and asks `pipelines.providers.test` without a model (30 s, else 503). The host rule and the remote switch apply as for Test: a remote preset while the switch is off is 200 with ok false and failure `off`. 404 for an unknown preset. A saved provider fetches through `POST /v1/studio/admin/providers/{name}/test` without `model`."
