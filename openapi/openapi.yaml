  /v1/studio/admin/hosts/{host}/pins:
    put:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminPutHostPins
      summary: Replace the host's pinned components
      description: "Admin only (403). Replaces the pins (duplicates collapsed), `version` + 1, published like the settings. A first PUT creates the row with the other settings copied from the freshest key's `policy`. A pin keeps its entry loaded (keep_pinned, the idle unload) and is a hand-over victim only as the last resort (after every unpinned one, when the run would not fit otherwise: a pin never fails or holds a run; `Run.unloads_pinned` says so first); an admin unload still unloads it. An unloaded pin stays set. A pin need not be resident now. 404 for a host with no present hosts key. 422 `env <env> is not on host <host>`, `<model> is not published by <host>.<env>`."
      parameters:
        - $ref: "#/components/parameters/HostName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostPins"
      responses:
