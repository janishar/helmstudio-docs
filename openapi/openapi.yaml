      operationId: studioAdminDownloadModel
      summary: Queue a download of a variant's weights to one host (a model job)
      description: "Admin only (403). 202 with the new job, `queued`; 200 with the existing job when a download of the same (host, model, variant) is already queued or running (idempotent). The runner of the env whose models key lists the model on that host fetches the variant's `source` (and any shared component of its owner variant not already on the host with matching hashes) into `<models root>/<dir>/` as plain files. 404 for a model no host publishes. 422 `host <host> has no env for <model>`, `<model> has no variant <variant>`, `<title> <variant> has no download source`, `licence <id> must be accepted` (the variant's `source.must_accept` and `accept_licence` not true). 409 `<title> <variant> is already on <host>` (state present), `a delete of <title> on <host> is unfinished`; runner's hosts key reports `models_disk.writable: false`). add-on instead: 422 `<model> has no add-on <addon>`, `give a variant or an add-on, not both`, `<title> <add-on title> has no download source`; 409 `<title> <add-on title> is already on <host>`."
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelDownload"
      responses:
        "200":
          description: The same download, already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelJob"
        "202":
          description: The job, queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/admin/models/{model}:
    delete:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminDeleteModel
      summary: Queue a delete of a model's files on one host (a model job)
      description: "Admin only (403). 202 with the job (its `keeps`: shared components left on disk because another variant on the host that is not deleted loads them); 200 with the existing job when the same delete is queued or running. `variant` absent = every variant of the model on the host. Refused, checked again by studio when it releases the job and by the runner before it removes anything (then the job fails `in_use`): 409 `<title> <variant> is not on <host>` (state missing), `<component> of <title> is loaded on <host>; unload it first` (a resident entry of any env of the host whose files the delete removes), `<title> is in use by a queued or running run on <host>` (a run not yet terminal whose model node names the model and whose host is the host, or that is not placed yet and the host is eligible for it), `a download of <title> on <host> is unfinished; cancel 422 `host <host> has no env for <model>`, `<model> has no variant <variant>`, `host is required`. The runner deletes only inside `<models root>/<dir>/` (never through a symlink out of it). deletes only that optional add-on's files (a variant's delete keeps them): 409 `<title> <add-on title> is not on <host>`, `<addon> of <title> is loaded on <host>; unload it first`, and the in-use and unfinished-download texts above; 422 `<model> has no add-on <addon>`, `give a variant or an add-on, not both`."
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - name: host
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-z0-9]{1,32}$
        - name: variant
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        - name: addon
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
          description: An optional add-on of the model (Model.addons[].component) instead of a variant
      responses:
        "200":
          description: The same delete, already queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelJob"
        "202":
