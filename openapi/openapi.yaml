                $ref: "#/components/schemas/UploadLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/studio/uploads/{take_id}/complete:
    post:
      tags:
        - Takes and uploads
      operationId: studioCompleteUpload
      summary: Check the uploaded object and make the take
      description: "Studio reads the object's size (HEAD) and its first 64 KB (range GET) from the object store: the size must be the declared `bytes`, the header must be a real image of the declared type, at most 16384 px a side and 50 MP; it records `width` and `height` upright (a JPEG whose EXIF orientation is 5-8 has them swapped, as browsers and the runner show it). until then `thumb_url` signs the original. 409 \"upload not received\" when the object is not there yet (PUT it, then call again). 422 when a check fails: the upload is discarded and its take_id is 404 from then on. Calling it again after success answers the same take."
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "200":
          description: The take
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
