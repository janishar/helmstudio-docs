        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Pipelines and batches
      operationId: studioCreateBatch
      summary: Run one workflow once per row of inputs, as one unattended job
      description: "Submit checks everything before anything runs (any failure is 422 and nothing is stored): - `workflow_id` is a known workflow (`unknown workflow <id>`). - Rows are built from `rows` (lines, table or grid, below), then each is repeated `seeds.count` times; the   result has 1 to 500 rows (`a batch has 1 to 500 rows; this one has <n>`). - Each row's inputs = `inputs` (base), then the row's values, then its seed; checked with the same rules as   `RunRequest.inputs`. The detail names the input row (a line, a table row or a grid combination, from 1,   before seed repetition): `row 3: echo.steps: must be between 1 and 200`. - Mentions resolve in every row against the caller's elements now; the rows   that cannot are all listed, in row order (at most 10, then `; and <n> more rows`), joined by `; `:   `row 3: prompt.text: unknown element @wolf; row 7: encode.refs: at most 10 images; 9 used, @fox +2 do not fit`. A pipeline batch checks only unknown handles here, in every step's graph as each input row's run will   resolve it (its row values, the step's `inputs` and preset, the step workflow's own params): `row 3:   step_1: prompt.text: unknown element @wolf`; the rest is checked when each run is made (that row fails   `invalid`). Studio keeps a copy of every element the batch mentions: its runs, Retry included, resolve against that   copy, never against later edits or deletes. - Looks: a row's looks are its `looks` cell (table column or grid axis   `looks`; null = `looks`), else `looks`; they resolve with the mentions, the failing rows listed the same way   (`row 2: looks[1]: unknown look <id>`). A pipeline batch takes its looks from its steps: `looks` or a   `looks` column is 422 `looks: a pipeline batch takes its looks from its steps`; unknown or unfitting step   looks are pipeline problems (`unknown_look`, `look_fit`: `pipeline cannot run: …`). Studio keeps a copy of   every look a row or step uses, like the elements. - A live host has the workflow's env and publishes the workflow (`no live host for env <env>`). use   fewer or shorter rows`). 409 when the caller already has 5 batches queued, running or paused (`You have 5 unfinished batches; wait for one to finish.`). The interactive cap of 100 open runs does not count batch-lane runs and does not stop a batch. 404 for a `session_id` that is unknown or another user's. `workflow_id` may name one of the caller's workflows: it must pass the graph rules (else 422 `workflow cannot run: …`) and the snapshot is its version now (nodes with `bypass`, no positions, no `studio`). `pipeline_id` (instead of `workflow_id`) runs one of the caller's pipelines: unknown or another user's is 422 `unknown pipeline <id>`; any pipeline problem is 422 `pipeline cannot run: <first problem's message>`. The columns are the pipeline's inputs, addressed `<inputs node>.<name>` in `inputs`, `lines.param`, `table.columns` and `grid.axes[].param`; every input needs a value in each row (`row 3: inputs.prompt: a value is required`) except a Seed (drawn); `seeds` repeats rows over the pipeline's one Seed input. The snapshot is the pipeline document now plus every workflow it uses; a live host is needed for every step's env; the 768 KB limit counts the snapshot too. On success studio stores the batch (`queued`, `control: run`) with its snapshot (the workflow as published now: the batch never runs a later version), every row (`queued`, attempt 1, seeds drawn), a new session titled answers 202. once row 1 has succeeded, failed or been cancelled, every other row is released into the dispatcher's batch lane (after interactive runs, round-robin between users)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreate"
      responses:
        "202":
          description: The batch, queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
