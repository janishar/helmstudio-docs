  /v1/studio/admin/hosts/{host}/settings:
    put:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminPutHostSettings
      summary: Set what stays loaded after a run, the idle timeout and the memory reserve, for every env of a host
      description: "Admin only (403). `<host>`; each runner of the host applies it at once when idle, else after its run, without a restart, and reports it in its hosts key (`policy.settings_version`; `HostSettings.applied`). A first PUT creates the row with no pins. 404 for a host with no present hosts key. 422 `reserve_gb leaves no memory on <host>` (reserve_gb ≥ the smallest memory the host's keys cut their budget from: `device.memory_total_gb` (VRAM) for a key whose `device.kind` is cuda, else `machine.ram_gb`)."
      parameters:
        - $ref: "#/components/parameters/HostName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostSettingsPut"
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSettings"
        "401":
