  /v1/studio/uploads:
    post:
      tags:
        - Takes and uploads
      operationId: studioCreateUpload
      summary: Start an upload
      description: 'Stores a pending take (source `upload`, invisible until completed) and signs a single-use `PUT` link for the key `u/<caller>/uploads/<take_id>.<png|jpg|webp|wav|mp3|m4a>`, valid 15 minutes (`PUT /files/{path}`): `image/png`, an audio take; `duration_s` required, at most 600 s), at most 50 MB (52428800 bytes). 422 for any other type or size ("only png, jpeg and webp images or wav, mp3 and m4a audio can be uploaded", "file is larger than 50 MB", "audio is longer than 600 s"). A pending upload not completed within an hour is discarded. optimises a file before this call: `bytes` is the file it uploads.'
