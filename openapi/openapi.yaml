          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
