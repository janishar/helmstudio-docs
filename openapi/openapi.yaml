      operationId: studioPickBatchRow
      summary: Answer a gate for one parked row (pick 1..keep of its candidates, or reject them all)
      description: "In one transaction: records the pick on the row's gate cell (`picked` / `rejected`), sets the row `running` pipelines resumes the row's thread with it. Rows can be picked in any order. The same pick again for the same gate visit answers 202 with the row and sends nothing. 409 when the row is not parked on `gate` (`row <n> is not waiting at <gate>`), a different pick for that visit was already sent, or the batch is `stopped`/`failed` or its `control` is `stop`. 422 when `take_ids` are not among the candidates, repeat one, or are more than the gate's `keep` (`pick 1 to <keep> of the candidates`). Studio derives `agreed` (the picked set equals the judge's suggestion; reject all with an empty suggestion: true), pipelines stores a pick with a note as a judge example in the pipeline's memory. `note` on a gate pick is 422 (`a note is kept for judge picks only`)."
