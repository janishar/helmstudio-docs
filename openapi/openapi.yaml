        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/admin/imports/takes:
    post:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminCreateImportTake
      summary: Create (or find) one imported take for a user, with signed PUT links for its files
      description: "Used by `helm import`. Admin only (403). Idempotent on (`owner_id`, `key`): a new key stores a pending take (`source: import`, owner `owner_id`) and answers 201 with single-use 24-hour `PUT` links for `u/<owner_id>/imports/<take_id>.<png|jpg|webp|mp4>` (and, for a video, `…/<take_id>.poster.<png|jpg|webp>`), exactly as uploads sign them; a key already pending answers 200 with fresh links; a key already complete answers 200 `state: ready` without links and changes nothing but adding `parents` edges not stored yet. Every `parents` key is stored as an edge and shows once both takes are complete, in either order. A pending import not completed in 24 hours is deleted. 422 for a body that breaks the schema, `legacy is larger than 64 KB`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportTakeCreate"
      responses:
        "200":
          description: "The key was seen: still pending (fresh links), or ready"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportTake"
        "201":
          description: Created, pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportTake"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/admin/imports/takes/{take_id}/complete:
    post:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminCompleteImportTake
      description: "Admin only (403). As `POST /v1/studio/uploads/{take_id}/complete`: HEAD each object (its size = the declared bytes) and read its first 64 KB: an image's header gives width and height (must equal the declared ones); a video must start with an MP4 `ftyp` box; its poster is checked as an image. 422 `size differs from the declared bytes`, `not a png, jpeg or webp image`, `not an MP4 file`, `width and height differ from the file` (a failed check deletes the pending take and its objects, so a later run of the import creates it again). 409 `upload not received` while an object is missing. Complete again: the same 200. 404 for an id that is not a pending or ready import."
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "200":
          description: The take, as its owner sees it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/timelines:
    get:
      tags:
