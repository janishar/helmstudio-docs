  /files/{path}:
    get:
      tags:
        - Files
      operationId: filesGetFile
      summary: A signed file (the signature is the auth; no API key)
      description: "Only reachable through a `url` the API returned. Served with `Content-Security-Policy: sandbox` and `X-Content-Type-Options: nosniff`, the object's stored `Content-Type` (`image/png`, `video/mp4`, …), its `Content-Length` and `ETag`, and `Accept-Ranges: bytes`. A `Range: bytes=<a>-<b>` / `<a>-` / `-<n>` header (one range; a multi-range header is answered as if absent, 200) gets 206 with `Content-Range: bytes <a>-<b>/<size>` and just those bytes, streamed from the object store's own range read, so a `<video>` can seek; a range that starts past the end is 416 with `Content-Range: bytes */<size>`. `HEAD` answers the same headers without a body. Kong passes `Range` through and buffers nothing."
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Storage-relative path (may contain slashes)
        - name: exp
          in: query
          required: false
          schema:
            type: integer
          description: Expiry, unix seconds (missing = 403, not 422)
        - name: sig
          in: query
          required: false
          schema:
            type: string
          description: HMAC signature of path and exp (missing = 403, not 422)
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: ^bytes=
            examples:
              - bytes=0-1048575
          description: One byte range (RFC 9110); absent = the whole file
      responses:
        "200":
          description: The file
          headers:
            Content-Security-Policy:
              schema:
                type: string
                const: sandbox
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Accept-Ranges:
              schema:
                type: string
                const: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "206":
          description: The requested range of the file
          headers:
            Content-Range:
              schema:
                type: string
                examples:
                  - bytes 0-1048575/4129070
            Content-Security-Policy:
              schema:
                type: string
                const: sandbox
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Accept-Ranges:
              schema:
                type: string
                const: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "400":
          $ref: "#/components/responses/GatewayBadPath"
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Bad or missing signature, expired link, a path that escapes the store, or no such file (never 404)
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags:
        - Files
      operationId: filesHeadFile
      summary: The headers `GET` would answer for a signed file, without a body
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Storage-relative path (may contain slashes)
        - name: exp
          in: query
          required: false
          schema:
            type: integer
          description: Expiry, unix seconds (missing = 403, not 422)
        - name: sig
          in: query
          required: false
          schema:
            type: string
          description: HMAC signature of path and exp (missing = 403, not 422)
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: ^bytes=
            examples:
              - bytes=0-1048575
          description: One byte range (RFC 9110); absent = the whole file
      responses:
        "200":
          description: The file's headers
          headers:
            Content-Security-Policy:
              schema:
                type: string
                const: sandbox
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
            Accept-Ranges:
              schema:
                type: string
                const: bytes
        "206":
          description: The headers of the requested range
          headers:
            Content-Range:
              schema:
                type: string
                examples:
                  - bytes 0-1048575/4129070
            Accept-Ranges:
              schema:
                type: string
                const: bytes
        "400":
          $ref: "#/components/responses/GatewayBadPath"
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Bad or missing signature, expired link, a path that escapes the store, or no such file (never 404)
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    put:
      tags:
        - Files
      operationId: filesPutFile
      summary: Upload the bytes of a signed upload link (the signature is the auth; no API key)
      description: 'Only reachable through an `upload_url` from `POST /v1/studio/uploads` (images and audio, at most 50 MB) or `POST /v1/studio/loras` (`u/<owner>/loras/<lora_id>.safetensors`, `application/octet-stream`, at most 2 GiB). The signature is the lower-case hex HMAC-SHA256 (the `/files` secret) of `"PUT\n" + path + "\n" + exp + "\n" + bytes + "\n" + ct`; a GET link (`path + "\n" + exp`) never verifies as a PUT. The request must carry `Content-Type` equal to `ct` and `Content-Length` equal to `bytes` (no chunked body); the body is streamed to the object store under `path` with that content type. Single use: an existing object is never overwritten (409).'
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: The object key, u/<owner>/uploads/<take_id>.<ext>
        - name: exp
          in: query
          required: false
          schema:
            type: integer
          description: Expiry, unix seconds (missing = 403)
        - name: bytes
          in: query
          required: false
          schema:
            type: integer
          description: The exact body size (missing = 403)
        - name: ct
          in: query
          required: false
          schema:
            type: string
          description: The content type, URL-encoded (missing = 403)
        - name: sig
          in: query
          required: false
          schema:
            type: string
          description: HMAC signature (missing = 403)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "204":
          description: Stored
        "400":
          $ref: "#/components/responses/GatewayBadPath"
        "403":
          $ref: "#/components/responses/Forbidden"
          description: Bad or missing signature, expired link, or a path outside `u/` or with `..`
        "409":
          $ref: "#/components/responses/Conflict"
          description: '"already uploaded": the object exists'
        "411":
          $ref: "#/components/responses/LengthRequired"
        "415":
          $ref: "#/components/responses/WrongContentType"
  /auth/signin:
    post:
      tags:
        - Auth
      operationId: authSignin
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: A new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/InvalidLogin"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
        "429":
          $ref: "#/components/responses/SigninLimited"
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: authRefresh
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated session (same family); the presented refresh token is now used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: 'Unknown, expired, revoked or already-used refresh token (reuse revokes the whole family), or the user is disabled: "invalid or expired token"'
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
        "429":
          $ref: "#/components/responses/GatewayRateLimited"
  /auth/signout:
    delete:
      tags:
        - Auth
      operationId: authSignout
      security:
        - ApiKey: []
          BearerJWT: []
      responses:
        "204":
          description: The access token's session (refresh-token family) is revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password:
    put:
      tags:
        - Auth
      operationId: authChangePassword
      security:
        - ApiKey: []
          BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Changed; every session of the user is revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: Bad access token, or wrong current_password ("current password is incorrect"); the 5th wrong one within 15 minutes also revokes the session
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
  /auth/.well-known/jwks.json:
    get:
      tags:
        - Auth
      operationId: authJwks
      description: "Public key(s) for verifying access tokens; no x-api-key (the Kong plugin bypasses this path). Cache-Control: public, max-age=300."
      security: []
      responses:
        "200":
          description: Public keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
  /auth/me:
    get:
      tags:
        - Auth
      operationId: authMe
      security:
        - ApiKey: []
          BearerJWT: []
      responses:
        "200":
          description: The token's user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/admin/users:
    get:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminListUsers
      security:
        - ApiKey: []
          BearerJWT: []
      responses:
        "200":
          description: All users, newest first (not paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
    post:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminCreateUser
      summary: Create an account (the only way in while sign-up is closed); the user signs in with this email and password
      security:
        - ApiKey: []
          BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "409":
          $ref: "#/components/responses/EmailTaken"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
  /auth/admin/users/{id}/disabled:
    put:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminSetDisabled
      security:
        - ApiKey: []
          BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisabledRequest"
      responses:
        "200":
          description: The updated user; disabling revokes all their sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Conflict
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
  /auth/admin/users/{id}/roles:
    put:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminSetRoles
      security:
        - ApiKey: []
          BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesRequest"
      responses:
        "200":
          description: The updated user; their sessions are revoked so new tokens carry the new roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Conflict
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
  /auth/admin/users/{id}/password:
    put:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminSetPassword
      security:
        - ApiKey: []
          BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "204":
          description: Set; all their sessions are revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Conflict
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
  /auth/admin/apikeys:
    post:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminCreateApiKey
      description: "Issues a client API key (the client is created if new). The raw key is in this response only (Cache-Control: no-store); only its SHA-256 is stored."
      security:
        - ApiKey: []
          BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: The key, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
    get:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminListApiKeys
      security:
        - ApiKey: []
          BearerJWT: []
      responses:
        "200":
          description: All keys incl. revoked ones, newest first (not paginated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
  /auth/admin/apikeys/{id}:
    delete:
      tags:
        - "Admin: users and API keys"
      operationId: authAdminRevokeApiKey
      security:
        - ApiKey: []
          BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key id (UUID; malformed = 404)
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
          description: Unknown or already revoked key
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Identifies the calling application (checked at the gateway on every request)
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The user's RS256 access token from a Session
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Session UUID (malformed = 404)
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
      description: Run UUID (malformed = 404)
    WorkflowId:
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
      description: Workflow id (unknown or malformed = 404)
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: User UUID (malformed = 404)
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
      description: Batch UUID (malformed = 404)
    TakeId:
      name: take_id
      in: path
      required: true
      schema:
        type: string
      description: Take UUID (malformed = 404)
    PipelineId:
      name: pipeline_id
      in: path
      required: true
      schema:
        type: string
      description: Pipeline UUID (malformed = 404)
    LoraId:
      name: lora_id
      in: path
      required: true
      schema:
        type: string
      description: A shared LoRA's SHA-256 (64 hex) or an own LoRA's UUID (malformed = 404)
    ModelId:
      name: model
      in: path
      required: true
      schema:
        type: string
      description: A model id of the registry (`qwen-image-2.1`; unknown or malformed = 404)
    ModelJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: Model job UUID (malformed = 404)
    HostName:
      name: host
      in: path
      required: true
      schema:
        type: string
      description: Unknown or malformed = 404)
    LibraryItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
      description: Library item UUID (malformed = 404)
    LookFamily:
      name: family
      in: path
      required: true
      schema:
        type: string
      description: A starter look's or voice's family (the part of its id before `/`; malformed = 404)
    StarterLookId:
      name: look_id
      in: path
      required: true
      schema:
        type: string
      description: The pack's look or voice id (the part after `/`; malformed = 404)
    BatchRowN:
      name: row
      in: path
      required: true
      schema:
        type: string
      description: Row number, from 1 (unknown or malformed = 404)
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: "`next_cursor` of the previous page; opaque (malformed = 422)"
    ProviderName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: A provider's name (unknown = 404 on DELETE and test; malformed = 404)
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 60
    TimelineId:
      name: timeline_id
      in: path
      required: true
      schema:
        type: string
      description: Sequence UUID (malformed = 404)
    MediaJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: Media job UUID (malformed = 404)
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
      description: An assistant chat's UUID (another user's or malformed = 404)
  responses:
    Unauthorized:
      description: Missing or invalid x-api-key (Kong), or missing/invalid/expired/revoked bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Invalid or expired link
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource's state forbids this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Retryable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidLogin:
      description: 'Unknown email or wrong password: "Wrong email or password.". A disabled user with the right password: "This account is off. Ask your admin."; with a wrong one the generic line, so it tells nothing of which emails exist. Every refusal counts against the sign-in limit.'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SigninLimited:
      description: "Too many failed sign-ins or too many requests (Kong rate limit: 20/min, 200/h per IP, {message})"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/GatewayError"
    GatewayBadPath:
      description: The gateway (Kong/nginx) refuses a path that climbs above the root (`..` segments) before the API sees it
      content:
        text/html:
          schema:
            type: string
    GatewayRateLimited:
      description: Kong rate limit (20/min, 200/h per IP) — Kong answers with {message}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
    EmailTaken:
      description: '"email already registered"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminRequired:
      description: 'Valid token without the admin role: "admin role required"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AuthUnprocessable:
      description: 'Invalid input: "invalid JSON body", or the failed rule ("invalid email", "name must be 1-200 characters", "password must be at least 10 characters", "password is too common", "roles must not be empty", …)'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: A per-resource rate limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RangeNotSatisfiable:
      description: "The range starts past the end of the file (`Content-Range: bytes */<size>`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LengthRequired:
      description: '"Content-Length must be the signed bytes": missing, chunked, or another size'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WrongContentType:
      description: '"Content-Type must be the signed type"'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WorkflowUnprocessable:
      description: "The body does not fit the schema (`{detail}` only), or the graph has problems that block saving (`problems`: every problem, save- and run-blocking)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowError"
    PipelineUnprocessable:
      description: "The body does not fit the schema (`{detail}` only), or the pipeline has problems that block saving (`problems`: every problem)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PipelineError"
    TimelineUnprocessable:
      description: "The body does not fit the schema (`{detail}` only), or the document breaks a timeline rule (`problems`: every problem)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TimelineError"
    TimelineEditUnprocessable:
      description: The body does not fit the schema (`{detail}` only), or an op cannot apply (`op_index`, `code`, `problems`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TimelineEditError"
  schemas:
    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
    GatewayError:
      type: object
      description: Error body generated by Kong itself (rate limiting)
      required:
        - message
      properties:
        message:
          type: string
    SignedUrl:
      type: string
      description: Signed, time-limited link; opaque
      examples:
        - /files/u/7d1e.../runs/3c9a.../0.png?exp=1767225600&sig=ab12
    StudioSession:
      type: object
      required:
        - id
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        title_source:
          $ref: "#/components/schemas/TitleSource"
        named_by:
          type:
            - string
            - "null"
          maxLength: 60
          description: The model that wrote the title (`Qwen3.8`, `DeepSeek`) while `title_source` is model; null otherwise
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Last rename or run
    TitleSource:
      type: string
      enum:
        - default
        - prompt
        - user
        - model
      description: "Who wrote the title: default (\"Untitled\"), prompt (Generate's slice of the prompt, `from_prompt`), user (typed or renamed), model (the namer). The namer replaces only default and prompt, once per session"
    SessionList:
      type: object
      required:
        - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/StudioSession"
        naming:
          type: object
          required:
            - mode
            - named_by
            - remote
          additionalProperties: false
          description: How an untitled session is named after its first run succeeds (the admin's setting, redacted)
          properties:
            mode:
              type: string
              enum:
                - off
                - local
                - remote
            named_by:
              type:
                - string
                - "null"
              maxLength: 60
              description: "Local: Qwen3.8; remote: the provider's title; null when off"
            remote:
              type: boolean
              description: The prompt leaves this machine (a provider of kind remote)
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
          description: Trimmed; empty or missing = "Untitled"
        from_prompt:
          type: boolean
          description: The title is a slice of the prompt Generate is about to send (`title_source` prompt, so the namer may replace it); default false (user)
    SessionPatch:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed; blank = 422
    PortType:
      type: string
      enum:
        - Text
        - Image
        - Int
        - Float
        - Seed
        - Canvas
        - Model
        - Conditioning
        - Latent
        - Video
        - Duration
        - Media
        - Audio
      description: "An input accepts an output of the same type; an input of type `Media` (the output node's `media`; never an `Video` is an MP4 that may carry an audio track; `Audio` is speech, a WAV (PCM 16-bit, mono, the model's own rate); `Duration` is `{frames, fps}`. Model, Conditioning and Latent are family-scoped handles: they wire nodes of one family inside one workflow and never cross a process (`Latent` of ltx carries video and audio latents together)."
    Port:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/PortType"
        optional:
          type: boolean
          description: "Inputs only: true = may be left unwired (the feature is off); absent = required"
    ScalarValue:
      type:
        - string
        - number
        - boolean
        - "null"
      description: Null only for a seed (random) or an image, media, span or voice param left empty
    ImageRef:
      type: object
      description: "An Image value: a take of the caller, by id. The only way a client names an image; never an object key or URL. Studio checks it when it creates the run."
      required:
        - take_id
      additionalProperties: false
      properties:
        take_id:
          type: string
          format: uuid
    LoraRef:
      type: object
      description: "A Lora value (a rows item field of ref kind `Lora`): a LoRA the caller can use, by id; never a path, key or URL. Studio checks it when it creates the run."
      required:
        - lora_id
      additionalProperties: false
      properties:
        lora_id:
          type: string
          pattern: ^([0-9a-f]{64}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
    MediaRef:
      type: object
      description: "A Media value: a video or audio take of the caller, by id. `in` / `out` (seconds of the take's own time; studio snaps them: a video's frames, audio to the millisecond) only on a param with `trim`: the part it reads (absent: 0 / the take's end). Never an object key or URL."
      required:
        - take_id
      additionalProperties: false
      properties:
        take_id:
          type: string
          format: uuid
        in:
          type: number
          minimum: 0
          maximum: 86400
        out:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
    VoiceRef:
      type: object
      description: "A voice value: a saved voice the caller can use, by id: one of the caller's own (a UUID) or a starter voice (`<family>/<pack voice id>`). Never a key, a URL or the voice's fields; studio resolves it when it creates the run."
      required:
        - voice_id
      additionalProperties: false
      properties:
        voice_id:
          type: string
          pattern: ^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$
    SpanValue:
      type: object
      description: "A `span` param's value: a time range on the workflow's one video media source, in that take's own seconds (Retake: the stretch to regenerate)"
      required:
        - start
        - end
      additionalProperties: false
      properties:
        start:
          type: number
          minimum: 0
          maximum: 86400
        end:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
    RowItem:
      type: object
      description: "One item of a rows value: field (the param's `item`) → value"
      additionalProperties:
        anyOf:
          - $ref: "#/components/schemas/ScalarValue"
          - $ref: "#/components/schemas/ImageRef"
          - $ref: "#/components/schemas/MediaRef"
          - $ref: "#/components/schemas/LoraRef"
          - $ref: "#/components/schemas/VoiceRef"
    ParamValue:
      description: "A scalar; an `image` param: ImageRef or null; a `rows` param: an ordered list of items"
      anyOf:
        - $ref: "#/components/schemas/ScalarValue"
        - $ref: "#/components/schemas/ImageRef"
        - $ref: "#/components/schemas/MediaRef"
        - $ref: "#/components/schemas/SpanValue"
        - $ref: "#/components/schemas/VoiceRef"
        - type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RowItem"
    ParamSchema:
      type: object
      description: "One form field. `int`/`float`/`seed`: `min`/`max` bound the value, `step` is the increment; `string`/`text` (multi-line): `min`/`max` bound the length; `enum`: one of `enum`; `bool`: a switch. `seed`: an int where null or -1 means random: the runner picks one and reports it (`Run.resolved.seed`, `RunOutput.seed`). `when`: a visibility expression over the graph (`model.variant != 'turbo'`), carried through, not evaluated yet. `image`: one take (`ImageRef`), default null; a run needs one. `rows` (the rows editor): an ordered list of `RowItem`, default `[]`; `min`/`max` bound the count, `item` names each item's fields (a ref kind, `Image` or `Lora`, required in every item, or a param schema), `mention` is how the prompt refers to item n from 1 (`<image{n}>`: the rows editor labels item n with it; the prompt is sent as typed). `frames`: a frame count on the family's frame grid, `min + k × step` up to `max` (LTX: 9 + 8k up to 321); `fps` names the same node's frame-rate param; the UI renders it as the Duration slider (one notch per `step`, labelled `<frames> frames · <frames / fps> s`); a value off the grid is 422 (`<node>.<param>: <v> is not on the frame grid <min> + <step>k up to <max>`). The size picker (aspect + megapixels) is drawn for a node whose output is `Canvas` from its `width` and `height` int params: `step` is the grid, `min` / `max` the bounds. an `int` may declare `values` (the only allowed values: a choice, one value a read-only readout) and `values_by`; a float item field may declare `position: seconds` (a keyframe's time on the clip). a run needs one) of the kinds in `accepts`; with `trim` the value may carry `in` / `out` (the UI draws the take's poster or waveform with a trim control and its duration); `grid` (a video's sides must be multiples of it), `max_s` (the longest it reads) and `max_frames` (the most frames of a video it reads) bound it. `span`: a time range `{start, end}` (`SpanValue`, default null; a run needs one) on the workflow's one `media` param that accepts video; the UI draws it as a range control over that take's poster and duration. item one video or audio take, `MediaRef`, required in every item; the rows editor draws the take's poster or a sound tile with its trim control); `min_s` (media) is the shortest it reads; `max_total_s` (rows with one media field) the most seconds the items read together; `not_with` (rows) names optional inputs of the node: while one is wired the rows stay empty (mentions add none, \"Use in…\" skips them). a run needs one) of the sources in `accepts`; the UI draws the voice picker. It takes no wire; rows item field (a dialogue's `lines`: each line's speaker, required in every item). dialogue script (`@handle: text` or `@handle (style): text` per line, an empty line a longer pause) that studio expands at create time into the same node's rows param `lines` (items `{voice, text, style, pause_s}`, each voice the element's `voice_id`); the composer draws it as the script editor with each line's speaker."
      required:
        - name
        - type
        - default
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - int
            - float
            - bool
            - string
            - text
            - enum
            - seed
            - image
            - rows
            - frames
            - media
            - span
            - voice
        script:
          type: boolean
          const: true
          description: "Text only: a dialogue script expanded into the node's `lines`"
        accepts:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - video
              - audio
              - preset
              - clip
              - design
          description: "Media only: the take kinds it takes (video, audio); video: a video take; audio: an audio take, or a video take's sound."
        trim:
          type: boolean
          description: "Media only: true = the value may carry in / out (the part read); absent = the whole take"
        grid:
          type: integer
          description: "Media only: a video take's width and height must be multiples of it"
        max_s:
          type: number
          description: "Media only: the longest it reads in seconds (the take, or out - in with trim)"
        max_frames:
          type: integer
          minimum: 1
          description: "Media only: the most frames of a video take it reads (its frames at any fps; LTX 321)"
        min_s:
          type: number
          description: "Media only: the shortest it reads in seconds (`take <id> lasts <d> s; this input takes at least <min_s> s`; with trim also `the part lasts <d> s; …`)"
        max_total_s:
          type: number
          description: "Rows with one media field only: the most seconds the items read together (`<node>.<param>: the takes last <d> s in all; at most <max_total_s> s`)"
        not_with:
          type: array
          items:
            type: string
          description: "Rows only: optional inputs of the same node; while one is wired the rows must stay empty (`<node>.<param>: must stay empty while <node>.<input> is wired`)"
        addons:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: "Enum only: value → the optional add-ons (Model.addons[].component of the node's family) a run needs while the param holds that value (MiniMax H3's `lora`: `turbo` → [turbo]); the run check counts them as the node's `addons` on its resolved value (never while the node is bypassed) and the form greys that option, and every preset that sets it, with `<title> not downloaded`. Absent = none"
        addons_with:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          description: "With `addons`: `<name>` (an optional input of the node, or one of its rows params) → {value → add-ons}: while that input is wired or that rows param holds a row its list replaces the value's `addons` list, several names' lists together (MiniMax H3: any reference runs Ref2VA, so `turbo` then needs `turbo_ref`)"
        optional:
          type: boolean
          description: "A rows item's media field only: it may be left empty (null or absent; MiniMax H3's `soundtrack`); `max_total_s` and Use in… go by the item's one required media field"
        rules:
          type: array
          maxItems: 8
          description: ": refusals as data. Each `when` is an expression (the `when` grammar plus `<`, `<=`, `>`, `>=`, `+`, `-`, `*`, `/`, `len(<rows>)` and `gcd(a, b)`; a bare name is a param of the same node, or in a rows item field's rule a field of the same item; `<a>.<b>` is param `b` of the node wired into this node's input `a`, else of node `a`); while it holds the run is 422 `<node>: <error>` (an item field's: `<node>.<param>[<i>].<field>: <error>`, items from 1), each `{<expression>}` in `error` replaced by its value. A reference that resolves to nothing makes the rule not hold. Studio checks them after the other checks, in param order; the form shows each under its param and blocks Generate"
          items:
            type: object
            required:
              - when
              - error
            additionalProperties: false
            properties:
              when:
                type: string
                minLength: 1
                maxLength: 300
              error:
                type: string
                minLength: 1
                maxLength: 200
        option_help:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 80
          description: "Enum or int with `values`: value (as text) → its line under the value in the param's menu (MiniMax H3's LoRA: `none` → `the model as it is`); absent = none"
        fps:
          type: string
          description: "Frames only: the name of the same node's int or float param holding frames per second"
        auto:
          type: object
          required:
            - min_s
            - max_s
          description: 'Frames only: present = the value `"auto"` is allowed (the model predicts the length, clamped to min_s..max_s seconds and to min..max frames); absent = it is 422 (`<node>.<param>: auto length is not offered`)'
          properties:
            min_s:
              type: number
            max_s:
              type: number
        values:
          type: array
          items:
            type: integer
          description: "Int only: the only allowed values, ascending (`<node>.<param>: must be one of 3, 8`)"
        values_by:
          type: object
          required:
            - param
            - values
          description: "A graph without that node, or a value not listed, allows all of `values` / `enum`). The message names the subset (`sample2.steps: must be one of 3`, `extend.direction: must be one of after`). The UI shows a value outside the subset faded with its reason, `<value> needs <first value of the named param that allows it>` (`Before needs Dev`); a take offer whose pre-fill it refuses also sets the named param to that value"
          properties:
            param:
              type: string
              pattern: ^([a-z][a-z0-9_]{0,63}\.)?[a-z][a-z0-9_]{0,63}$
            values:
              type: object
              additionalProperties:
                type: array
                items:
                  type:
                    - integer
                    - string
            note:
              type: string
              description: "A cross-node values_by only: the line under the named param's choice while this refuses one of its options (LTX extend: `Dev: the only model that extends before. About 10× slower.`); absent = each refusal (`Extend before needs Dev`)"
        label:
          type: string
          description: Absent = the name
        default:
          $ref: "#/components/schemas/ParamValue"
        min:
          type: number
        max:
          type: number
        step:
          type: number
          exclusiveMinimum: 0
        enum:
          type: array
          items:
            type: string
        help:
          type: string
        when:
          type: string
          description: Visibility expression; absent = always shown
        item:
          type: object
          description: Required in every item) or a param schema without name
          additionalProperties:
            anyOf:
              - type: string
                const: Image
              - type: string
                const: Media
              - type: string
                const: Lora
              - type: object
                description: "A ParamSchema without name; a float may add `position: seconds` (a time on the clip)"
        mention:
          type: string
          description: "Rows only: the prompt's name for item n, with `{n}` from 1"
          examples:
            - <image{n}>
    NodeSchema:
      type: object
      required:
        - kind
        - title
        - family
        - params
        - inputs
        - outputs
      properties:
        kind:
          type: string
          examples:
            - echo/echo
        title:
          type: string
        family:
          type:
            - string
            - "null"
          description: Null for a core node (prompt
          output): null
        component:
          type: string
          minLength: 1
          maxLength: 40
          description: The model component the node loads, in words (transformer, text encoder, vae); the Graph inspector reads "<family> · runs on <runtime> · uses the <component>". Absent = it loads none
        help:
          type: string
        addons:
          type: array
          items:
            type: string
          description: The optional add-ons the node loads (a `component` of its family's Model.addons); while one is not present the form greys the node's controls (`<title> not downloaded`) and a run with the node not bypassed is refused on such a host. Absent = none
        phases:
          type: array
          description: "The ordered phases of a node that runs one engine end to end (MiniMax H3: Encode, Sample, Decode audio, Decode video); its progress carries `phase_id`. Absent = none"
          items:
            type: object
            required:
              - id
              - label
            properties:
              id:
                type: string
              label:
                type: string
        peak_gb:
          type: string
          minLength: 1
          maxLength: 400
          description: "The stage's peak_gb formula (model.yaml), published for a stage that loads no component: studio evaluates it per run over the node's params, `len(<rows>)`, `mp` and `frames`. Absent = none"
        sounds:
          type: object
          required:
            - max_s
            - max_inputs
          additionalProperties: false
          description: "The node's limits on the sound its references carry together (MiniMax H3: 15 s, 3 inputs): audio rows, and video rows whose `sound` keeps the take's sound or replaces it with a `soundtrack`; the composer counts them (`3.0 s of 15.0 s sound · 1 of 3 sound inputs`). Absent = none"
          properties:
            max_s:
              type: number
              exclusiveMinimum: 0
            max_inputs:
              type: integer
              minimum: 1
        params:
          type: array
          items:
            $ref: "#/components/schemas/ParamSchema"
          description: In form order
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/Port"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/Port"
    GraphNode:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ParamValue"
          description: Overrides of the node schema defaults
        in:
          type: object
          additionalProperties:
            type: string
            pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
          description: Input port (or a wired value param) → `<node id>.<output>`
        bypass:
          type: boolean
          description: "Switched off: passes its inputs through; absent = false"
        optional:
          type: boolean
          description: "A core `image` node only: may be left empty; studio then drops it and its wires before the run (its wires must all go to optional inputs, else the problem `not_optional`). The form marks its image field optional (MiniMax H3 Image to video: Last frame)"
        position:
          $ref: "#/components/schemas/NodePosition"
        only:
          $ref: "#/components/schemas/ParamOnly"
    ParamOnly:
      type: object
      description: "Enum param → the values this workflow allows (a subset of its `enum` holding the node's value); the form offers only those, another value is 422 `<node>.<param>: must be one of <values>` (LTX dev templates pin `model.variant` to dev). the workflow holds null): the voice fit reads the narrowed set, a voice outside it is 422 `<node>.<param>: this workflow cannot use a designed voice`"
      propertyNames:
        pattern: ^[a-z][a-z0-9_]{0,63}$
      additionalProperties:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
    NodePosition:
      type: object
      description: The card's top-left in the Graph view, canvas pixels; absent = laid out by the client (elkjs, "Tidy layout")
      required:
        - x
        - y
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: -1000000
          maximum: 1000000
        y:
          type: number
          minimum: -1000000
          maximum: 1000000
    WorkflowSource:
      type: string
      enum:
        - template
        - mine
      description: "Template: published by a runner in the registry (read-only, id a slug); mine: the caller's own (id a UUID)"
    Workflow:
      type: object
      description: "A runnable graph. A form is derived from it: for every node in `nodes`, the params of `node_schemas[node.kind]`, each addressed as `<node id>.<param name>` in `RunRequest.inputs`, its starting value `node.params[name]` else the schema `default`. With `studio`, the Studio shows exactly the paths it places; without, the form is derived as above."
      required:
        - id
        - title
        - family
        - env
        - nodes
        - node_schemas
        - source
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          examples:
            - echo
            - 6f1c2a4e-0b7d-4c8e-9a51-3d2e1f0a9b88
        title:
          type: string
        action:
          type: string
          description: "Templates only (registry `action`): the take action's label when it is offered for a take (\"Use in…\", a clip's actions): Animate, Edit, Extend, Retake a section; absent = the title"
        family:
          type: string
        env:
          type: string
          description: The runner env that executes it
        media:
          type: string
          enum:
            - image
            - video
            - audio
            - text
          description: Audio when an output is wired from an Audio output; text only for an ask workflow, served read-only by GET /v1/studio/workflows/{workflow_id}, never listed
        nodes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GraphNode"
          description: Node id → node
        node_schemas:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NodeSchema"
          description: Kind → schema, for every kind in nodes the registry has (a kind no runner publishes is left out)
        source:
          $ref: "#/components/schemas/WorkflowSource"
        studio:
          $ref: "#/components/schemas/StudioLayout"
        based_on:
          type:
            - string
            - "null"
          description: "Mine only: the template or workflow it was copied or saved from (it may be gone since); null when made from nothing"
        version:
          type: integer
          minimum: 1
          description: "Mine only: 1 on create, +1 on every PUT and PATCH; send it back in WorkflowUpdate"
        created_at:
          type: string
          format: date-time
          description: Mine only
        updated_at:
          type: string
          format: date-time
          description: Mine only
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
          description: "Only from GET /v1/studio/workflows/{workflow_id}, POST and PUT: the graph rules against the live palette now; empty = it can run"
        keyframes:
          oneOf:
            - $ref: "#/components/schemas/WorkflowKeyframes"
            - type: "null"
          description: "Always sent: the rows New shot binds a first (and with `last`, a last) frame into; null = the workflow takes none, so neither option is offered"
    WorkflowMedia:
      type: string
      enum:
        - image
        - video
        - audio
      description: What a workflow's takes are
    WorkflowList:
      type: object
      required:
        - workflows
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
    StudioPath:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$
      description: "`<node id>.<param>`, or `<node id>.bypass` for a bypassable node (a switch)"
      examples:
        - sample.steps
        - enhance.bypass
    StudioTile:
      type: string
      enum:
        - elements
        - look:film
        - look:camera
        - look:colour
        - look:lighting
      description: "A composer tile in `studio.quick`: `elements` opens the visual picker on elements (it inserts an `@` mention), `look:<group>` on that look group (it adds looks to the run's `looks`). Not a path: never `studio_unknown_path`; twice = `studio_duplicate`"
    StudioLayout:
      type: object
      additionalProperties: false
      description: Which params the Studio (Create) shows and where. Present = exactly the placed paths show; every other param keeps its graph value and is edited in Graph view only. Absent = the derived form (every param, as `Workflow` says). A path is placed at most once over composer, quick and inspector.
      properties:
        composer:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/StudioPath"
          description: In the composer box, in order (the prompt, the references)
        quick:
          type: array
          maxItems: 12
          items:
            anyOf:
              - $ref: "#/components/schemas/StudioPath"
              - $ref: "#/components/schemas/StudioTile"
          description: "Chips on the composer, in order: params, and library tiles (`elements`, `look:<group>`) that open the visual picker"
        inspector:
          type: array
          maxItems: 12
          description: The inspector's sections, in order
          items:
            type: object
            required:
              - title
              - items
            additionalProperties: false
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 40
                examples:
                  - Quality
              items:
                type: array
                maxItems: 32
                items:
                  $ref: "#/components/schemas/StudioPath"
              help:
                type: string
                minLength: 1
                maxLength: 300
                description: The section's (i) text in Create; absent = no (i)
              choices:
                type: array
                maxItems: 4
                description: Tiles that lead the section, each a named pick among sets of values. A set is checked as a preset (`preset_invalid`); the tile shows the option whose set holds
                items:
                  type: object
                  required:
                    - label
                    - options
                  additionalProperties: false
                  properties:
                    label:
                      type: string
                      minLength: 1
                      maxLength: 40
                      examples:
                        - Recipe
                    help:
                      type: string
                      minLength: 1
                      maxLength: 300
                      description: The tile's hover text
                    options:
                      type: array
                      minItems: 2
                      maxItems: 8
                      items:
                        type: object
                        required:
                          - name
                          - set
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 40
                            examples:
                              - One-stage
                          help:
                            type: string
                            minLength: 1
                            maxLength: 300
                            description: "The option's line under its name in the tile's menu (LTX's Recipe: Detail)"
                          set:
                            type: object
                            minProperties: 1
                            maxProperties: 32
                            propertyNames:
                              $ref: "#/components/schemas/StudioPath"
                            additionalProperties:
                              $ref: "#/components/schemas/ParamValue"
                  examples:
                    - label: Recipe
                      options:
                        - name: Two-stage
                          set:
                            upscale.bypass: false
                            sample2.bypass: false
                        - name: One-stage
                          set:
                            upscale.bypass: true
                            sample2.bypass: true
        keyframes:
          type: object
          required:
            - first
          additionalProperties: false
          description: The image params a Timeline New shot binds a first and a last frame into, for a workflow whose frames are image params, not keyframe rows (MiniMax H3 Image to video); `Workflow.keyframes` takes this shape. Not a placement
          properties:
            first:
              $ref: "#/components/schemas/StudioPath"
            last:
              type:
                - string
                - "null"
              pattern: ^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$
          examples:
            - first: first.image
              last: last.image
        labels:
          type: object
          maxProperties: 64
          propertyNames:
            $ref: "#/components/schemas/StudioPath"
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 60
          description: A field's title in the Studio when it should differ from the param's label
        presets:
          type: object
          maxProperties: 8
          propertyNames:
            minLength: 1
            maxLength: 40
          additionalProperties:
            type: object
            minProperties: 1
            maxProperties: 32
            propertyNames:
              $ref: "#/components/schemas/StudioPath"
            additionalProperties:
              $ref: "#/components/schemas/ParamValue"
          description: Named sets of values over this workflow's paths (Draft, Final); choosing one sets them in the form
          examples:
            - Draft:
                model.variant: turbo
                model.precision: int8
        preset_help:
          type: array
          maxItems: 4
          description: "The Preset heading's (i) text: the first item whose `when` (the `when` grammar over the workflow's paths) holds, or that has none; absent = no (i)"
          items:
            type: object
            required:
              - text
            additionalProperties: false
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 300
              when:
                type: string
                minLength: 1
                maxLength: 200
        preset_order:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 40
          description: "Every name of `presets` once, in the order Create shows them (an object's key order is not kept); absent = by name. Else 422 `studio.preset_order: every preset once`"
          examples:
            - - Fast
              - Quality
              - Low memory
    WorkflowDoc:
      type: object
      required:
        - title
        - family
        - env
        - nodes
      description: "A workflow as the editor saves or validates it. Node ids are stable slugs: once made they never change. At most 64 nodes and 256 KB (checked as problems, not by the schema). Other top-level keys are ignored by validate (so a WorkflowUpdate body validates as is); WorkflowCreate and WorkflowUpdate are closed."
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; blank = 422
        family:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: The model family every `<family>/…` kind of it belongs to
        env:
          type: string
          pattern: ^[a-z0-9]{1,32}$
          description: The one runner env that runs every node
        nodes:
          type: object
          minProperties: 1
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            $ref: "#/components/schemas/EditorNode"
        studio:
          $ref: "#/components/schemas/StudioLayout"
    EditorNode:
      type: object
      required:
        - kind
      additionalProperties: false
      properties:
        kind:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}(/[a-z][a-z0-9_-]{0,63})?$
        params:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            $ref: "#/components/schemas/ParamValue"
          description: "Param → value; left out = the schema default. A workflow holds no take: image params null, rows without Image items"
        in:
          type: object
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$
          description: Input port, or wired value param → `<node id>.<output>`; one wire per key (connecting again replaces it)
        bypass:
          type: boolean
        optional:
          type: boolean
          description: See GraphNode.optional
        position:
          $ref: "#/components/schemas/NodePosition"
        only:
          $ref: "#/components/schemas/ParamOnly"
    WorkflowCreate:
      description: 'A whole document (based_on optional: "Save as" from an open workflow), or `{based_on, title?}` to copy one'
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/WorkflowDoc"
          type: object
          properties:
            based_on:
              type: string
              minLength: 1
              maxLength: 64
              description: The template or workflow id it was made from; must exist and be readable by the caller (404)
          unevaluatedProperties: false
        - type: object
          required:
            - based_on
          additionalProperties: false
          properties:
            based_on:
              type: string
              minLength: 1
              maxLength: 64
            title:
              type: string
              minLength: 1
              maxLength: 80
              description: Absent = `<source title> copy`
    WorkflowUpdate:
      allOf:
        - $ref: "#/components/schemas/WorkflowDoc"
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version the edit started from (409 when stale)
      unevaluatedProperties: false
    WorkflowPatch:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; blank = 422
    ProblemCode:
      type: string
      enum:
        - too_many_nodes
        - too_large
        - too_many_outputs
        - too_many_seeds
        - wrong_family
        - unknown_kind
        - env_mismatch
        - unknown_param
        - param_invalid
        - unknown_input
        - unknown_source
        - type_mismatch
        - not_bypassable
        - required_input
        - cycle
        - no_output
        - studio_unknown_path
        - studio_duplicate
        - preset_invalid
        - lora_duplicate
        - lora_unknown
        - lora_family
        - not_optional
      description: May grow in a minor version; an unknown code blocks running
    Problem:
      type: object
      required:
        - code
        - message
        - blocks
      additionalProperties: false
      description: One broken graph rule; `node` / `port` / `param` say where, for the editor to mark (absent = the whole workflow)
      properties:
        code:
          $ref: "#/components/schemas/ProblemCode"
        message:
          type: string
          minLength: 1
          description: "Human text, e.g. `sample.cond: expects Conditioning, got Text from prompt.text`; not stable"
        blocks:
          type: string
          enum:
            - save
            - run
          description: "Save: the document cannot be saved (and cannot run); run: it can be saved, not run"
        node:
          type: string
          description: The node id (for a Studio path, the path's node, which may not exist)
        port:
          type: string
          description: "The `in` key: an input port or a wired value param"
        param:
          type: string
          description: A param name (for a Studio path or preset, the path's param; may be `bypass`)
    WorkflowValidation:
      type: object
      required:
        - problems
        - can_save
        - can_run
      additionalProperties: false
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
          description: Sorted by node (whole-workflow ones first), then code, port, param
        can_save:
          type: boolean
          description: No problem blocks saving
        can_run:
          type: boolean
          description: No problem at all
    WorkflowError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: "`workflow has <n> problems: <first message>` for graph problems"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
          description: Every problem; absent for a schema error
    PaletteNode:
      allOf:
        - $ref: "#/components/schemas/NodeSchema"
        - type: object
          required:
            - envs
          properties:
            envs:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^[a-z0-9]{1,32}$
              description: Every env a live host publishes it in (sorted); a workflow may use it when its env is one of them
    NodePalette:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            type: object
            required:
              - family
              - title
              - nodes
            properties:
              family:
                type:
                  - string
                  - "null"
                description: Null for the core kinds
              title:
                type: string
                examples:
                  - Core
                  - Qwen Image 2.1
              nodes:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/PaletteNode"
    PipelineInputType:
      type: string
      enum:
        - Text
        - Image
        - Int
        - Float
        - Seed
      description: "A pipeline input's type: Text fills a string/text param, Int an int, Float a float, Seed a seed, Image an image param (or a rows param with one Image field, as a one-item list)"
    PipelineInput:
      type: object
      required:
        - name
        - type
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: Unique in the node; a batch column is `<inputs node id>.<name>`; a step binds it as `$<name>`
        type:
          $ref: "#/components/schemas/PipelineInputType"
        label:
          type: string
          minLength: 1
          maxLength: 60
          description: Absent = the name
    PipelineSource:
      type: string
      pattern: ^(\$[a-z][a-z0-9_]{0,63}|[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63})$
      description: "`$<input>` (a pipeline input), `<step>.takes` (that step's takes from its latest visit), `<gate>.picked` / `<judge>.picked` (its latest pick)"
      examples:
        - $prompt
        - still.takes
        - review.picked
    PipelineInputsNode:
      type: object
      required:
        - kind
        - inputs
      additionalProperties: false
      properties:
        kind:
          type: string
          const: inputs
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        inputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/PipelineInput"
          description: The batch's columns, in order
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineStepNode:
      type: object
      required:
        - kind
        - workflow
      additionalProperties: false
      properties:
        kind:
          type: string
          const: step
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        workflow:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: A template slug or one of the caller's workflow UUIDs
        seeds:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: Runs per visit, with consecutive seeds in the workflow's seed param
        preset:
          type: string
          minLength: 1
          maxLength: 40
          description: A preset of the workflow's `studio.presets`, applied first
        inputs:
          $ref: "#/components/schemas/RunInputs"
          description: Fixed values (`<node>.<param>`, as RunRequest.inputs), after the preset; never a take
        bind:
          type: object
          maxProperties: 16
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}\.[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            $ref: "#/components/schemas/PipelineSource"
          description: Workflow param `<node>.<param>` ← a source, applied last
          examples:
            - prompt.text: $prompt
              encode.refs: review.picked
        looks:
          $ref: "#/components/schemas/LookIds"
          description: The looks every run of this step is made with (as RunRequest.looks); missing = []
        each:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}\.items$
          description: "Fan out: one branch per item of this agent's or write's list (`<producer>.items`), at most its `list.max`; binds read the branch's item as `<producer>.item`. Later nodes read `<step>.takes` as every branch's takes, branch order then seed order"
          examples:
            - director.items
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineGateNode:
      type: object
      required:
        - kind
        - takes
      additionalProperties: false
      properties:
        kind:
          type: string
          const: gate
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        takes:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: The step whose latest takes are the candidates
        keep:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: A pick is 1 to keep of the candidates
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineOutputNode:
      type: object
      required:
        - kind
        - from
        - collection
      additionalProperties: false
      properties:
        kind:
          type: string
          const: output
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        from:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}\.(takes|picked)$
          description: The takes the row ends with
          examples:
            - edit.takes
        collection:
          type: string
          minLength: 1
          maxLength: 80
          description: Names the collection (Batch.collection)
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineCriteria:
      type: object
      additionalProperties: false
      description: "A judge's checklist: a take passes when every `must` line holds; `nice` lines only order the takes that pass. 1 to 12 lines in all, none twice (judge_criteria). Missing list = []"
      properties:
        must:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 200
          examples:
            - - No extra or missing limbs
              - No text or watermarks
        nice:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 200
          examples:
            - - Subject is sharp
    PipelineModel:
      type: string
      pattern: ^(auto|[a-z0-9][a-z0-9_-]{0,63}|server:[a-z][a-z0-9-]{0,31}(/[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})?|remote:[a-z][a-z0-9-]{0,31}/[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$
      default: auto
      description: "`auto` or an ask workflow (`media: text`) the caller can run: `qwen-image-ask` (Qwen Image's own text encoder, no extra load after a Qwen step), `llm-ask` (Qwen3.8 27B); absent model = its default) and `remote:<provider>/<model>` (a remote provider: needs the pipeline's `remote` switch). A judge needs a local model (it sends thumbnails; server and remote models get text only)"
      examples:
        - auto
        - llm-ask
        - server:ollama/qwen2.5:7b
        - remote:openai/gpt-4.1-mini
    PipelineTextSources:
      type: array
      minItems: 1
      maxItems: 4
      items:
        $ref: "#/components/schemas/PipelineSource"
      description: "Text sources, in order: `$<Text input>`, `<judge>.reasons`, `<memory>.notes`"
    PipelineJudgeNode:
      type: object
      required:
        - kind
        - takes
        - criteria
      additionalProperties: false
      description: ": a vision-language model checks a step's takes against the checklist, keeps the best `keep` and gives reasons; its pass / fail edges are a branch like a gate's"
      properties:
        kind:
          type: string
          const: judge
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        takes:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: The step whose latest takes it judges
        criteria:
          $ref: "#/components/schemas/PipelineCriteria"
        keep:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
          description: Keep the best K of the takes (at most the step's seeds)
        mode:
          type: string
          enum:
            - suggest
            - auto
          default: suggest
          description: "Suggest: the row parks like a gate with the judge's pick pre-selected (a fail with loops left retries without parking); auto: it picks alone"
        model:
          $ref: "#/components/schemas/PipelineModel"
        memory:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: "A memory read node before it: the user's past picks at this judge (judge examples) and notes go into its prompt; absent = no memory (\"Memory: Off\")"
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineWriteNode:
      type: object
      required:
        - kind
        - from
      additionalProperties: false
      description: Writes text from its sources (a rewritten prompt from a judge's reasons) into a Text input for the rest of the row; mentions in the answer are expanded by studio like any prompt
      properties:
        kind:
          type: string
          const: write
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        from:
          $ref: "#/components/schemas/PipelineTextSources"
        to:
          type: string
          pattern: ^\$[a-z][a-z0-9_]{0,63}$
          description: "The Text input it overwrites (`$prompt`): later binds of it read the new text. Required without `list`, absent with it (write_target)"
        list:
          $ref: "#/components/schemas/PipelineListSpec"
        instruction:
          type: string
          minLength: 1
          maxLength: 1000
          default: Fix what the reviewer found; keep everything else.
        form:
          type: string
          enum:
            - text
            - script
          default: text
          description: "Script = the answer is a dialogue script (`@handle (style): text` lines, template write-script/v1) for a `$<input>` bound to a `script` param; not with `list`"
        model:
          $ref: "#/components/schemas/PipelineModel"
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineDecideNode:
      type: object
      required:
        - kind
        - question
        - from
        - routes
      additionalProperties: false
      description: Routes the row along one of its declared routes from a structured answer (its routes edge maps each label to a node)
      properties:
        kind:
          type: string
          const: decide
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        question:
          type: string
          minLength: 1
          maxLength: 1000
        from:
          $ref: "#/components/schemas/PipelineTextSources"
        routes:
          type: object
          minProperties: 2
          maxProperties: 6
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,31}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
          description: Route label → what it means (the model reads it)
          examples:
            - retry: the takes miss the brief
              accept: good enough to animate
        model:
          $ref: "#/components/schemas/PipelineModel"
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineMemoryNode:
      description: ": read the batch's memory snapshot (taken when the batch starts), or write a note for the next batches"
      oneOf:
        - type: object
          required:
            - kind
            - op
          additionalProperties: false
          properties:
            kind:
              type: string
              const: memory
            title:
              $ref: "#/components/schemas/PipelineNodeTitle"
            op:
              type: string
              const: read
            key:
              type: string
              pattern: ^[a-z][a-z0-9_-]{0,63}$
              description: Only notes with this key; absent = every note
            limit:
              type: integer
              minimum: 1
              maximum: 16
              default: 8
              description: At most this many examples and this many notes, newest first
            position:
              $ref: "#/components/schemas/NodePosition"
        - type: object
          required:
            - kind
            - op
            - key
            - from
          additionalProperties: false
          properties:
            kind:
              type: string
              const: memory
            title:
              $ref: "#/components/schemas/PipelineNodeTitle"
            op:
              type: string
              const: write
            key:
              type: string
              pattern: ^[a-z][a-z0-9_-]{0,63}$
            from:
              $ref: "#/components/schemas/PipelineTextSources"
            position:
              $ref: "#/components/schemas/NodePosition"
    PipelineListSpec:
      type: object
      required:
        - max
      additionalProperties: false
      description: The node answers a list of texts (a shot list), 1 to `max` items, read only by a step's `each` (`<node>.items`; each branch binds `<node>.item`). Its mentions follow the write rule
      properties:
        max:
          type: integer
          minimum: 1
          maximum: 24
          description: "The fan-out's declared maximum: Submit's worst case uses it"
    PipelineAgentCaps:
      type: object
      additionalProperties: false
      description: "Hard caps per visit (the director's chat: per wake). Reaching one ends the visit: an item failure (`<node>: stopped at <n> turns`), counted in the worst case"
      properties:
        max_turns:
          type: integer
          minimum: 1
          maximum: 16
          default: 6
          description: Model calls (each a queue item, or a remote request)
        max_tool_calls:
          type: integer
          minimum: 0
          maximum: 32
          default: 12
        max_tokens:
          type: integer
          minimum: 1000
          maximum: 200000
          default: 16000
          description: Prompt + answer tokens over the visit's turns
    PipelineAgentNode:
      type: object
      required:
        - kind
        - instruction
      additionalProperties: false
      description: ": an LLM agent with tools, a loop of model turns. It ends a visit with no tool call (one plain edge), with `route` (a routes edge, like a decide's), and with `set_items` before that when it has a `list`. `director: true` also gives the batch a chat with it"
      properties:
        kind:
          type: string
          const: agent
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        instruction:
          type: string
          minLength: 1
          maxLength: 4000
          description: What it is for (`Turn the script into a shot list, one prompt per shot, using the @elements in it.`)
        from:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/PipelineSource"
          description: Text sources it reads, as a write's; missing = []
        tools:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - gallery.search
              - memory.read
              - memory.write
              - library.read
              - rows.add
              - rows.edit
          description: From the fixed set; rows.edit only with director (agent_tools); missing = []
        routes:
          type: object
          minProperties: 2
          maxProperties: 6
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,31}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 200
          description: "Route label → meaning; present: its only edge is a routes edge with these labels (decide_routes)"
        list:
          $ref: "#/components/schemas/PipelineListSpec"
        caps:
          $ref: "#/components/schemas/PipelineAgentCaps"
        model:
          $ref: "#/components/schemas/PipelineModel"
        director:
          type: boolean
          default: false
          description: "The pipeline's director (at most one: director_count): its batches get a chat"
        wake_on_rows:
          type: string
          enum:
            - all
            - failed
            - none
          default: all
          description: "Director only: which row ends wake it (a message always does)"
        max_wakes:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
          description: "Director only: wakes per batch; then its chat is off"
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineCustomNode:
      type: object
      required:
        - kind
        - node
      additionalProperties: false
      description: Fields as GET /v1/studio/custom-nodes lists them; its output fields are sources `<id>.<field>`. One plain edge
      properties:
        kind:
          type: string
          const: custom
        title:
          $ref: "#/components/schemas/PipelineNodeTitle"
        node:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}/[a-z][a-z0-9-]{0,31}$
          description: The registered name
          examples:
            - text/prefix
        inputs:
          type: object
          maxProperties: 16
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          description: Fixed input field values (JSON); missing = {}
        bind:
          type: object
          maxProperties: 16
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            $ref: "#/components/schemas/PipelineSource"
          description: "Input field ← a source (a string field: a text source or Text input; a take-id list field: a takes source); missing = {}"
        position:
          $ref: "#/components/schemas/NodePosition"
    PipelineRemote:
      type: object
      additionalProperties: false
      description: Calls that leave the machine. Off by default (absent = off); a `remote:` model or a network custom node needs `enabled` and its provider in `providers` (remote_not_enabled), and the deployment's remote switch (remote_off). The caps are per batch, over every row and the director's chat; a call past one fails its row (`remote cap reached`)
      properties:
        enabled:
          type: boolean
          default: false
        providers:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][a-z0-9-]{0,31}$
          description: Remote providers this pipeline may call; missing = []
        max_calls:
          type: integer
          minimum: 1
          maximum: 10000
          default: 200
        max_tokens:
          type: integer
          minimum: 1000
          maximum: 10000000
          default: 400000
    PipelineEgress:
      type: object
      required:
        - node
        - where
        - provider
        - model
        - fields
        - thumbnails
        - per_row
        - chat
      additionalProperties: false
      description: "One node whose calls leave this process for a model server: exactly what is sent (Submit shows it). `fields`: the parts of the prompt, by name: `instruction`, `question`, `routes`, each `from` source, `items`, `tool:<tool>` (tool results go back to the model), `chat` (the director's chat), `input:<field>` (a custom node's)"
      properties:
        node:
          type: string
        where:
          type: string
          enum:
            - server
            - remote
            - network
          description: "Server: a local server (its calls are queue items); remote: a remote provider; network: a custom node that calls the network"
        provider:
          type:
            - string
            - "null"
        model:
          type:
            - string
            - "null"
        fields:
          type: array
          maxItems: 32
          items:
            type: string
        thumbnails:
          type: integer
          const: 0
        per_row:
          type: object
          required:
            - calls
            - tokens
          properties:
            calls:
              type: integer
              minimum: 0
            tokens:
              type: integer
              minimum: 0
          description: The worst case per row (a re-ask included)
        chat:
          oneOf:
            - type: object
              required:
                - calls
                - tokens
              properties:
                calls:
                  type: integer
                  minimum: 0
                tokens:
                  type: integer
                  minimum: 0
            - type: "null"
          description: "The director: its chat's worst case per batch (max_wakes × max_turns × 2 calls, max_wakes × max_tokens); null otherwise"
    PipelineReserved:
      type: object
      required:
        - provider
        - host
        - memory_gb
      additionalProperties: false
      description: A local server the pipeline uses, and the memory the host reserves for it (always, while the provider is enabled)
      properties:
        provider:
          type: string
        host:
          type: string
        memory_gb:
          type: number
          minimum: 0.5
    PipelineNodeTitle:
      type: string
      minLength: 1
      maxLength: 60
      description: The card's title; absent = derived by the client
    PipelineNode:
      oneOf:
        - $ref: "#/components/schemas/PipelineInputsNode"
        - $ref: "#/components/schemas/PipelineStepNode"
        - $ref: "#/components/schemas/PipelineGateNode"
        - $ref: "#/components/schemas/PipelineOutputNode"
        - $ref: "#/components/schemas/PipelineJudgeNode"
        - $ref: "#/components/schemas/PipelineWriteNode"
        - $ref: "#/components/schemas/PipelineDecideNode"
        - $ref: "#/components/schemas/PipelineMemoryNode"
        - $ref: "#/components/schemas/PipelineAgentNode"
        - $ref: "#/components/schemas/PipelineCustomNode"
      discriminator:
        propertyName: kind
        mapping:
          inputs: "#/components/schemas/PipelineInputsNode"
          step: "#/components/schemas/PipelineStepNode"
          gate: "#/components/schemas/PipelineGateNode"
          output: "#/components/schemas/PipelineOutputNode"
          judge: "#/components/schemas/PipelineJudgeNode"
          write: "#/components/schemas/PipelineWriteNode"
          decide: "#/components/schemas/PipelineDecideNode"
          memory: "#/components/schemas/PipelineMemoryNode"
          agent: "#/components/schemas/PipelineAgentNode"
          custom: "#/components/schemas/PipelineCustomNode"
    PipelineBranch:
      type: object
      required:
        - pass
        - fail
        - max
      additionalProperties: false
      description: "A gate's or a judge's branch: pass = a pick was made (a judge: its verdict pass, or the user's pick); fail = every candidate rejected (a judge: verdict fail), taken at most `max` times per row (a judge's retry target: its step again, or a write that rewrites the prompt); on the next reject the row goes to `then`"
      properties:
        pass:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        fail:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        max:
          type: integer
          minimum: 1
          maximum: 10
          description: The loop cap
        then:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: Required for a gate (edge_invalid). a reject there fails the row
    PipelineEdge:
      type: array
      minItems: 2
      maxItems: 2
      prefixItems:
        - type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: From
        - oneOf:
            - type: string
              pattern: ^[a-z][a-z0-9_]{0,63}$
              description: To (plain edge)
            - $ref: "#/components/schemas/PipelineBranch"
            - $ref: "#/components/schemas/PipelineRoutes"
      examples:
        - - still
          - review
        - - review
          - pass: edit
            fail: still
            max: 2
            then: out
        - - check
          - routes:
              retry: still
              accept: clip
            max: 2
            then: accept
    PipelineRoutes:
      type: object
      required:
        - routes
        - max
        - then
      additionalProperties: false
      description: "A decide's only edge: route label → node (the same labels as the node's `routes`). Every route but `then` counts against `max` per row; once taken `max` times, `then` is taken whatever the answer"
      properties:
        routes:
          type: object
          minProperties: 2
          maxProperties: 6
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,31}$
          additionalProperties:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,63}$
        max:
          type: integer
          minimum: 1
          maximum: 10
        then:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,31}$
          description: One of the labels
    PipelineDoc:
      type: object
      required:
        - title
        - nodes
        - edges
      description: Write, decide and memory; Node ids are stable slugs. At most 24 nodes and 64 KB (problems, not the schema). Other top-level keys are ignored by validate; PipelineCreate and PipelineUpdate are closed.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; blank = 422
        nodes:
          type: object
          minProperties: 1
          propertyNames:
            pattern: ^[a-z][a-z0-9_]{0,63}$
          additionalProperties:
            $ref: "#/components/schemas/PipelineNode"
        edges:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PipelineEdge"
        remote:
          $ref: "#/components/schemas/PipelineRemote"
    Pipeline:
      allOf:
        - $ref: "#/components/schemas/PipelineDoc"
      type: object
      required:
        - id
        - based_on
        - version
        - created_at
        - updated_at
        - workflow_titles
        - last_batch
      properties:
        id:
          type: string
          format: uuid
        based_on:
          type:
            - string
            - "null"
          description: The pipeline it was copied or saved from (it may be gone since); null otherwise
        version:
          type: integer
          minimum: 1
          description: 1 on create, +1 on every PUT and PATCH
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        workflow_titles:
          type: object
          additionalProperties:
            type: string
          description: Every step's workflow id → its title now (an unknown one left out), for the cards
        last_batch:
          oneOf:
            - $ref: "#/components/schemas/Batch"
            - type: "null"
          description: The newest batch of it; null when it never ran
        problems:
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
          description: Only from GET /v1/studio/pipelines/{pipeline_id}, POST and PUT; empty = it can run
        bounds:
          $ref: "#/components/schemas/PipelineBounds"
          description: With problems when nothing blocks saving
        egress:
          type: array
          items:
            $ref: "#/components/schemas/PipelineEgress"
          description: With bounds
        reserved:
          type: array
          items:
            $ref: "#/components/schemas/PipelineReserved"
          description: With bounds
    PipelineList:
      type: object
      required:
        - pipelines
      properties:
        pipelines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Pipeline"
    PipelineCreate:
      description: A whole document (based_on optional), or `{based_on, title?}` to copy one of the caller's pipelines
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/PipelineDoc"
          type: object
          properties:
            based_on:
              type: string
              format: uuid
              description: The pipeline it was made from; must be the caller's (404)
          unevaluatedProperties: false
        - type: object
          required:
            - based_on
          additionalProperties: false
          properties:
            based_on:
              type: string
              format: uuid
            title:
              type: string
              minLength: 1
              maxLength: 80
              description: Absent = `<source title> copy`
    PipelineUpdate:
      allOf:
        - $ref: "#/components/schemas/PipelineDoc"
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version the edit started from (409 when stale)
      unevaluatedProperties: false
    PipelinePatch:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; blank = 422
    PipelineProblemCode:
      type: string
      enum:
        - too_many_nodes
        - too_large
        - inputs_node
        - duplicate_input
        - unknown_node
        - edge_invalid
        - branch_not_gate
        - uncapped_cycle
        - too_many_runs
        - unreachable
        - dead_end
        - no_output
        - gate_takes
        - gate_keep
        - bind_source
        - unknown_workflow
        - workflow_cannot_run
        - unknown_preset
        - step_input_invalid
        - bind_unknown
        - bind_type
        - unbound_input
        - step_seeds
        - unknown_look
        - look_fit
        - too_many_calls
        - judge_criteria
        - decide_routes
        - write_target
        - unknown_model
        - agent_tools
        - director_count
        - fanout_source
        - fanout_takes
        - model_media
        - remote_not_enabled
        - remote_off
        - unknown_custom
        - custom_input
      description: May grow in a minor version; an unknown code blocks running
    PipelineProblem:
      type: object
      required:
        - code
        - message
        - blocks
      additionalProperties: false
      description: "One broken pipeline rule, the same shape as Problem: `node` the pipeline node, `port` a bind key (`<node>.<param>` of the step's workflow) or `from` for an output, `param` an input name or a step input key"
      properties:
        code:
          $ref: "#/components/schemas/PipelineProblemCode"
        message:
          type: string
          minLength: 1
          description: Human text; not stable
        blocks:
          type: string
          enum:
            - save
            - run
        node:
          type: string
        port:
          type: string
        param:
          type: string
    PipelineValidation:
      type: object
      required:
        - problems
        - can_save
        - can_run
      additionalProperties: false
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
          description: Sorted by node (whole-pipeline ones first), then code, port, param
        can_save:
          type: boolean
        can_run:
          type: boolean
        bounds:
          $ref: "#/components/schemas/PipelineBounds"
        models:
          type: object
          additionalProperties:
            type: string
          description: Judge, write and decide node id → the ask workflow its model resolves to now (auto included); a node without one is left out.
        egress:
          type: array
          items:
            $ref: "#/components/schemas/PipelineEgress"
          description: What leaves the machine, per node whose model is a server or remote one (or a custom node that calls the network), by node id; sent with bounds; [] = nothing leaves
        reserved:
          type: array
          items:
            $ref: "#/components/schemas/PipelineReserved"
          description: The memory reserved for the local servers it uses
    PipelineBounds:
      type: object
      required:
        - runs
        - llm_calls
      additionalProperties: false
      description: The worst case per row, sent when nothing blocks saving. Submit multiplies by the rows for its estimate.
      properties:
        runs:
          type: integer
          minimum: 0
          maximum: 64
          description: "Generation runs: Σ over steps of seeds × branches × visits (branches: a fanned-out step's list max, else 1)"
        llm_calls:
          type: integer
          minimum: 0
          maximum: 32
          description: Judge, write and decide visits (each one ask run, at most 2 tries; a re-ask after a failed check is a second run)
        tool_calls:
          type: integer
          minimum: 0
          description: Agent visits × max_tool_calls
        remote_calls:
          type: integer
          minimum: 0
          description: Requests to remote providers (a re-ask included), per row; the director's chat is per batch (egress)
        remote_tokens:
          type: integer
          minimum: 0
          description: Their token bound per row
        chat:
          type: object
          required:
            - calls
            - tokens
            - tool_calls
          additionalProperties: false
          description: "With a director only, whatever its model source: its chat's worst case per batch (not per row): calls max_wakes × max_turns × 2 (a re-ask included; local models: queue items), tokens max_wakes × max_tokens, tool_calls max_wakes × max_tool_calls"
          properties:
            calls:
              type: integer
              minimum: 0
            tokens:
              type: integer
              minimum: 0
            tool_calls:
              type: integer
              minimum: 0
        added_rows:
          type: integer
          minimum: 1
          maximum: 100
          description: "When an agent declares rows.add: the most rows agents may add to a batch (100), each with the per-row worst case"
    PipelineError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: "`pipeline has <n> problems: <first message>` for pipeline problems"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
          description: Every problem; absent for a schema error
    TakePipeline:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Absent = `<take title> pipeline`, cut to 80 characters
    RunStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    RunInputs:
      type: object
      description: "`<node id>.<param name>` → value; only the params to change"
      propertyNames:
        pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
      additionalProperties:
        $ref: "#/components/schemas/ParamValue"
      examples:
        - prompt.text: a red fox
          echo.steps: 20
    RunRequest:
      type: object
      required:
        - workflow_id
      additionalProperties: false
      properties:
        workflow_id:
          type: string
        inputs:
          $ref: "#/components/schemas/RunInputs"
          description: Missing = {}
        looks:
          $ref: "#/components/schemas/LookIds"
          description: The chosen looks, every group together, in the order the composer's tiles list them (tile order, then pick order); missing = []. Resolved with the mentions
        host:
          type: string
          pattern: ^[a-z0-9]{1,32}$
          description: "(Create's Run on): run it on this host only, attempt 2 included; absent = automatic. A host that cannot take it now is a 422 at create"
    RunPlan:
      type: object
      required:
        - host
        - peak_gb
        - reason
      additionalProperties: false
      properties:
        host:
          type:
            - string
            - "null"
          description: The host the run would be eligible on, the first by name; null = none
        peak_gb:
          type:
            - number
            - "null"
          minimum: 0
          description: Its planned peak there in GB
        reason:
          type:
            - string
            - "null"
          description: Why no host is eligible (the text the run would fail with, `no live host for env mlx`); null when one is
    LookId:
      type: string
      pattern: ^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$
      description: "A look: one of the caller's own (a UUID) or a starter look `<family>/<pack look id>` (stable across hosts)"
      examples:
        - qwen-image/window-light
    LookIds:
      type: array
      maxItems: 8
      items:
        $ref: "#/components/schemas/LookId"
      description: Look ids, in order; a repeated id counts once (its first place)
    RunProgress:
      type: object
      required:
        - node
        - step
        - of
      properties:
        node:
          type: string
          description: The node id that is stepping
        step:
          type: integer
          minimum: 1
        of:
          type: integer
          minimum: 1
        phase:
          type: string
          description: What the node is doing (loading transformer, sampling, decoding)
        phase_id:
          type: string
          description: The id of one of the node's NodeSchema `phases` it is in; only from a node with phases
        eta_s:
          type: number
          minimum: 0
          description: Estimated seconds until the run finishes
    RunOutput:
      type: object
      required:
        - index
        - key
        - kind
        - url
        - width
        - height
      allOf:
        - if:
            properties:
              kind:
                const: video
            required:
              - kind
          then:
            required:
              - video
        - if:
            properties:
              kind:
                const: audio
            required:
              - kind
          then:
            required:
              - audio
            properties:
              width:
                type: "null"
              height:
                type: "null"
      properties:
        index:
          type: integer
          minimum: 0
        key:
          type: string
          description: Object key, u/<owner_id>/runs/<run_id>/<attempt>/<index>.<ext>
        kind:
          type: string
          enum:
            - image
            - video
            - audio
          description: Width and height null)
        url:
          $ref: "#/components/schemas/SignedUrl"
          description: The image, or the MP4 of a video (served with Range)
        width:
          type:
            - integer
            - "null"
        height:
          type:
            - integer
            - "null"
        video:
          $ref: "#/components/schemas/VideoInfo"
          description: Kind video only (absent for an image)
        audio:
          $ref: "#/components/schemas/AudioInfo"
          description: "Kind audio only: its length and sample rate"
        seed:
          type: integer
          minimum: 0
          description: The seed it was made with; absent when the workflow has none
        take_id:
          type: string
          format: uuid
          description: The take this output became (every output is a take)
        thumb_url:
          $ref: "#/components/schemas/SignedUrl"
          description: "Its take's thumb_url (Take.thumb_url); absent without a take (or once it is deleted): use `url`"
    RunLane:
      type: string
      enum:
        - interactive
        - batch
      description: Interactive (Create, POST …/runs) is dispatched before batch
    Run:
      type: object
      required:
        - id
        - session_id
        - workflow_id
        - inputs
        - status
        - progress
        - error
        - outputs
        - host
        - lane
        - attempt
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        workflow_id:
          type: string
        inputs:
          $ref: "#/components/schemas/RunInputs"
          description: As requested
        status:
          $ref: "#/components/schemas/RunStatus"
        progress:
          oneOf:
            - $ref: "#/components/schemas/RunProgress"
            - type: "null"
          description: The last progress event; null before the first
        error:
          type:
            - string
            - "null"
          description: Set when failed
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/RunOutput"
          description: By index; outputs whose take was deleted are left out
        host:
          type:
            - string
            - "null"
          description: The host it was sent to (its current attempt's); while queued, the host it is lined up for (the one the dispatcher would choose now, may change); null when none was eligible
        lost_host:
          type:
            - string
            - "null"
          description: The host attempt 1 was sent to, when that host stopped responding and the run was queued again; absent or null otherwise
        lane:
          $ref: "#/components/schemas/RunLane"
        attempt:
          type: integer
          minimum: 1
          maximum: 2
          description: 1; 2 after its runner was lost once and it was queued again
        position:
          type: integer
          minimum: 1
          description: "Only while queued: 1 + the number of queued runs (anyone's) the dispatcher would release on `host` before it, recomputed on every read; absent otherwise"
        resolved:
          $ref: "#/components/schemas/Resolved"
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
          description: The runner reported running
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        batch_id:
          type:
            - string
            - "null"
          format: uuid
          description: The batch it runs a row of (lane batch); absent or null for a Create run
        batch_row:
          type:
            - integer
            - "null"
          minimum: 1
          description: The batch row number; with batch_id
        workflow_version:
          type:
            - integer
            - "null"
          minimum: 1
          description: "A user workflow: the version it ran (its graph is the run's snapshot); absent or null for a template"
        looks:
          $ref: "#/components/schemas/LookIds"
          description: "The looks it was asked with (RunRequest.looks; a batch run: its row's or step's), as requested; absent or empty = none"
        answer:
          $ref: "#/components/schemas/RunAnswer"
        purpose:
          type:
            - string
            - "null"
          enum:
            - name
            - null
          description: Name = the hidden run that names its session (local namer, lane batch); only `GET /v1/studio/queue` lists one. Absent or null otherwise
        unloads_pinned:
          type: array
          minItems: 1
          description: "Only while queued (computed on every read, like `position`): the pinned components the host memory admission would unload, as its last-resort victims, if the run were admitted on `host` now; they are loaded again, and pinned again, when next used. Absent when none"
          items:
            type: object
            required:
              - env
              - component
              - model
              - variant
              - precision
              - gb
            additionalProperties: false
            properties:
              env:
                type: string
              component:
                type: string
              model:
                type: string
              variant:
                type: string
              precision:
                type: string
              gb:
                type: number
                minimum: 0
                description: "Its resident size: what reloading it costs"
    RunAnswer:
      type: object
      required:
        - text
        - tokens_in
        - tokens_out
        - seconds
      description: "A run of a text (ask) workflow (lane batch: a judge, write or decide call): its answer, stored on the run, never a take (`outputs` stays empty). Sent once it succeeded, and when it failed on the schema"
      properties:
        text:
          type: string
          maxLength: 32768
          description: The last try
        tokens_in:
          type: integer
          minimum: 0
        tokens_out:
          type: integer
          minimum: 0
        seconds:
          type: number
          minimum: 0
    Resolved:
      type: object
      description: Values the runner chose (a random seed, an auto length), sent with succeeded
      properties:
        seed:
          type: integer
          minimum: 0
        params:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
          description: '`<node>.<param>` → the value the runner chose for a param set to `"auto"` (`duration.frames`: the predicted length); absent when none'
          examples:
            - duration.frames: 89
        texts:
          type: object
          maxProperties: 4
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 16384
          description: "`<node>.<output>` → a Text output the runner made that the user did not write (an enhancer's prompt); absent when none"
          examples:
            - enhance.text: A ginger cat asleep on a green velvet sofa, soft window light
    RunList:
      type: object
      required:
        - runs
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    Queue:
      type: object
      required:
        - runs
        - hosts
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
          description: "The caller's queued and running runs, every session: running first, then queued by host and position"
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/QueueHost"
    QueueHost:
      type: object
      required:
        - host
        - state
        - others_queued
      properties:
        host:
          type: string
        state:
          type: string
          enum:
            - idle
            - busy
            - offline
          description: Busy while anyone's run is running on it (which and whose is never shown)
        others_queued:
          type: integer
          minimum: 0
          description: Other users' queued runs lined up for this host; a count only
    SessionEvent:
      description: "One stored event of the session. `status`: the run's new status (`queued` and studio-decided ones included); `progress`: a step; `output`: an output stored, its key turned into a signed `url`. After a terminal status, `GET /v1/studio/runs/{run_id}` has the whole run."
      oneOf:
        - $ref: "#/components/schemas/StatusEvent"
        - $ref: "#/components/schemas/ProgressEvent"
        - $ref: "#/components/schemas/OutputEvent"
        - $ref: "#/components/schemas/TitleEvent"
      discriminator:
        propertyName: type
        mapping:
          status: "#/components/schemas/StatusEvent"
          progress: "#/components/schemas/ProgressEvent"
          output: "#/components/schemas/OutputEvent"
          session: "#/components/schemas/TitleEvent"
    StatusEvent:
      type: object
      required:
        - seq
        - type
        - run_id
        - ts
        - data
      properties:
        seq:
          type: integer
          minimum: 1
          description: Per-session cursor
        type:
          type: string
          const: status
        run_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        data:
          type: object
          required:
            - status
            - error
            - host
          properties:
            status:
              $ref: "#/components/schemas/RunStatus"
            error:
              type:
                - string
                - "null"
            host:
              type:
                - string
                - "null"
            resolved:
              $ref: "#/components/schemas/Resolved"
            attempt:
              type: integer
              minimum: 1
              maximum: 2
              description: The attempt this status belongs to; a `queued` with attempt 2 means the run is retried after its runner was lost; absent = 1
    ProgressEvent:
      type: object
      required:
        - seq
        - type
        - run_id
        - ts
        - data
      properties:
        seq:
          type: integer
          minimum: 1
        type:
          type: string
          const: progress
        run_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/RunProgress"
    OutputEvent:
      type: object
      required:
        - seq
        - type
        - run_id
        - ts
        - data
      properties:
        seq:
          type: integer
          minimum: 1
        type:
          type: string
          const: output
        run_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/RunOutput"
    TitleEvent:
      type: object
      required:
        - seq
        - type
        - run_id
        - ts
        - data
      description: The namer gave the session its title; `run_id` is the run whose prompt it was named from
      properties:
        seq:
          type: integer
          minimum: 1
        type:
          type: string
          const: session
        run_id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        data:
          type: object
          required:
            - title
            - title_source
            - named_by
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 200
            title_source:
              $ref: "#/components/schemas/TitleSource"
            named_by:
              type:
                - string
                - "null"
              maxLength: 60
    EventPage:
      type: object
      required:
        - events
        - last_seq
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SessionEvent"
        last_seq:
          type: integer
          minimum: 0
          description: Next `since` (unchanged when the page is empty)
    Host:
      type: object
      required:
        - host
        - env
        - state
        - updated_at
      properties:
        host:
          type: string
        env:
          type: string
        state:
          type: string
          enum:
            - idle
            - busy
            - offline
        updated_at:
          type: string
          format: date-time
          description: The runner's last refresh
        memory:
          type: object
          required:
            - budget_gb
            - used_gb
          properties:
            budget_gb:
              type: number
            used_gb:
              type: number
        host_memory:
          type: object
          required:
            - budget_gb
            - used_gb
          description: The same on every entry of one host. `budget_gb` = the smallest `memory.budget_gb` among the host's keys (fresh or offline) that report one; `used_gb` = the sum over those keys of the larger of Σ `gb` of its resident components and its measured `memory.used_gb` (what the dispatcher's admission counts), both rounded to 0.1. Absent when no key of the host reports memory
          properties:
            budget_gb:
              type: number
              minimum: 0
            used_gb:
              type: number
              minimum: 0
            kind:
              type: string
              enum:
                - unified
                - vram
                - ram
              description: "What the numbers measure, from the host's keys' `device.kind`: unified (mps: Apple silicon's shared memory), vram (cuda: the GPU's memory), ram (cpu). absent from older runners = unified"
        device:
          type: object
          required:
            - kind
            - name
            - memory_total_gb
          description: "When the runner reports it: its hosts key's `device`"
          properties:
            kind:
              type: string
              enum:
                - cuda
                - mps
                - cpu
            name:
              type: string
              examples:
                - NVIDIA L4
                - Apple M3 Max
            memory_total_gb:
              type: number
              minimum: 0
              description: VRAM (cuda), unified RAM (mps), RAM (cpu)
            memory_used_gb:
              type: number
              minimum: 0
              description: "Cuda: the whole device's used memory, every process"
            capability:
              type: string
              examples:
                - "8.9"
            driver:
              type: string
              examples:
                - 580.95.05
            runtime:
              type: string
              examples:
                - torch 2.15.0 · CUDA 13.2
        host_ram:
          type: object
          required:
            - budget_gb
            - used_gb
          description: "Cuda hosts only: the host-RAM limit (RAM − RUNNER_RAM_RESERVE_GB) and the process's resident set; load staging and CPU-side components count here, not in `memory` / `host_memory`"
          properties:
            budget_gb:
              type: number
              minimum: 0
            used_gb:
              type: number
              minimum: 0
        resident:
          type: array
          description: Model components loaded now; no run or owner
          items:
            type: object
            required:
              - component
              - model
              - variant
              - precision
              - gb
              - pinned
            properties:
              component:
                type: string
              model:
                type: string
              variant:
                type: string
              precision:
                type: string
                enum:
                  - bf16
                  - fp16
                  - int8
                  - int4
                  - fp8
                  - fp32
              compute:
                type: string
                enum:
                  - float32
                  - float16
                description: "The load option the model node's `compute` set (LTX on MLX: the transformer at float16 is its own entry); absent = float32"
              gb:
                type: number
              pinned:
                type: boolean
              last_used:
                type: string
                format: date-time
                description: When the runner last used it; absent from older runners
              pinned_why:
                type: string
                enum:
                  - in_use
                  - pin
                description: "With pinned true: in_use = the running run uses it; pin = a pin of the host"
              device:
                type: string
                enum:
                  - cpu
                description: "Cuda hosts: held in host RAM (CPU offload), counted in `host_ram`, not in `memory`; absent = on the device"
              loras:
                type: array
                description: "A component with LoRAs baked in is its own entry: those LoRAs in order; absent or empty = the plain component. Another user's own LoRA shows only its size (`lora_id`, `name`, `strength` null)"
                items:
                  type: object
                  required:
                    - lora_id
                    - name
                    - strength
                    - bytes
                  properties:
                    lora_id:
                      type:
                        - string
                        - "null"
                    name:
                      type:
                        - string
                        - "null"
                    strength:
                      type:
                        - number
                        - "null"
                    bytes:
                      type: integer
                      minimum: 1
        cached_gb:
          type: number
          minimum: 0
          description: "What the env holds beyond its resident components (cached handles: cached node results, the device cache, the runtime): max(0, memory.used_gb − Σ gb), rounded to 0.1; absent without memory."
        machine:
          type: object
          required:
            - os
            - accel
            - packaging
            - ram_gb
          properties:
            os:
              type: string
              enum:
                - macos
                - linux
            accel:
              type: string
              enum:
                - metal
                - cuda
                - cpu
            packaging:
              type: string
              enum:
                - native
                - container
            ram_gb:
              type: number
              minimum: 0
        admin:
          $ref: "#/components/schemas/HostAdmin"
    HostAdmin:
      type: object
      required:
        - settings
        - policy
        - run
        - idle_since
        - unload_pending
        - hub_token
      description: "Admins only: what the Hosts screen needs beyond the redacted view"
      properties:
        settings:
          oneOf:
            - $ref: "#/components/schemas/HostSettings"
            - type: "null"
          description: The host's settings (the same on every entry of the host); null until an admin sets them (the runners use their env defaults, `policy`)
        policy:
          oneOf:
            - type: object
              required:
                - after_run
                - idle_unload_min
                - reserve_gb
                - settings_version
              properties:
                after_run:
                  $ref: "#/components/schemas/AfterRun"
                idle_unload_min:
                  type: integer
                  minimum: 0
                reserve_gb:
                  type: number
                  minimum: 0
                settings_version:
                  type:
                    - integer
                    - "null"
                  minimum: 1
            - type: "null"
          description: What this env's runner applies now (its hosts key's `policy`); null from a runner that does not report it
        run:
          oneOf:
            - type: object
              required:
                - run_id
                - owner_id
                - lane
                - node
                - step
                - of
                - phase
                - eta_s
              properties:
                run_id:
                  type: string
                  format: uuid
                owner_id:
                  type: string
                  format: uuid
                  description: The run's owner; the web shows their name from GET /auth/admin/users
                lane:
                  $ref: "#/components/schemas/RunLane"
                node:
                  type:
                    - string
                    - "null"
                  description: From its latest progress event; null before the first
                step:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                of:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                phase:
                  type:
                    - string
                    - "null"
                eta_s:
                  type:
                    - number
                    - "null"
                  minimum: 0
            - type: "null"
          description: "Busy: the run released to this env that holds the host (studio's own table); null otherwise"
        idle_since:
          type:
            - string
            - "null"
          format: date-time
          description: The end of the last run released to the host (any env); null while busy or never
        unload_pending:
          type: boolean
          description: An admin unload waits for this env's run to end
        hub_token:
          type: boolean
          description: The runner reports a Hub token file (never the token)
    HostList:
      type: object
      required:
        - hosts
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/Host"
    TakeKind:
      type: string
      enum:
        - image
        - video
        - audio
    TakeSource:
      type: string
      enum:
        - create
        - upload
        - pipeline
        - import
        - export
        - frame
      description: "Create: an output of a Create run; upload: a file the user uploaded; pipeline: an output of a batch run; import: an item of the old helmstudio gallery, brought in by `helm import` (`legacy`); export: a sequence's export (`export`); frame: a video take's first or last frame (`frame_of`)"
    Take:
      type: object
      description: "One item of the caller's gallery: a run output or an upload, pointing at an immutable object (its key is never shown). `title` starts as the first line of the prompt (at most 80 characters; the workflow title when the prompt is empty) for a run output, the file name without its extension for an upload."
      required:
        - id
        - kind
        - source
        - title
        - url
        - thumb_url
        - content_type
        - width
        - height
        - bytes
        - created_at
        - starred
        - session_id
        - run_id
        - made_with
        - parents
      allOf:
        - if:
            properties:
              kind:
                const: video
            required:
              - kind
          then:
            required:
              - video
        - if:
            properties:
              kind:
                const: audio
            required:
              - kind
          then:
            required:
              - audio
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TakeKind"
        source:
          $ref: "#/components/schemas/TakeSource"
        title:
          type: string
          maxLength: 200
        url:
          $ref: "#/components/schemas/SignedUrl"
          description: "The file: an image, or a video's MP4 (GET /files serves Range requests)"
        thumb_url:
          $ref: "#/components/schemas/SignedUrl"
          description: "A small preview; an image: in 1.2 the original itself; a video: its poster (frame 0)"
        content_type:
          type: string
          examples:
            - image/png
            - video/mp4
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: Null for audio
        height:
          type:
            - integer
            - "null"
          minimum: 1
        bytes:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        starred:
          type: boolean
        session_id:
          type:
            - string
            - "null"
          format: uuid
          description: The session it was made in; null for an upload or after the session was deleted
        run_id:
          type:
            - string
            - "null"
          format: uuid
          description: The run that made it; null for an upload or after its session was deleted
        made_with:
          oneOf:
            - $ref: "#/components/schemas/MadeWith"
            - type: "null"
          description: Null for an upload or an import
        legacy:
          $ref: "#/components/schemas/LegacyInfo"
          description: "Source import only (absent otherwise): the old settings, read-only"
        frame_of:
          $ref: "#/components/schemas/TakeFrameOf"
          description: "Source frame only: which video take and frame it is (its `parents` = that take)"
        export:
          $ref: "#/components/schemas/TakeExport"
          description: "Source export only: the sequence and revision it is (`made_with` null; `parents` = its clips' takes)"
        parents:
          type: array
          items:
            type: string
            format: uuid
          description: "Lineage: the takes it was made from, in input order; deleted ones left out; empty for a take made from no take"
        children:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TakeRef"
          description: 'Only in `GET /v1/studio/takes/{take_id}`: the takes made from this one ("Used in"), newest first, at most 50, deleted ones left out'
        batch_id:
          type:
            - string
            - "null"
          format: uuid
          description: "With source pipeline: the batch that made it (its collection); absent or null otherwise"
        video:
          $ref: "#/components/schemas/VideoInfo"
          description: "Kind video only (absent for an image): length, frame rate, audio and the poster"
        audio:
          $ref: "#/components/schemas/AudioInfo"
          description: "Kind audio only: its length"
        source_map:
          $ref: "#/components/schemas/SourceMap"
          description: "A video made from a media take (retake, extend, audio to video; absent otherwise): how its time lines up with that take"
        decisions:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/TakeDecision"
    TakeDecision:
      type: object
      required:
        - decision_id
        - batch_id
        - row
        - node
        - outcome
        - first_failed
      properties:
        decision_id:
          type: string
        batch_id:
          type: string
          format: uuid
        row:
          type: integer
          minimum: 1
          maximum: 500
        node:
          type: string
          description: The judge node id
        outcome:
          type: string
          enum:
            - picked
            - passed
            - failed
          description: "Picked: kept (by the judge, or the user's pick); passed: every must held but it was not kept; failed: a must failed"
        first_failed:
          type:
            - string
            - "null"
          description: Its first false must; null when it passed
    VideoInfo:
      type: object
      description: "`url` / `thumb_url` of the take stay the MP4 and the poster's thumbnail; `poster_url` is the full-size poster."
      required:
        - duration_s
        - fps
        - frames
        - has_audio
        - poster_url
      properties:
        duration_s:
          type: number
          exclusiveMinimum: 0
          description: Frames / fps
          examples:
            - 2.0416666666666665
        fps:
          type: number
          exclusiveMinimum: 0
          examples:
            - 24
        frames:
          type: integer
          minimum: 1
          examples:
            - 49
        has_audio:
          type: boolean
          description: "The MP4 has an audio track (LTX: AAC 48 kHz stereo)"
        poster_url:
          $ref: "#/components/schemas/SignedUrl"
    AudioInfo:
      type: object
      required:
        - duration_s
      properties:
        duration_s:
          type: number
          exclusiveMinimum: 0
          maximum: 600
          description: "An upload: as the client declared it"
        sample_rate:
          type: integer
          minimum: 8000
          maximum: 96000
          description: Absent for an upload (studio does not decode it)
        cues:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/AudioCue"
          description: "A dialogue's take only: one per line, in order; the stage draws them as line markers, the Timeline as ticks on the clip (sequence time = clip `at` + cue − clip `in`)"
    AudioCue:
      type: object
      description: "One dialogue line in its take (defs `cue`): line from 1, [start_s, end_s) in the take's own seconds, the speaker's voice id (a deleted voice's id stays), the text as spoken"
      required:
        - line
        - start_s
        - end_s
        - voice_id
        - text
      additionalProperties: false
      properties:
        line:
          type: integer
          minimum: 1
          maximum: 40
        start_s:
          type: number
          minimum: 0
          maximum: 600
        end_s:
          type: number
          exclusiveMinimum: 0
          maximum: 600
        voice_id:
          type: string
          pattern: ^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$
        text:
          type: string
          maxLength: 600
    SourceMap:
      type: object
      description: ": output time t = source time t + `offset_s`; the generated part is [`new_in_s`, `new_out_s`) of the output. A Timeline fill places the result by it"
      required:
        - take_id
        - offset_s
        - new_in_s
        - new_out_s
      properties:
        take_id:
          type: string
          format: uuid
          description: The media take it was made from (it may be deleted since)
        offset_s:
          type: number
        new_in_s:
          type: number
          minimum: 0
        new_out_s:
          type: number
          exclusiveMinimum: 0
    MadeWith:
      type: object
      description: "A snapshot taken when the take was stored: it survives the run and the session"
      required:
        - workflow_id
        - workflow_title
        - inputs
        - prompt
        - seed
        - model
      properties:
        workflow_id:
          type: string
        workflow_title:
          type: string
          description: As it was when the run was created (a later rename or delete does not change it)
        workflow_version:
          type:
            - integer
            - "null"
          minimum: 1
          description: "A user workflow: the version that made it; absent or null for a template"
        inputs:
          $ref: "#/components/schemas/RunInputs"
          description: Every param of every node (`<node id>.<param>`), resolved, with the seed the runner used in place of null / -1; image values as `{take_id}` (the references, in order), never keys
        prompt:
          type:
            - string
            - "null"
          description: The text of the workflow's `prompt` node as typed (with its `@` mentions; `typed` has it too when it had any); null without one
        seed:
          type:
            - integer
            - "null"
          minimum: 0
          description: The seed it was made with; null without one
        elements:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/MadeWithElement"
          description: The elements its prompt mentioned, first mention first, as they were when the run was made; absent or empty = none
        loras:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/MadeWithLora"
          description: Every LoRA of every lora-stack node that ran, node id order then row order, as resolved when the run was made; absent or empty = none
        looks:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/MadeWithLook"
          description: The looks it was made with, in request order (repeats once), as they were when the run was made; absent or empty = none
        voices:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/MadeWithVoice"
          description: The voices its voice params named, node id then param order, each once, as they were when the run was made; absent or empty = none
        typed:
          $ref: "#/components/schemas/RunInputs"
          description: "For each param the mention and look expansion changed (prompt params, the reference rows, the look stack's rows, a pinned canvas) or the runner resolved, its value before it: the prompt as typed, the rows without the element and look images, the stack without the look LoRAs, `\"auto\"`. `inputs` holds the resolved values (what ran: the predicted frames). Absent or empty = nothing was expanded."
        pipeline:
          description: "A take made by a step of a pipeline batch (source pipeline): which pipeline, node and loop attempt; absent or null otherwise"
          oneOf:
            - $ref: "#/components/schemas/MadeWithPipeline"
            - type: "null"
        host:
          type:
            - string
            - "null"
          description: The host that ran it (the run's host at the attempt that stored it)
        model:
          description: From the workflow's `<family>/model` node; null without one (echo)
          oneOf:
            - type: object
              required:
                - id
                - variant
                - precision
              properties:
                id:
                  type:
                    - string
                    - "null"
                  description: The model id of the registry models key for the family; null when unknown
                variant:
                  type:
                    - string
                    - "null"
                  examples:
                    - base
                precision:
                  type:
                    - string
                    - "null"
                  examples:
                    - int8
            - type: "null"
    MadeWithPipeline:
      type: object
      required:
        - id
        - title
        - version
        - node
        - attempt
        - row
      properties:
        id:
          type: string
          format: uuid
          description: The pipeline (it may be deleted since); Batch.timeline_id)
        title:
          type: string
          description: As in the batch's snapshot
        version:
          type: integer
          minimum: 1
          description: "A Re-render: the revision it was made from"
        node:
          type: string
          description: "The step node id that made it (a Re-render: clip_<clip id>)"
        attempt:
          type: integer
          minimum: 1
          description: The step's visit in that row (1 + times a loop brought the row back to it)
        row:
          type: integer
          minimum: 1
          maximum: 500
          description: The batch row
    TakePage:
      type: object
      required:
        - takes
        - next_cursor
      properties:
        takes:
          type: array
          items:
            $ref: "#/components/schemas/Take"
        next_cursor:
