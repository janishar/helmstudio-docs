  /v1/studio/assistant/threads/{thread_id}/messages:
    post:
      tags:
        - Assistant
      operationId: studioPostAssistantMessage
      summary: A message, the actions' results, a card's answer, or Continue here
      description: "The turn's steps arrive on `…/events`); a chat parked on actions of a tab that went away resumes first, each of them `did_not_run` (`the tab was closed`). `results` and `answer` resume the parked turn; they are accepted only from the tab that runs it (`client_id`, else 409 `this chat is working in another tab`) and only for the ids it waits on (409 `nothing waits on <id>`). `continue` moves the chat to this tab (Continue here): its pending actions are sent to it, the other tab turns read-only; no command is written. 409 `the assistant is off`; 429 above the admin's messages a minute (`at most <n> messages a minute`, steers count); 422 for a blank text or a screen summary over 16 000 characters. A daily cap is not a 4xx: the message is kept and the step's `error` says when it starts again. turn is `working`, or `waiting` on that tab's actions, joins the running answer (`steer` true): it is stored the turn reads it at its next step (`read`), or, when the turn ends first, it starts the next turn (`next`, several in order as one). `stop` (same tab) ends the running turn at its next step: the rest of its calls do not run; idle, it does nothing (202)."
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantPost"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/assistant/threads/{thread_id}/events:
    get:
      tags:
        - Assistant
      operationId: studioAssistantEvents
      summary: Chat events after a cursor — JSON polling, or server-sent events with `Accept text/event-stream`
      description: "Like the batch events, numbered by a per-chat `seq`: JSON gives the events with `seq > since` (at most 500) and `last_seq`; SSE replays `seq > since` (or `Last-Event-ID`, which wins), then streams, `id:` = seq, `event:` = `entry` (a stored entry: your message, the assistant's words, a line, a card) or `thread` (the chat's state and the tab that runs it), `data:` = the `AssistantEvent` JSON, `: keep-alive` every 15 s. A step that asks for actions sends them in the `thread` event's `pending`; only the drawer whose `client_id` matches runs them."
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Cursor — the last seq the client has
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
          description: "SSE resume: the last `id:` received (an integer)"
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantEventPage"
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
