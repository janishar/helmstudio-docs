    post:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminCancelModelJob
      summary: Cancel a queued job, or a running download
      description: "Admin only (403). Queued: `cancelled` at once, never sent. `cancels` key `<job_id>`; the runner stops within 2 s, keeps the partial files (the variant shows `partial`; a new download resumes them) and reports `cancelled`; if the env's hosts key is gone or older than 60 s, studio 409 `a running delete cannot be cancelled`, `job already ended`. Answers the job as it is now."
