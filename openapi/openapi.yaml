      operationId: studioUseTake
      summary: "\"Use in…\": inputs that put this take into a workflow's image or media input, to pre-fill Create"
      description: "An image take: `inputs` with exactly one key: `param` set to this take: `{take_id}` for an `image` param, a one-item list `[{<field>: {take_id}}]` (the take as reference 1) for a rows param. workflow's only `media` param that accepts it (or `param`) set to `{take_id}` (with `trim`: `in` 0, `out` its inputs: offers; a trim part is capped at `max_s`: `out` = min(duration, `max_s`); an Extend whose clip would pass 321 frames gets the largest `seconds` that fits). The client merges it over the form; nothing is created. 404 for a take that is unknown, another user's, deleted or a pending upload. 422 when the take does not fit the input (the run texts of Image inputs and Media inputs: `take <id> is not an image`, `take <id> has no size`, `take <id> is not a video`, `take <id> has no sound`, `take <id> is 450 × 256; this input needs sides on a 32 px grid`, `take <id> has 390 frames; this input takes at most 321`; an Extend with no 8-frame step left under 321 frames: `take <id> has <n> frames; extending it would pass 321`), the workflow is unknown (`unknown workflow <id>`), it has no such param (`workflow <id> takes no image input`; a video or audio take: `workflow <id> takes no <kind> input`), several and no `param` (`workflow <id> has several image inputs; name one in param`), or `param` is not one of them. The client lists the workflows to offer with `GET /v1/studio/takes/{take_id}/uses`."
      parameters:
        - $ref: "#/components/parameters/TakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeUse"
      responses:
