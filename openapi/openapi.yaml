        created_at:
          type: string
          format: date-time
    MemoryCreate:
      type: object
      required:
        - pipeline_id
        - text
      additionalProperties: false
      properties:
        pipeline_id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 2000
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
    RowExecution:
      type: object
      required:
        - batch_id
        - row
        - attempt
        - attempts
        - status
        - current
        - pipeline
        - steps
        - nodes
        - edges
        - loops
        - retried_from
      properties:
        batch_id:
          type: string
          format: uuid
        row:
          type: integer
          minimum: 1
          maximum: 500
        attempt:
          type: integer
          minimum: 1
          description: The attempt shown
        attempts:
          type: integer
          minimum: 1
          description: The row's current attempt
        status:
          $ref: "#/components/schemas/BatchRowStatus"
        current:
          type:
            - string
            - "null"
          description: The node the row is at now (highlighted); null when ended
        pipeline:
          $ref: "#/components/schemas/PipelineDoc"
          description: The batch's snapshot of the pipeline, to draw the graph
        steps:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/ExecutionStep"
          description: In order; a retried-from-step attempt starts with the earlier attempt's steps it reused
        nodes:
          type: object
          additionalProperties:
            type: object
            required:
              - visits
              - status
            properties:
              visits:
                type: integer
                minimum: 1
              status:
                $ref: "#/components/schemas/CellStatus"
          description: "Every node the row passed: visits and its last attempt's status"
        edges:
          type: array
          items:
            type: object
            required:
              - from
              - to
              - via
              - count
            properties:
              from:
                type: string
              to:
                type: string
              via:
                type: string
                enum:
                  - next
                  - pass
                  - fail
                  - then
              count:
                type: integer
                minimum: 1
          description: The edges taken, with how many times
        loops:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Gate id → times its loop went round
        retried_from:
          oneOf:
            - type: object
              required:
                - attempt
                - step
              properties:
                attempt:
                  type: integer
                  minimum: 1
                step:
                  type: integer
                  minimum: 1
            - type: "null"
          description: This attempt re-ran the earlier attempt from that step
    RowState:
      type: object
      required:
        - row
        - attempt
        - step
        - node
        - state
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 500
        attempt:
          type: integer
          minimum: 1
        step:
          type: integer
          minimum: 1
        node:
          type: string
        state:
          type: object
          description: The thread's state after the step, read-only plain JSON (row inputs, run and take ids, picks, loop counters; never media)
    ProviderKind:
      type: string
      enum:
        - server
        - remote
        - search
      description: "Server: a local server you run (loopback or private address, or the Docker host: what host.docker.internal resolves to); remote: outside the machine (https; only when the deployment has remote models on); only with remote models on; never a model source)"
    Provider:
      type: object
      required:
        - name
        - kind
        - api
        - base_url
        - models
        - default_model
        - enabled
        - timeout_s
        - created_at
        - updated_at
      description: One model provider as the admin sees it.
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
        kind:
          $ref: "#/components/schemas/ProviderKind"
        api:
          type: string
          enum:
            - openai
            - brave
          description: "Openai: OpenAI-compatible /v1/chat/completions (ChatOpenAI(base_url=…))"
        title:
          type: string
          maxLength: 60
          description: What users see (`Ollama on the Mac`); absent = name
        base_url:
          type: string
          maxLength: 300
          examples:
            - http://host.docker.internal:11434/v1
            - https://api.example.com/v1
        models:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
          description: The models pipelines may name
        default_model:
          type: string
          description: One of models (`server:<name>` without a model)
        enabled:
          type: boolean
        timeout_s:
          type: integer
          minimum: 5
          maximum: 600
        host:
          type: string
          description: "Server: the GPU host whose memory it shares"
        memory_gb:
          type: number
          minimum: 0.5
          maximum: 1024
          description: "Server: declared; the host reserves it while enabled"
        key_secret:
          type: string
          description: "Remote: the secret file's name"
        max_in_flight:
          type: integer
          minimum: 1
          maximum: 8
          description: "Remote: calls in flight at once (default 2)"
        compat:
          $ref: "#/components/schemas/ProviderCompat"
        preset:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
          description: The preset it was filled from
        thinking:
          $ref: "#/components/schemas/ProviderThinking"
        thinking_levels:
          type: object
          maxProperties: 16
          additionalProperties:
            $ref: "#/components/schemas/ThinkingInfo"
          description: "(read only): what each saved model offers, for the models its preset's rules cover (absent: no control). The form and the AI agents tab need no copy of the rules"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderPut:
      type: object
      required:
        - kind
        - base_url
        - models
      additionalProperties: false
      description: "Create or replace a provider. server: http(s) base_url whose host is a loopback or private address, or what host.docker.internal resolves to there, or a name that resolves only to such (checked again at every call); `host` and `memory_gb` required. remote: https base_url, `key_secret` required, refused (409) unless the deployment has remote models on."
      properties:
        kind:
          $ref: "#/components/schemas/ProviderKind"
        api:
          type: string
          enum:
            - openai
            - brave
          description: Absent = openai; kind search needs brave, the others openai (422)
        title:
          type: string
          minLength: 1
          maxLength: 60
        base_url:
          type: string
          minLength: 8
          maxLength: 300
          pattern: ^https?://[^\s/?#@]+(/[^\s?#]*)?$
        models:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
        default_model:
          type: string
          description: Absent = the first of models
        enabled:
          type: boolean
          default: true
        timeout_s:
          type: integer
          minimum: 5
          maximum: 600
          default: 120
        host:
          type: string
          pattern: ^[a-z0-9]{1,32}$
        memory_gb:
          type: number
          minimum: 0.5
          maximum: 1024
        key_secret:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          examples:
            - provider-openai
          description: "Remote and search: required"
        max_in_flight:
          type: integer
          minimum: 1
          maximum: 8
          default: 2
        compat:
          $ref: "#/components/schemas/ProviderCompat"
        preset:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
          description: The preset the form was filled from
        thinking:
          $ref: "#/components/schemas/ProviderThinking"
    ProviderThinking:
      type: object
      maxProperties: 16
      propertyNames:
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
      additionalProperties:
        $ref: "#/components/schemas/ThinkingLevel"
      description: ": a thinking level per model. Each key is one of `models`, each level one its rule allows (else 422 naming the model; a model no rule covers is 422 too). Absent or {} = nothing sent: the provider's own default. Studio resolves it into the batch snapshot (messages defs providerThinking)"
    ThinkingLevel:
      type: string
      enum:
        - off
        - on
        - low
        - medium
        - high
      description: Off + on, or some of off, low, medium, high (our high is the provider's high, never max)
    ThinkingInfo:
      type: object
      required:
        - levels
      additionalProperties: false
      description: "What one model offers: its levels (empty when it always thinks), `always` (thinks and cannot be set), `default` (what the provider uses when nothing is sent)"
      properties:
        levels:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ThinkingLevel"
        always:
          type: boolean
        default:
          $ref: "#/components/schemas/ThinkingLevel"
    ThinkingRule:
      type: object
      required:
        - match
      additionalProperties: false
      description: "One rule of a preset: `match` a regular expression on the model id; `levels` each level's body fragment (messages defs thinkingFragment); or `always`"
      properties:
        match:
          type: string
          minLength: 1
          maxLength: 120
        levels:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              reasoning_effort:
                type: string
              thinking:
                type: object
              reasoning:
                type: object
              reasoning_format:
                type: string
                enum:
                  - parsed
                  - hidden
        default:
          $ref: "#/components/schemas/ThinkingLevel"
        always:
          type: boolean
          const: true
    ProviderList:
      type: object
      required:
        - remote_enabled
        - providers
      properties:
        remote_enabled:
          type: boolean
          description: The deployment's remote switch (REMOTE_MODELS, off by default)
        providers:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/Provider"
    ProviderTest:
      type: object
      required:
        - ok
        - models
        - error
        - failure
        - seconds
      properties:
        ok:
          type: boolean
        models:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 128
          description: What its /models listed
        answer:
          type:
            - string
            - "null"
          description: "With ?model=: its answer to a tiny prompt"
        error:
          type:
            - string
            - "null"
        failure:
          type:
            - string
            - "null"
          enum:
            - network
            - answer
            - refused
            - off
            - null
          description: "Network: unreachable, TLS, timeout, 5xx, 429; answer: a 4xx (401: the key) or not OpenAI-shaped; refused: the host rule; off: remote models are off"
        seconds:
          type: number
          minimum: 0
        thinking:
          type: object
          maxProperties: 1000
          additionalProperties:
            $ref: "#/components/schemas/ThinkingInfo"
          description: "What each listed model offers (only the models a rule covers): from the preset's rules, or for a preset whose thinking is \"models\" (OpenRouter) from the provider's /models answer (its reasoning supported_efforts and mandatory)"
    ProviderCompat:
      type: object
      additionalProperties: false
      description: "What a provider's OpenAI layer refuses of what pipelines sends (messages defs providerCompat; from a preset, Anthropic's). temperature false: none sent; strict_schema true: json_schema with strict true, never retried as json_object; Absent = the usual calls"
      properties:
        temperature:
          type: boolean
        strict_schema:
          type: boolean
        headers:
          type: object
          minProperties: 1
          maxProperties: 4
          description: "Fixed extra headers sent on every call to the provider (chat, Test, Fetch, the key check); only allow-listed safe names (never authorization, x-api-key, cookie, host): anthropic-version (Anthropic's preset: 2023-06-01)"
          propertyNames:
            enum:
              - anthropic-version
          additionalProperties:
            type: string
            pattern: ^[\x21-\x7e][\x20-\x7e]{0,99}$
    ProviderPreset:
      type: object
      required:
        - id
        - title
        - kind
        - base_url
        - models
        - docs
        - note
      additionalProperties: false
      description: A remote preset names `key_secret` (its id), a server preset none and no models (Fetch fills them)
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
          description: The provider name it fills
        title:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          type: string
          enum:
            - server
            - remote
        base_url:
          type: string
          minLength: 8
          maxLength: 300
          pattern: ^https?://[^\s/?#@]+(/[^\s?#]*)?$
        models:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
        key_secret:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
        compat:
          $ref: "#/components/schemas/ProviderCompat"
        thinking:
          description: "The thinking rules (the first whose match fits a model id gives its levels), or \"models\": the levels come from the provider's /models (OpenRouter)"
          oneOf:
            - type: string
              const: models
            - type: array
              minItems: 1
              maxItems: 8
              items:
                $ref: "#/components/schemas/ThinkingRule"
        docs:
          type: string
          pattern: ^https://
          maxLength: 300
        note:
          type: string
          minLength: 1
          maxLength: 120
    ProviderPresetList:
      type: object
      required:
        - remote_enabled
        - presets
      additionalProperties: false
      properties:
        remote_enabled:
          type: boolean
          description: The deployment's remote switch (remote presets are greyed while off)
        presets:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ProviderPreset"
    ProviderFetch:
      type: object
      additionalProperties: false
      description: "A preset's Fetch. Only the key file's name: the URL always comes from the preset (a `base_url` here is 422)"
      properties:
        key_secret:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
          description: Absent = the preset's
    ProviderKey:
      type: object
      required:
        - key_secret
        - path
        - found
        - writable
      additionalProperties: false
      description: A key file's status (never the key)
      properties:
        key_secret:
          type: string
        path:
          type: string
          examples:
            - deploy/secrets/providers/deepseek
          description: Where the admin puts it, as the deployment sees it
        found:
          type: boolean
          description: A regular file that is not empty
        writable:
          type: boolean
          description: "The deployment lets the admin save keys here (pipelines' first key folder is a writable directory); false: keys are set in files only"
    ProviderKeySave:
      type: object
      required:
        - key
      additionalProperties: false
      description: ": a key to check and save. Exactly one source: `preset` or `provider` (never a URL)"
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^\s*[!-~]+\s*$
          writeOnly: true
          description: The key; trimmed, then 1-1024 printable ASCII characters only (0x21-0x7E, no spaces; anything else is 422 with a fixed text, never the key or the character). Never returned, logged or stored outside the key file
        preset:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
          description: Check with this preset's URL
        provider:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
          description: Check with this saved provider's URL
        force:
          type: boolean
          default: false
          description: "Save anyway: write without a check (check skipped)"
      oneOf:
        - required:
            - preset
          not:
            required:
              - provider
        - required:
            - provider
          not:
            required:
              - preset
    ProviderKeySaved:
      type: object
      required:
        - key_secret
        - path
        - found
        - saved
        - check
      additionalProperties: false
      description: The check's verdict and the key file's status after it (never the key)
      properties:
        key_secret:
          type: string
        path:
          type: string
          examples:
            - deploy/secrets/providers/deepseek
        found:
          type: boolean
        saved:
          type: boolean
          description: "Written: true for check ok and skipped"
        check:
          enum:
            - ok
            - refused
            - unreachable
            - skipped
          description: "Ok: /models answered; refused: 401 or 403; unreachable: anything else (network, timeout, 429, 5xx, another 4xx, the host rule, remote models off); skipped: force"
        detail:
          type: string
          maxLength: 300
          description: "Refused or unreachable: our own short text, never the provider's"
    SessionNames:
      type: object
      required:
        - mode
        - provider
        - model
        - local_available
        - remote_enabled
        - updated_at
      description: How an untitled session is named. Default off
      properties:
        mode:
          type: string
          enum:
            - off
            - local
            - remote
          description: "Off; local: the llm pack (Qwen3.8 27B) on the local GPU queue, nothing leaves the machine; remote: a provider of Admin › Model providers, kind remote (sends the prompt out) or server (on this network)"
        provider:
          type:
            - string
            - "null"
          description: "Remote: the provider's name; null otherwise"
        model:
          type:
            - string
            - "null"
          description: "Remote: one of its models; null otherwise"
        local_available:
          type: boolean
          description: 'A live host can run llm-ask now (else Local is greyed: "Qwen3.8 27B not downloaded")'
        remote_enabled:
          type: boolean
          description: The deployment's remote switch
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Null until first set
    SessionNamesPut:
      type: object
      required:
        - mode
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - off
            - local
            - remote
        provider:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}$
          description: Remote only, required there
        model:
          type: string
          maxLength: 128
          description: Remote only; absent = the provider's default_model
    ModelSourceList:
      type: object
      required:
        - remote_enabled
        - sources
      description: "What a user may name as a model (the editor's \"Runs on\"): enabled providers, redacted to names and models"
      properties:
        remote_enabled:
          type: boolean
        sources:
          type: array
          items:
            type: object
            required:
              - name
              - kind
              - title
              - models
              - default_model
            additionalProperties: false
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                  - server
                  - remote
                description: Never search
              title:
                type: string
              models:
                type: array
                items:
                  type: string
              default_model:
                type: string
              thinking:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/ThinkingLevel"
                description: "The level set per model (absent: none set), shown where a model is picked"
    AssistantCallId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:[1-9][0-9]{0,5}:([0-9]|[1-9][0-9])$
      description: <thread_id>:<turn>:<n>
    AssistantClientId:
      type: string
      pattern: ^[A-Za-z0-9_-]{8,64}$
      description: One drawer (a browser tab)
    AssistantScreen:
      type: object
      required:
        - route
        - ids
        - roles
        - as_of
        - hidden
        - actions
        - fields
      additionalProperties: false
      properties:
        route:
          type: string
          pattern: ^/[^\s]{0,199}$
        ids:
          type: object
          maxProperties: 16
          propertyNames:
            pattern: ^[a-z][a-z_]{0,31}$
          additionalProperties:
            type: string
            maxLength: 80
        roles:
          type: array
          maxItems: 8
          items:
            type: string
            pattern: ^[a-z][a-z0-9_-]{0,31}$
        as_of:
          type: string
          format: date-time
        hidden:
          type: boolean
        actions:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z][A-Za-z0-9]{0,47}$
          description: The screen actions registered now
        fields:
          type: object
    AssistantAction:
      type: object
      required:
        - id
        - name
        - args
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/AssistantCallId"
        name:
          type: string
          pattern: ^[a-z][A-Za-z0-9]{0,47}$
        args:
          type: object
    AssistantLineText:
      type: object
      required:
        - text
        - undo
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
        undo:
          type: boolean
    AssistantActionResult:
      type: object
      required:
        - id
        - status
        - line
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/AssistantCallId"
        status:
          type: string
          enum:
            - done
            - failed
            - did_not_run
            - cancelled
            - still_running
        line:
          $ref: "#/components/schemas/AssistantLineText"
        result:
          type: object
        error:
          type: string
          maxLength: 500
    AssistantLine:
      type: object
      required:
        - id
        - status
        - text
        - undo
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/AssistantCallId"
        status:
          type: string
          enum:
            - running
            - waiting
            - done
            - undone
            - did_not_run
            - failed
            - cancelled
        text:
          type: string
          minLength: 1
          maxLength: 300
        undo:
          type: boolean
        memory_id:
          type: string
          format: uuid
        sources:
          type: array
          maxItems: 5
          items:
            type: object
            required:
              - title
              - url
            additionalProperties: false
            properties:
              title:
                type: string
                maxLength: 200
              url:
                type: string
                maxLength: 500
    AssistantCard:
      type: object
      required:
        - id
        - kind
        - title
        - rows
        - tags
        - state
      additionalProperties: false
      description: Yes or Not now is a message of kind answer
      properties:
        id:
          $ref: "#/components/schemas/AssistantCallId"
        kind:
          type: string
          enum:
            - look
            - web_search
            - delete
        title:
          type: string
          minLength: 1
          maxLength: 120
        rows:
          type: array
          maxItems: 8
          items:
            type: object
            required:
              - label
              - value
            additionalProperties: false
            properties:
              label:
                type: string
                maxLength: 40
              value:
                type: string
                maxLength: 300
        note:
          type: string
          maxLength: 300
        tags:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 40
        take_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
        state:
          type: string
          enum:
            - waiting
            - yes
            - not_now
            - cancelled
    AssistantCaps:
      type: object
      required:
        - model_calls
        - tool_calls
        - memory_writes
      additionalProperties: false
      properties:
        model_calls:
          type: integer
          minimum: 0
          maximum: 40
        tool_calls:
          type: integer
          minimum: 0
          maximum: 100
        memory_writes:
          type: integer
          minimum: 0
          maximum: 8
    AssistantError:
      type: object
      required:
        - code
        - text
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - cap_message
            - cap_day
            - cap_tokens
            - cap_look_at
            - answer
            - provider
            - off
            - internal
        text:
          type: string
          minLength: 1
          maxLength: 500
        resets_at:
          type: string
          format: date-time
        limit:
          type: integer
          minimum: 0
          description: The drawer unlocks once the current cap is above it
    AssistantLimits:
      type: object
      required:
        - model_calls_per_day
        - tokens_per_day
        - look_at_per_hour
        - messages_per_minute
      additionalProperties: false
      properties:
        model_calls_per_day:
          type: integer
          minimum: 1
          maximum: 100000
          default: 2000
        tokens_per_day:
          type: integer
          minimum: 1000
          maximum: 100000000
          default: 20000000
        look_at_per_hour:
          type: integer
          minimum: 0
          maximum: 1000
          default: 200
        messages_per_minute:
          type: integer
          minimum: 1
          maximum: 60
          default: 30
    AssistantStatus:
      type: object
      required:
        - enabled
        - provider
        - web_search
        - limits
        - thinks
      additionalProperties: false
      description: "What every user may know: on or off (the dock item is hidden when off), where the model runs, web search, the caps, whether the model thinks"
      properties:
        enabled:
          type: boolean
        provider:
          oneOf:
            - type: object
              required:
                - title
                - remote
              additionalProperties: false
              properties:
                title:
                  type: string
                  description: "`DeepSeek`"
                remote:
                  type: boolean
                  description: "True: your messages leave this machine (the notice shows first)"
            - type: "null"
        web_search:
          type:
            - string
            - "null"
          description: The search provider's title when web search is on
        limits:
          $ref: "#/components/schemas/AssistantLimits"
        thinks:
          type: boolean
          description: The drawer shows `Thinking… N s` while a model call runs. False when off or no provider
    AssistantPending:
      type: object
      required:
        - turn
        - actions
        - cards
      additionalProperties: false
      description: "What the parked turn waits on: actions for the tab `client_id` to run, cards (ids of card entries) to answer"
      properties:
        turn:
          type: integer
          minimum: 1
        actions:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/AssistantAction"
        cards:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AssistantCallId"
    AssistantThread:
      type: object
      required:
        - id
        - title
        - state
        - client_id
        - pending
        - caps
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
          description: From the first message; `New chat` before
        state:
          type: string
          enum:
            - idle
            - working
            - waiting
          description: "Working: the agent is thinking; waiting: parked on actions, cards or a run"
        client_id:
          oneOf:
            - $ref: "#/components/schemas/AssistantClientId"
            - type: "null"
          description: The tab that runs its actions; other tabs show it read-only with Continue here
        pending:
          oneOf:
            - $ref: "#/components/schemas/AssistantPending"
            - type: "null"
        caps:
          $ref: "#/components/schemas/AssistantCaps"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: The chat's last message, turn end or Continue here; a summary landing does not move it. The list is newest first by it
    AssistantThreadList:
      type: object
      required:
        - status
        - threads
      properties:
        status:
          $ref: "#/components/schemas/AssistantStatus"
        threads:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AssistantThread"
    AssistantThreadCreate:
      type: object
      required:
        - client_id
      additionalProperties: false
      properties:
        client_id:
          $ref: "#/components/schemas/AssistantClientId"
    AssistantEntry:
      type: object
      required:
        - id
        - turn
        - kind
        - at
      description: "One stored entry of a chat: your message, the assistant's words, an action line, a card, a notice (the remote provider's, an error)"
      properties:
        id:
          type: string
          format: uuid
        turn:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - user
            - assistant
            - line
            - card
            - notice
        at:
          type: string
          format: date-time
        text:
          type: string
          maxLength: 4000
          description: "User, assistant, notice: shown as text, never HTML"
        line:
          $ref: "#/components/schemas/AssistantLine"
        card:
          $ref: "#/components/schemas/AssistantCard"
        error:
          $ref: "#/components/schemas/AssistantError"
        steer:
          type: string
          enum:
            - waiting
            - read
            - next
          description: Absent on other entries
      allOf:
        - if:
            properties:
              kind:
                enum:
                  - user
                  - assistant
          then:
            required:
              - text
        - if:
            properties:
              kind:
                const: line
          then:
            required:
              - line
        - if:
            properties:
              kind:
                const: card
          then:
            required:
              - card
    AssistantThreadDetail:
      allOf:
        - $ref: "#/components/schemas/AssistantThread"
        - type: object
          required:
            - entries
          properties:
            entries:
              type: array
              maxItems: 200
              items:
                $ref: "#/components/schemas/AssistantEntry"
              description: The newest 200, oldest first
    AssistantPost:
      oneOf:
        - type: object
          required:
            - kind
            - client_id
            - text
            - screen
          additionalProperties: false
          properties:
            kind:
              const: message
            client_id:
              $ref: "#/components/schemas/AssistantClientId"
            text:
              type: string
              minLength: 1
              maxLength: 4000
              description: Trimmed; blank = 422
            screen:
              $ref: "#/components/schemas/AssistantScreen"
        - type: object
          required:
            - kind
            - client_id
            - turn
            - results
          additionalProperties: false
          properties:
            kind:
              const: results
            client_id:
              $ref: "#/components/schemas/AssistantClientId"
            turn:
              type: integer
              minimum: 1
            results:
              type: array
              minItems: 1
              maxItems: 30
              items:
                $ref: "#/components/schemas/AssistantActionResult"
            screen:
              $ref: "#/components/schemas/AssistantScreen"
              description: The screen as the actions left it (after a navigate, the new screen)
        - type: object
          required:
            - kind
            - client_id
            - card_id
            - answer
          additionalProperties: false
          properties:
            kind:
              const: answer
            client_id:
              $ref: "#/components/schemas/AssistantClientId"
            card_id:
              $ref: "#/components/schemas/AssistantCallId"
            answer:
              type: string
              enum:
                - yes
                - not_now
        - type: object
          required:
            - kind
            - client_id
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
                - continue
                - stop
              description: "Continue: Continue here; stop: end the running turn at its next step"
            client_id:
              $ref: "#/components/schemas/AssistantClientId"
    AssistantAccepted:
      type: object
      required:
        - thread
        - entry
      properties:
        thread:
          $ref: "#/components/schemas/AssistantThread"
        entry:
          oneOf:
            - $ref: "#/components/schemas/AssistantEntry"
            - type: "null"
          description: "Message: your stored message; otherwise null"
        steer:
          type: boolean
          description: Absent or false otherwise
    AssistantEvent:
      type: object
      required:
        - seq
        - type
      properties:
        seq:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
            - entry
            - thread
        entry:
          $ref: "#/components/schemas/AssistantEntry"
          description: "Type entry: a new or changed entry (same id replaces: a line going from running to done, a card answered)"
        thread:
          $ref: "#/components/schemas/AssistantThread"
          description: "Type thread: the chat's state, tab and pending"
      allOf:
        - if:
            properties:
              type:
                const: entry
          then:
            required:
              - entry
        - if:
            properties:
              type:
                const: thread
          then:
            required:
              - thread
    AssistantEventPage:
      type: object
      required:
        - events
        - last_seq
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AssistantEvent"
        last_seq:
          type: integer
          minimum: 0
          description: Next `since` (unchanged when the page is empty)
    AssistantMemoryKind:
      type: string
      enum:
        - preference
        - project
        - worked
        - summary
      description: The Memory list's Likes, Projects, Worked, Chats
    AssistantMemoryItem:
      type: object
      required:
        - id
        - kind
        - text
        - thread
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AssistantMemoryKind"
        text:
          type: string
          minLength: 1
          maxLength: 600
        thread:
          description: The chat that saved it; null once it is deleted
          oneOf:
            - type: object
              required:
                - id
                - title
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                  maxLength: 120
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AssistantMemoryList:
      type: object
      required:
        - items
        - counts
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AssistantMemoryItem"
        counts:
          type: object
          required:
            - preference
            - project
            - worked
            - summary
          properties:
            preference:
              type: integer
              minimum: 0
            project:
              type: integer
              minimum: 0
            worked:
              type: integer
              minimum: 0
            summary:
              type: integer
              minimum: 0
    AssistantMemoryPatch:
      type: object
      required:
        - text
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Trimmed; blank = 422
    AssistantSettings:
      type: object
      required:
        - enabled
        - provider
        - model
        - web_search
        - search_provider
        - limits
        - remote_enabled
        - updated_at
      description: The admin's assistant settings (Admin › AI agents)
      properties:
        enabled:
          type: boolean
        provider:
          type:
            - string
            - "null"
          description: A server or remote provider's name
        model:
          type:
            - string
            - "null"
          description: One of its models; null = its default_model
        web_search:
          type: boolean
          description: Web search's own egress switch (off by default)
        search_provider:
          type:
            - string
            - "null"
          description: A provider of kind search
        limits:
          $ref: "#/components/schemas/AssistantLimits"
        remote_enabled:
          type: boolean
          description: "The deployment's switch (REMOTE_MODELS): a remote provider and web search need it"
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Null before the first PUT
    AssistantSettingsPut:
      type: object
      required:
        - enabled
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        provider:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9-]{0,31}$
        model:
          type:
            - string
            - "null"
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$
        web_search:
          type: boolean
          default: false
        search_provider:
          type:
            - string
            - "null"
          pattern: ^[a-z][a-z0-9-]{0,31}$
        limits:
          $ref: "#/components/schemas/AssistantLimits"
          description: Absent = unchanged
    CustomNode:
      type: object
      required:
        - name
        - title
        - help
        - input
        - output
        - network
        - version
      description: A custom node a pack registered (registry key pipelines.engine.custom)
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,31}/[a-z][a-z0-9-]{0,31}$
        title:
          type: string
        help:
          type: string
        input:
          type: object
          description: JSON schema of its input (an object; its properties are the fields)
        output:
          type: object
          description: JSON schema of its output
        network:
          type: boolean
          description: "Calls the network: needs the pipeline's remote switch"
        version:
          type: string
    CustomNodeList:
      type: object
      required:
        - nodes
      properties:
        nodes:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/CustomNode"
    Precision:
      type: string
      enum:
        - bf16
        - fp16
        - int8
        - int4
        - fp8
        - fp32
    ModelList:
      type: object
      required:
        - hosts
        - licences
        - models
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/ModelHost"
        licences:
          type: array
          items:
            $ref: "#/components/schemas/Licence"
          description: Every licence a listed variant names, each once (the text shown before a download)
        models:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    ModelHost:
      type: object
      required:
        - host
        - live
        - envs
        - models_root
        - free_bytes
        - total_bytes
      properties:
        host:
          type: string
          pattern: ^[a-z0-9]{1,32}$
        live:
          type: boolean
          description: Some hosts key of it is fresh (30 s); an offline host shows what it last published
        envs:
          type: array
          items:
            type: string
          description: Its envs with a present hosts key, by name
        models_root:
          type:
            - string
            - "null"
          description: The models root, from the freshest key's `models_disk`; null when no key reports it
        free_bytes:
          type:
            - integer
            - "null"
          minimum: 0
          description: Free space on the models root's volume, from the same key
        total_bytes:
          type:
            - integer
            - "null"
          minimum: 0
        hub_token:
          type: boolean
          description: "Admins only: a Hub token file is present on the host (needed for a gated source); never the token"
    Licence:
      type: object
      required:
        - id
        - title
        - url
        - text
      properties:
        id:
          type: string
          examples:
            - apache-2.0
        title:
          type: string
        url:
          type:
            - string
            - "null"
        text:
          type: string
          description: The full text; its UTF-8 SHA-256 is what a download's job records as accepted
    Model:
      type: object
      required:
        - id
        - family
        - title
        - media
        - runtimes
        - variants
        - addons
      properties:
        id:
          type: string
          examples:
            - qwen-image-2.1
        family:
          type: string
          examples:
            - qwen-image
        title:
          type: string
          examples:
            - Qwen Image 2.1
        media:
          type: array
          items:
            type: string
            enum:
              - image
              - video
              - audio
        runtimes:
          type: array
          items:
            type: object
            required:
              - runtime
              - env
            properties:
              runtime:
                type: string
              env:
                type: string
              devices:
                type: array
                items:
                  type: string
                  enum:
                    - cuda
                    - mps
                    - cpu
                description: The devices it runs on (model.yaml `runtimes.<r>.devices`); absent = every device of that runtime
          description: Every runtime the pack has; only mlx or native = runs on Apple silicon only
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ModelVariant"
        addons:
          type: array
          items:
            $ref: "#/components/schemas/ModelAddon"
          description: Its optional add-ons, the freshest key's order; empty for most models
    ModelAddon:
      type: object
      required:
        - component
        - title
        - dir
        - licence
        - gated
        - download_bytes
        - hosts
      description: A part a few controls need, downloaded and deleted on its own (the Models screen's "Optional add-ons"); every variant works without it. Descriptive fields from the freshest live key that publishes it, as a variant's
      properties:
        component:
          type: string
          examples:
            - enhancer
          description: What a NodeSchema's `addons` names; a model job's `addon`
        title:
          type: string
          examples:
            - Enhancer
        short:
          type: string
          examples:
            - Enhancer
          description: The name in the greyed controls' and Run on's `<short> not downloaded` (registry add-on `short`; Qwen Image's Text enhancer and Edit enhancer are both `Enhancer`). Absent = `title`
        tag:
          type: string
          examples:
            - PE-T2I
          description: The Models screen's mono line beside the title (registry add-on `tag`). Absent = the component id
        refs:
          type: boolean
          description: "The task whose runs need it: true = only a run with references (an edit), false = only one without (text to image). Absent = both"
        help:
          type: string
        dir:
          type:
            - string
            - "null"
          description: Its folder under each host's models root
        variants:
          type: array
          items:
            type: string
          description: The variants whose runs need it; a run on another variant does not, and the form greys those variants' rows instead of a control when the node always runs (Dev without the distilled LoRA). Absent = every variant
        licence:
          oneOf:
            - type: object
              required:
                - id
                - must_accept
              properties:
                id:
                  type: string
                must_accept:
                  type: boolean
            - type: "null"
          description: Its source's licence; null = no download source
        gated:
          type: boolean
        download_bytes:
          type:
            - integer
            - "null"
          minimum: 1
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/ModelVariantHost"
          description: "Every host whose models key lists the model with this add-on, by name: its state as a variant's (`downloading` while its download job is open)"
    ModelVariant:
      type: object
      required:
        - id
        - title
        - precisions
        - dir
        - licence
        - gated
        - download_bytes
        - components
        - hosts
      properties:
        id:
          type: string
          examples:
            - turbo
        title:
          type: string
          examples:
            - Turbo
        help:
          type: string
          description: Its line under the title in the model chip's menu (registry variant `help`, from the freshest key publishing it; LTX's Distilled `8 steps, about 10× faster`); absent = none
        precisions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Precision"
          description: "What it loads at (one only: whatever the model node asks, studio's RunsAt). With its components' `stored` a precision other than the stored dtype is made at load (`bf16 · int8 at load`) and a stored quantized dtype loads as it is (`fp8 · stored quantized`); without, first = as stored and the rest load-time quantizations"
        devices:
          type: array
          items:
            type: string
            enum:
              - cuda
              - mps
              - cpu
          description: The only devices it runs on; absent = every device of the model's runtimes
        dir:
          type:
            - string
            - "null"
          description: Its folder under each host's models root
        licence:
          oneOf:
            - type: object
              required:
                - id
                - must_accept
              properties:
                id:
                  type: string
                must_accept:
                  type: boolean
            - type: "null"
          description: Its source's licence (an id of `licences`); null = no download source
        gated:
          type: boolean
          description: The source needs a Hub token on the host
        download_bytes:
          type:
            - integer
            - "null"
          minimum: 1
          description: The expected size of its own files (source.bytes); null when unknown
        components:
          type: array
          items:
            type: object
            required:
              - component
              - from_variant
              - precisions
              - bytes
            properties:
              component:
                type: string
                examples:
                  - text_encoder
              from_variant:
                type: string
                description: "The variant whose folder holds it: itself, or the owner of a shared component"
              precisions:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/Precision"
              stored:
                type: string
                enum:
                  - bf16
                  - fp16
                  - fp32
                  - fp8
                  - int8
                description: "The dtype most of its weight bytes have on disk (registry component `stored`), from the freshest key that reports it; absent when no host does (its files on no disk, or a format that does not say: GGUF, packed 4-bit)"
              bytes:
                type:
                  - integer
                  - "null"
                minimum: 0
                description: On disk, from the freshest key where it is present; null when on no host
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/ModelVariantHost"
    ModelVariantState:
      type: string
      enum:
        - present
        - partial
        - missing
        - downloading
        - mismatch
      description: "Present: every file on disk, hashes as recorded; partial: some (resume with a download); missing: none of its own; downloading: a download job is queued or running (`job`); mismatch: files whose hash differs from the recorded one (`mismatch`; download again)"
    ModelVariantHost:
      type: object
      required:
        - host
        - state
        - bytes
        - job
      properties:
        host:
          type: string
        state:
          $ref: "#/components/schemas/ModelVariantState"
        bytes:
          type:
            - integer
            - "null"
          minimum: 0
          description: Its own files on that host's disk; null when missing
        mismatch:
          type: array
          items:
            type: string
          description: "State mismatch: the files, relative to `dir`"
        separate:
          type: array
          items:
            type: string
        job:
          oneOf:
            - type: object
              required:
                - id
                - state
                - done_bytes
                - total_bytes
              properties:
                id:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - queued
                    - running
                done_bytes:
                  type: integer
                  minimum: 0
                total_bytes:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  description: Null until the runner has listed the source
            - type: "null"
          description: "State downloading: its download job; null otherwise"
    ModelDownload:
      type: object
      required:
        - host
      additionalProperties: false
      properties:
        host:
          type: string
          pattern: ^[a-z0-9]{1,32}$
        variant:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: Absent = the model's first variant
        addon:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: Download this optional add-on (Model.addons[].component) instead of a variant; never with `variant`
        accept_licence:
          type: boolean
          description: "True: the admin accepted the variant's licence text as GET /v1/studio/models showed it; required when its must_accept is true"
    ModelJobKind:
      type: string
      enum:
        - download
        - delete
        - lora_delete
    ModelJobState:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
    ModelJob:
      type: object
      required:
        - id
        - kind
        - host
        - env
        - model
        - variant
        - addon
        - lora_id
        - title
        - state
        - progress
        - failure
        - result
        - keeps
        - licence
        - requested_by
        - created_at
        - started_at
        - ended_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ModelJobKind"
        host:
          type: string
        env:
          type: string
          description: The runner env that does it (the one whose models or loras key lists the model or LoRA)
        model:
          type:
            - string
            - "null"
          description: Download, delete
        variant:
          type:
            - string
            - "null"
          description: "Download: the variant; delete: null = every variant (or the add-on's)"
        addon:
          type:
            - string
            - "null"
          description: "Download and delete: the optional add-on instead of a variant (`variant` null)"
        lora_id:
          type:
            - string
            - "null"
          pattern: ^[0-9a-f]{64}$
          description: Lora_delete
        title:
          type: string
          description: "`Qwen Image 2.1 · Turbo`, or the LoRA's name"
          examples:
            - Qwen Image 2.1 · Turbo
        state:
          $ref: "#/components/schemas/ModelJobState"
        progress:
          oneOf:
            - type: object
              required:
                - done_bytes
                - total_bytes
                - files_done
                - files_total
                - file
                - eta_s
              properties:
                done_bytes:
                  type: integer
                  minimum: 0
                total_bytes:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                files_done:
                  type: integer
                  minimum: 0
                files_total:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                file:
                  type:
                    - string
                    - "null"
                eta_s:
                  type:
                    - number
                    - "null"
                  minimum: 0
            - type: "null"
          description: Null before the first and for deletes
        failure:
          oneOf:
            - type: object
              required:
                - class
                - detail
              properties:
                class:
                  type: string
                  enum:
                    - not_found
                    - gated
                    - licence
                    - disk_full
                    - hash_mismatch
                    - network
                    - in_use
                    - not_downloadable
                    - internal
                    - host_lost
                  description: "Host_lost: the host stopped responding while the job was released"
                detail:
                  type: string
            - type: "null"
          description: "Failed: why; null otherwise"
        result:
          oneOf:
            - type: object
              properties:
                bytes:
                  type: integer
                  minimum: 0
                files:
                  type: integer
                  minimum: 0
                freed_bytes:
                  type: integer
                  minimum: 0
                reused:
                  type: array
                  items:
                    type: string
                separate:
                  type: array
                  items:
                    type: string
                kept:
                  type: array
                  items:
                    type: string
            - type: "null"
          description: Null otherwise
        keeps:
          type: array
          items:
            type: object
            required:
              - component
              - from_variant
              - for
            properties:
              component:
                type: string
              from_variant:
                type: string
              for:
                type: array
                minItems: 1
                items:
                  type: string
                description: The variants on the host that still load it
          description: "Delete: the shared components it leaves on disk, decided when it was queued; [] otherwise"
        licence:
          oneOf:
            - type: object
              required:
                - id
                - sha256
              properties:
                id:
                  type: string
                sha256:
                  type: string
                  pattern: ^[0-9a-f]{64}$
            - type: "null"
          description: "Download: the licence accepted and the SHA-256 of its text; null when none had to be"
        requested_by:
          type: string
          format: uuid
          description: The admin's user id
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
          description: The first running status
        ended_at:
          type:
            - string
            - "null"
          format: date-time
    ModelJobList:
      type: object
      required:
        - jobs
      properties:
        jobs:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ModelJob"
    PinRef:
      type: object
      required:
        - env
        - component
        - model
        - variant
        - precision
      additionalProperties: false
      description: "One resident entry's identity (registry `$defs/pin`): what a resident component of GET /v1/studio/hosts shows, with its entry's env"
      properties:
        env:
          type: string
          pattern: ^[a-z0-9]{1,32}$
        component:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        model:
          type: string
          pattern: ^[a-z0-9][a-z0-9_.-]{0,63}$
        variant:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        precision:
          $ref: "#/components/schemas/Precision"
        compute:
          type: string
          enum:
            - float32
            - float16
          description: The entry's compute as GET /v1/studio/hosts shows it; absent = float32
        loras:
          type: array
          maxItems: 32
          description: A baked set, in order (lora_id and strength as the admin's hosts view shows them); absent or empty = the plain component
          items:
            type: object
            required:
              - lora_id
              - strength
            additionalProperties: false
            properties:
              lora_id:
                type: string
                pattern: ^([0-9a-f]{64}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
              strength:
                type: number
    AfterRun:
      type: string
      enum:
        - unload
        - keep_warm
        - keep_pinned
      description: "What stays loaded once a run ends: unload = nothing; keep_warm = everything until memory is needed or the idle timeout passes (the default); keep_pinned = only the pins"
    HostSettingsPut:
      type: object
      required:
        - after_run
        - idle_unload_min
        - reserve_gb
      additionalProperties: false
      properties:
        after_run:
          $ref: "#/components/schemas/AfterRun"
        idle_unload_min:
          type: integer
          minimum: 0
          maximum: 1440
          description: "Keep_warm: minutes idle before everything but the pins is unloaded; 0 = never"
        reserve_gb:
          type: number
          minimum: 0
          maximum: 1024
          multipleOf: 0.5
          description: "The host's budget is its RAM (on cuda: its VRAM) minus this"
    HostPins:
      type: object
      required:
        - pins
      additionalProperties: false
      properties:
        pins:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PinRef"
    HostSettings:
      type: object
      required:
        - host
        - version
        - after_run
        - idle_unload_min
        - reserve_gb
        - pins
        - applied
        - updated_at
      properties:
        host:
          type: string
        version:
          type: integer
          minimum: 1
        after_run:
          $ref: "#/components/schemas/AfterRun"
        idle_unload_min:
          type: integer
          minimum: 0
          maximum: 1440
        reserve_gb:
          type: number
          minimum: 0
        pins:
          type: array
          items:
            $ref: "#/components/schemas/PinRef"
        applied:
          type: boolean
          description: Every fresh hosts key of the host (but a local server's `server` env, which holds no weights) reports `policy.settings_version` = version
        updated_at:
          type: string
          format: date-time
    HostUnload:
      type: object
      additionalProperties: false
      description: "Exactly one of: `all`, `entries` (a component's ×), `cached_env` (Cached handles ×)"
      oneOf:
        - required:
            - all
        - required:
            - entries
        - required:
            - cached_env
      properties:
        all:
          type: boolean
          const: true
        entries:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/PinRef"
        cached_env:
          type: string
          pattern: ^[a-z0-9]{1,32}$
    HostUnloadAccepted:
      type: object
      required:
        - host
        - requests
      properties:
        host:
          type: string
        requests:
          type: array
          items:
            type: object
            required:
              - env
              - state
            properties:
              env:
                type: string
              state:
                type: string
                enum:
                  - asked
                  - after_run
                description: "Asked: sent now; after_run: the env is busy and is asked when its run ends"
    ImportTakeCreate:
      type: object
      required:
        - owner_id
        - key
        - kind
        - filename
        - content_type
        - bytes
        - width
        - height
        - created_at
        - starred
        - title
        - legacy
        - parents
      additionalProperties: false
      if:
        properties:
          kind:
            const: video
        required:
          - kind
      then:
        required:
          - video
        properties:
          content_type:
            const: video/mp4
      else:
        not:
          required:
            - video
        properties:
          content_type:
            enum:
              - image/png
              - image/jpeg
              - image/webp
          bytes:
            maximum: 52428800
      properties:
        owner_id:
          type: string
          format: uuid
          description: The user whose gallery receives it (the CLI resolves `--user <email>` with GET /auth/admin/users)
        key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$
          description: "The idempotency key: stable for one old item across runs"
        kind:
          type: string
          enum:
            - image
            - video
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: The old file's name, for logs
        content_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - video/mp4
        bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
          description: An image at most 50 MB, a video at most 2 GB
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
          description: "The old item's creation time: the take's created_at (its place in the gallery)"
        starred:
          type: boolean
        title:
          type: string
          minLength: 1
          maxLength: 200
        legacy:
          type: object
        parents:
          type: array
          maxItems: 64
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,199}$
          description: Keys of the imported items it was made from, in input order (lineage)
        video:
          type: object
          required:
            - duration_s
            - fps
            - frames
            - has_audio
            - poster
          additionalProperties: false
          properties:
            duration_s:
              type: number
              exclusiveMinimum: 0
            fps:
              type: number
              exclusiveMinimum: 0
            frames:
              type: integer
              minimum: 1
            has_audio:
              type: boolean
            poster:
              type: object
              required:
                - content_type
                - bytes
                - width
                - height
              additionalProperties: false
              properties:
                content_type:
                  type: string
                  enum:
                    - image/png
                    - image/jpeg
                    - image/webp
                bytes:
                  type: integer
                  minimum: 1
                  maximum: 52428800
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
    ImportTake:
      type: object
      required:
        - take_id
        - key
        - state
        - upload_url
        - poster_upload_url
        - expires_at
      properties:
        take_id:
          type: string
          format: uuid
        key:
          type: string
        state:
          type: string
          enum:
            - pending
            - ready
        upload_url:
          type:
            - string
            - "null"
          description: "Pending: the signed PUT link for the file (exactly its content_type and bytes); ready: null"
        poster_upload_url:
          type:
            - string
            - "null"
          description: "Pending video: the poster's link; null otherwise"
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: "Pending: when the links expire"
    LegacyInfo:
      type: object
      required:
        - settings
        - imported_at
      description: "A take imported from the old helmstudio: the read-only snapshot of its settings there (never editable; reuse is refused as for an upload)"
      properties:
        settings:
          type: object
        imported_at:
          type: string
          format: date-time
    TimelineTarget:
      type: object
      required:
        - width
        - height
        - fps
        - sample_rate
      additionalProperties: false
      description: The sequence's geometry and rates; the codec is the export's (H.264 + AAC in MP4)
      properties:
        width:
          type: integer
          minimum: 16
          maximum: 4096
          multipleOf: 2
        height:
          type: integer
          minimum: 16
          maximum: 4096
          multipleOf: 2
        fps:
          type: number
          enum:
            - 23.976
            - 24
            - 25
            - 29.97
            - 30
            - 48
            - 50
            - 59.94
            - 60
          description: One of the rate table (exact rates 24000/1001, 30000/1001, 60000/1001 for the NTSC ones)
        sample_rate:
          type: integer
          enum:
            - 44100
            - 48000
    TimelineSeconds:
      type: number
      minimum: 0
      maximum: 86400
      description: "Seconds, snapped by studio onto the frame grid (an audio track's in/out: the sample grid)"
    TimelineDissolve:
      type: object
      required:
        - type
        - frames
      additionalProperties: false
      properties:
        type:
          type: string
          const: dissolve
        frames:
          type: integer
          minimum: 2
          maximum: 240
          multipleOf: 2
          description: "Centred on the cut: half before it, half after"
    TimelineShotRef:
      description: "A generation filling this slot (made by studio only; a write keeps it or drops it): a New shot's run, or a Re-render batch's step. In answers it adds `status` and, failed, `error`"
      type: object
      oneOf:
        - required:
            - run_id
        - required:
            - batch_id
            - step
      properties:
        run_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        step:
          type: string
          pattern: ^clip_[a-z0-9]{1,16}$
          description: The re-render pipeline's step for this clip
        status:
          type: string
          enum:
            - queued
            - running
            - failed
          description: "Answers only: the run's, or the batch step's (a cancelled or succeeded one is gone from the document)"
        error:
          type:
            - string
            - "null"
          description: "Answers only, failed: the run's error"
    TimelineClipId:
      type: string
      pattern: ^[a-z0-9]{1,16}$
      description: A slot's id, stable across edits and revisions; the editor makes new ones (unique in the document)
    TimelineClip:
      type: object
      required:
        - id
        - take_id
      additionalProperties: false
      description: "A slot: a take, or an empty slot (`take_id` null, `hold`): black and silence; on an audio track only a New line's placeholder"
      properties:
        id:
          $ref: "#/components/schemas/TimelineClipId"
        take_id:
          type:
            - string
            - "null"
          format: uuid
        in:
          $ref: "#/components/schemas/TimelineSeconds"
          description: "A video take: the source time it starts at (default 0)"
        out:
          $ref: "#/components/schemas/TimelineSeconds"
          description: "A video take: the source time it ends at (default its length)"
        hold:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
          description: "An image take or an empty slot: its length in seconds"
        at:
          $ref: "#/components/schemas/TimelineSeconds"
          description: "An audio track: where it starts on the sequence (required there); V1: computed, ignored in a write"
        gain_db:
          type: number
          minimum: -60
          maximum: 12
          default: 0
        mute:
          type: boolean
          default: false
          description: "V1: the clip's own sound is off"
        transition_in:
          $ref: "#/components/schemas/TimelineDissolve"
        alternatives:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: The takes made for this slot, oldest first; the current `take_id` is among them (studio adds it). Replace picks one
        shot:
          $ref: "#/components/schemas/TimelineShotRef"
        number:
          type: integer
          minimum: 1
          description: "V1 only: the shot number (\"Shot 4\"), given by studio when the clip is added (the highest so far + 1) and kept when it moves; a write cannot change a stored clip's."
        offline:
          type: boolean
          description: "Answers only, true when the take is deleted or gone: the clip keeps its place and length, plays as offline and blocks an export"
        link:
          $ref: "#/components/schemas/TimelineClipId"
          description: "An audio-track clip only: the V1 clip it is linked to"
    TimelineMarkerColor:
      type: string
      enum:
        - red
        - orange
        - yellow
        - green
        - blue
        - purple
      description: A marker's colour, drawn with the theme's own shade
    TimelineMarker:
      type: object
      required:
        - id
        - at
      additionalProperties: false
      description: A named point on the sequence (snapped to frames; drawn on the ruler, a snap target)
      properties:
        id:
          $ref: "#/components/schemas/TimelineClipId"
          description: Unique among the markers
        at:
          $ref: "#/components/schemas/TimelineSeconds"
          description: Sequence seconds; with V1 clips never past the end (`marker_past_end`)
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          $ref: "#/components/schemas/TimelineMarkerColor"
    TimelineTrackKind:
      type: string
      enum:
        - video
        - audio
    TimelineTrack:
      type: object
      required:
        - kind
        - clips
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: ^(V1|A[2-9])$
          description: "Answers only (ignored in a write): V1, then A2…A9 by position (A1 is V1's own sound, drawn under it)"
        kind:
          $ref: "#/components/schemas/TimelineTrackKind"
        gain_db:
          type: number
          minimum: -60
          maximum: 12
          default: 0
        mute:
          type: boolean
          default: false
        clips:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/TimelineClip"
    TimelineDoc:
      type: object
      required:
        - target
        - tracks
      description: "The editable document: exactly one video track first (V1), then up to 8 audio tracks"
      properties:
        target:
          $ref: "#/components/schemas/TimelineTarget"
        tracks:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: "#/components/schemas/TimelineTrack"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/TimelineMarker"
          description: At most 200 (`too_many_markers`); absent = none; answers sort them by time, then id, and leave the list out when empty
    TimelineNormalized:
      allOf:
        - $ref: "#/components/schemas/TimelineDoc"
      type: object
      required:
        - target
        - tracks
        - duration_s
        - frames
      description: "A document as studio stores and answers it: names, V1 `at`, defaults filled, every time snapped"
      properties:
        duration_s:
          type: number
          minimum: 0
          description: "`frames` in seconds"
        frames:
          type: integer
          minimum: 0
          description: "The sequence's length: V1's end (no V1 clip: the last sound's)"
    TimelineDefaults:
      type: object
      additionalProperties: false
      description: "What New shot's composer starts with: the cast (elements, offered as mentions and typed into an empty prompt) and the looks (sent as RunRequest.looks)"
      properties:
        cast:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Library elements of the caller; one deleted since is left out of answers
        looks:
          $ref: "#/components/schemas/LookIds"
    TimelineCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
          description: Trimmed; empty or missing = "Untitled sequence"
        target:
          type: object
          additionalProperties: false
          description: Any field left out comes from the first take
          properties:
            width:
              $ref: "#/components/schemas/TimelineTarget/properties/width"
            height:
              $ref: "#/components/schemas/TimelineTarget/properties/height"
            fps:
              $ref: "#/components/schemas/TimelineTarget/properties/fps"
            sample_rate:
              $ref: "#/components/schemas/TimelineTarget/properties/sample_rate"
        take_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Clips to start with, in order (the gallery's multi-selection)
        defaults:
          $ref: "#/components/schemas/TimelineDefaults"
    TimelineUpdate:
      type: object
      required:
        - revision
        - target
        - tracks
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision the edit was made on
        target:
          $ref: "#/components/schemas/TimelineTarget"
        tracks:
          $ref: "#/components/schemas/TimelineDoc/properties/tracks"
        markers:
          $ref: "#/components/schemas/TimelineDoc/properties/markers"
          description: The whole list (absent = none)
    TimelinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed; blank = 422
        defaults:
          $ref: "#/components/schemas/TimelineDefaults"
    TimelineRevision:
      type: object
      required:
        - revision
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: The current revision, as the editor has it
    TimelineAddClips:
      type: object
      required:
        - take_ids
      additionalProperties: false
      properties:
        take_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: In order
        track:
          type: string
          pattern: ^(V1|A[2-9])$
          default: V1
    TimelineTake:
      type: object
      description: A take the document names (a clip's or an alternative), signed for the editor and the preview
      required:
        - id
        - kind
        - source
        - title
        - url
        - thumb_url
        - width
        - height
        - seed
        - workflow_id
        - workflow_title
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/TakeKind"
        source:
          $ref: "#/components/schemas/TakeSource"
        title:
          type: string
          maxLength: 200
        url:
          $ref: "#/components/schemas/SignedUrl"
        thumb_url:
          $ref: "#/components/schemas/SignedUrl"
          description: The take's thumbnail (Take.thumb_url)
        width:
          type:
            - integer
            - "null"
          minimum: 1
        height:
          type:
            - integer
            - "null"
          minimum: 1
        video:
          $ref: "#/components/schemas/VideoInfo"
        audio:
          $ref: "#/components/schemas/AudioInfo"
          description: "Kind audio only: its length, rate and a dialogue's cues (ticks on the clip)"
        seed:
          type:
            - integer
            - "null"
          minimum: 0
          description: "`made_with.seed`; null without one"
        workflow_id:
          type:
            - string
            - "null"
          description: '`made_with.workflow_id`; null for an upload, import, frame or export (no "from this clip", no re-render)'
        workflow_title:
          type:
            - string
            - "null"
    TimelineProblem:
      type: object
      required:
        - code
        - track
        - clip
        - message
      properties:
        code:
          type: string
          examples:
            - dissolve_handles
        track:
          type:
            - string
            - "null"
          examples:
            - V1
        clip:
          oneOf:
            - $ref: "#/components/schemas/TimelineClipId"
            - type: "null"
        message:
          type: string
    TimelineError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: "`timeline has <n> problems: <first message>`, or why the body does not fit"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/TimelineProblem"
    Timeline:
      allOf:
        - $ref: "#/components/schemas/TimelineNormalized"
      type: object
      required:
        - id
        - name
        - session_id
        - revision
        - defaults
        - can_undo
        - can_redo
        - takes
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        session_id:
          type:
            - string
            - "null"
          format: uuid
          description: The session its shots run in (follow it with GET …/sessions/{session_id}/events); null after that session was deleted (the next shot makes a new one)
        revision:
          type: integer
          minimum: 1
          description: 1 on create, +1 on every stored change of the document
        defaults:
          type: object
          required:
            - cast
            - looks
          properties:
            cast:
              type: array
              items:
                type: string
                format: uuid
            looks:
              $ref: "#/components/schemas/LookIds"
        can_undo:
          type: boolean
        can_redo:
          type: boolean
        takes:
          type: object
          propertyNames:
            format: uuid
          additionalProperties:
            $ref: "#/components/schemas/TimelineTake"
          description: Every take the document names that is not offline
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TimelineSummary:
      type: object
      required:
        - id
        - name
        - target
        - revision
        - duration_s
        - clips
        - thumb_url
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        target:
          $ref: "#/components/schemas/TimelineTarget"
        revision:
          type: integer
          minimum: 1
        duration_s:
          type: number
          minimum: 0
        clips:
          type: integer
          minimum: 0
          description: V1 clips
        thumb_url:
          oneOf:
            - $ref: "#/components/schemas/SignedUrl"
            - type: "null"
          description: The first V1 take's thumbnail; null when none
        updated_at:
          type: string
          format: date-time
    TimelineOp:
      description: "`fill` is studio's and not one of them. Seconds are snapped to the frame grid (an audio track's in / out: samples). A new op is an openapi change and a version"
      type: object
      required:
        - op
      oneOf:
        - title: move
          description: "V1: to `index` (V1 ripples); an audio clip: a new start `at`, optionally on another audio `track`"
          type: object
          required:
            - op
            - clip
          additionalProperties: false
          properties:
            op:
              const: move
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            index:
              type: integer
              minimum: 0
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            track:
              type: string
              pattern: ^(V1|A[2-9])$
        - title: trim
          description: Move one edge by `delta` seconds (snapped to frames), clamped to the take and the dissolves
          type: object
          required:
            - op
            - clip
            - edge
            - delta
          additionalProperties: false
          properties:
            op:
              const: trim
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            edge:
              type: string
              enum:
                - in
                - out
            delta:
              type: number
              minimum: -86400
              maximum: 86400
        - title: split
          description: "Cut the clip of `track` under the playhead `at`; the right part gets `id` (absent: studio makes one)"
          type: object
          required:
            - op
            - track
            - at
          additionalProperties: false
          properties:
            op:
              const: split
            track:
              type: string
              pattern: ^(V1|A[2-9])$
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            id:
              $ref: "#/components/schemas/TimelineClipId"
            ids:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/TimelineClipId"
              description: "V1: ids for the right parts of its linked sound clips cut with it, in track order (absent ones: studio makes them)"
        - title: remove
          description: Remove the clip
          type: object
          required:
            - op
            - clip
          additionalProperties: false
          properties:
            op:
              const: remove
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            ripple:
              type: boolean
              description: "An audio-track clip: the later clips of its track move left by its length (V1 always ripples)"
        - title: lift
          description: "V1 only: an empty slot of the clip's length, same id"
          type: object
          required:
            - op
            - clip
          additionalProperties: false
          properties:
            op:
              const: lift
            clip:
              $ref: "#/components/schemas/TimelineClipId"
        - title: replace
          description: The clip's take becomes `take_id`, one of its alternatives
          type: object
          required:
            - op
            - clip
            - take_id
          additionalProperties: false
          properties:
            op:
              const: replace
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            take_id:
              type: string
              format: uuid
        - title: set
          description: Set the clip's fields; null removes one
          type: object
          required:
            - op
            - clip
          additionalProperties: false
          properties:
            op:
              const: set
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            gain_db:
              type:
                - number
                - "null"
              minimum: -60
              maximum: 12
            mute:
              type:
                - boolean
                - "null"
            hold:
              type:
                - number
                - "null"
              exclusiveMinimum: 0
              maximum: 3600
            transition_in:
              oneOf:
                - $ref: "#/components/schemas/TimelineDissolve"
                - type: "null"
            link:
              oneOf:
                - $ref: "#/components/schemas/TimelineClipId"
                - type: "null"
              description: "An audio-track clip: the V1 clip it is linked to (null unlinks)"
        - title: add
          description: "Append takes in order to `track` (default V1); `ids` for the new clips, in order (absent ones: studio makes them)"
          type: object
          required:
            - op
            - take_ids
          additionalProperties: false
          properties:
            op:
              const: add
            take_ids:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: string
                format: uuid
            track:
              type: string
              pattern: ^(V1|A[2-9])$
            ids:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/TimelineClipId"
        - title: insert
          description: An empty slot of `hold` seconds at the V1 cut nearest `at`
          type: object
          required:
            - op
            - at
            - hold
          additionalProperties: false
          properties:
            op:
              const: insert
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            hold:
              type: number
              exclusiveMinimum: 0
              maximum: 3600
            id:
              $ref: "#/components/schemas/TimelineClipId"
        - title: place
          description: An empty slot of `hold` seconds at exactly `at` on V1 (Make shot's edit); `gap_id` for a gap it needs
          type: object
          required:
            - op
            - at
            - hold
          additionalProperties: false
          properties:
            op:
              const: place
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            hold:
              type: number
              exclusiveMinimum: 0
              maximum: 3600
            id:
              $ref: "#/components/schemas/TimelineClipId"
            gap_id:
              $ref: "#/components/schemas/TimelineClipId"
        - title: add_track
          description: A new audio track at the end
          type: object
          required:
            - op
          additionalProperties: false
          properties:
            op:
              const: add_track
        - title: remove_track
          description: Remove an audio track and its clips
          type: object
          required:
            - op
            - track
          additionalProperties: false
          properties:
            op:
              const: remove_track
            track:
              type: string
              pattern: ^(V1|A[2-9])$
        - title: track
          description: A track's gain or mute
          type: object
          required:
            - op
            - track
          additionalProperties: false
          properties:
            op:
              const: track
            track:
              type: string
              pattern: ^(V1|A[2-9])$
            gain_db:
              type: number
              minimum: -60
              maximum: 12
            mute:
              type: boolean
        - title: roll
          description: "V1: the cut before the clip moves by `delta` (the clip before ends later, this one starts later; the length is kept, the dissolve on the cut moves with it)"
          type: object
          required:
            - op
            - clip
            - delta
          additionalProperties: false
          properties:
            op:
              const: roll
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            delta:
              type: number
              minimum: -86400
              maximum: 86400
              description: Seconds, snapped to frames
        - title: slip
          description: The clip shows other frames of its take, in and out moved by `delta` (place and length kept)
          type: object
          required:
            - op
            - clip
            - delta
          additionalProperties: false
          properties:
            op:
              const: slip
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            delta:
              type: number
              minimum: -86400
              maximum: 86400
              description: Seconds, snapped to frames
        - title: slide
          description: "V1: the clip moves along V1 by `delta`, its content and length kept; the clip before and the one after give and take the frames"
          type: object
          required:
            - op
            - clip
            - delta
          additionalProperties: false
          properties:
            op:
              const: slide
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            delta:
              type: number
              minimum: -86400
              maximum: 86400
              description: Seconds, snapped to frames
        - title: overwrite
          description: "The clip goes in at `at` over what is there, no ripple (V1: it leaves an empty slot where it was; audio: onto `track`, default its own)"
          type: object
          required:
            - op
            - clip
            - at
          additionalProperties: false
          properties:
            op:
              const: overwrite
            clip:
              $ref: "#/components/schemas/TimelineClipId"
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            track:
              type: string
              pattern: ^(V1|A[2-9])$
            ids:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/TimelineClipId"
              description: "Ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)"
        - title: split_all
          description: Blade on every track at `at` (a clip with a shot or a cut there is skipped)
          type: object
          required:
            - op
            - at
          additionalProperties: false
          properties:
            op:
              const: split_all
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            ids:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/TimelineClipId"
              description: "Ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)"
        - title: remove_range
          description: Every track cut at `from` and `to`, what is between removed; V1 and the audio tracks ripple
          type: object
          required:
            - op
            - from
            - to
          additionalProperties: false
          properties:
            op:
              const: remove_range
            from:
              $ref: "#/components/schemas/TimelineSeconds"
            to:
              $ref: "#/components/schemas/TimelineSeconds"
            ids:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/TimelineClipId"
              description: "Ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)"
        - title: lift_range
          description: "Every track cut at `from` and `to`, what is between lifted (V1: one empty slot; audio: a gap); nothing moves"
          type: object
          required:
            - op
            - from
            - to
          additionalProperties: false
          properties:
            op:
              const: lift_range
            from:
              $ref: "#/components/schemas/TimelineSeconds"
            to:
              $ref: "#/components/schemas/TimelineSeconds"
            ids:
              type: array
              maxItems: 32
              items:
                $ref: "#/components/schemas/TimelineClipId"
              description: "Ids for the clips it makes, in track order, then left to right (absent ones: studio makes them; too few in a web replay: ids_short)"
        - title: marker
          description: "Put a marker (a new `id` adds one, a known one is replaced whole; absent: studio makes one)"
          type: object
          required:
            - op
            - at
          additionalProperties: false
          properties:
            op:
              const: marker
            id:
              $ref: "#/components/schemas/TimelineClipId"
            at:
              $ref: "#/components/schemas/TimelineSeconds"
            name:
              type: string
              minLength: 1
              maxLength: 80
            color:
              $ref: "#/components/schemas/TimelineMarkerColor"
        - title: remove_marker
          description: Remove a marker
          type: object
          required:
            - op
            - id
          additionalProperties: false
          properties:
            op:
              const: remove_marker
            id:
              $ref: "#/components/schemas/TimelineClipId"
    TimelineEdits:
      type: object
      required:
        - base_revision
        - ops
      additionalProperties: false
      properties:
        base_revision:
          type: integer
          minimum: 1
          description: The revision the ops were planned on (409 when it is not the current one)
        ops:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/TimelineOp"
        dry_run:
          type: boolean
          default: false
          description: "Try it: the same answer, nothing stored"
    TimelineDiff:
      type: object
      required:
        - added
        - removed
        - changed
        - tracks
        - duration
        - markers
      additionalProperties: false
      description: What changed between two normalized documents, by clip id; a field absent on one side is null
      properties:
        added:
          type: array
          items:
            $ref: "#/components/schemas/TimelineClipId"
          description: New clip ids, in track order (studio-made ones included)
        removed:
          type: array
          items:
            $ref: "#/components/schemas/TimelineClipId"
        changed:
          type: array
          items:
            type: object
            required:
              - clip
              - fields
            additionalProperties: false
            properties:
              clip:
                $ref: "#/components/schemas/TimelineClipId"
              fields:
                type: object
                description: Field → [before, after], among take_id, in, out, hold, at, gain_db, mute, transition_in, alternatives, shot, offline, track and link (a V1 ripple shows as `at` changes)
                additionalProperties:
                  type: array
                  minItems: 2
                  maxItems: 2
        tracks:
          type: object
          required:
            - added
            - removed
            - changed
          additionalProperties: false
          properties:
            added:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
            changed:
              type: array
              items:
                type: object
                required:
                  - track
                  - fields
                additionalProperties: false
                properties:
                  track:
                    type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: array
                      minItems: 2
                      maxItems: 2
        duration:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
            minimum: 0
          description: "[before, after] duration_s"
        markers:
          type: object
          required:
            - added
            - removed
            - changed
          additionalProperties: false
          description: Markers by id
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/TimelineClipId"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/TimelineClipId"
            changed:
              type: array
              items:
                type: object
                required:
                  - marker
                  - fields
                additionalProperties: false
                properties:
                  marker:
                    $ref: "#/components/schemas/TimelineClipId"
                  fields:
                    type: object
                    description: Among at, name, color
                    additionalProperties:
                      type: array
                      minItems: 2
                      maxItems: 2
    TimelineEditResult:
      type: object
      required:
        - revision
        - dry_run
        - timeline
        - diff
        - warnings
      properties:
        revision:
          type: integer
          minimum: 1
          description: "The stored revision; a dry run: base_revision"
        dry_run:
          type: boolean
        timeline:
          $ref: "#/components/schemas/Timeline"
          description: "As GET …/{timeline_id} answers it (a dry run: what it would be)"
        diff:
          $ref: "#/components/schemas/TimelineDiff"
        warnings:
          type: array
          items:
            type: string
          description: What studio changed beyond the ops (a time snapped to the frame grid); never a refusal
    TimelineEditError:
      type: object
      required:
        - detail
      description: "TimelineError plus the failing op: `ops[3]: split_edge`, or `ops[3]: timeline has 2 problems: …`; `{detail}` only when the body does not fit"
      properties:
        detail:
          type: string
        op_index:
          type: integer
          minimum: 0
        code:
          type: string
          description: The edit's error code or the first problem's code
        problems:
          type: array
          items:
            $ref: "#/components/schemas/TimelineProblem"
    TimelineRevisionItem:
      type: object
      required:
        - revision
        - by
        - via
        - saved_at
        - ops_summary
        - clips
        - duration_s
      properties:
        revision:
          type: integer
          minimum: 1
        by:
          type: string
          enum:
            - user
            - studio
        via:
          type:
            - string
            - "null"
          enum:
            - web
            - api
            - mcp
            - assistant
            - null
          description: "A user write: where it came from; studio's: null"
        saved_at:
          type: string
          format: date-time
        ops_summary:
          type:
            - string
            - "null"
          description: The op names of an /edits call (`split, remove`), else the write's kind (edit, add, shot, line, rerender, undo, redo, restore, fill)
        clips:
          type: integer
          minimum: 0
          description: V1 clips
        duration_s:
          type: number
          minimum: 0
    TimelineRevisionList:
      type: object
      required:
        - revisions
      properties:
        revisions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TimelineRevisionItem"
    TimelineRevisionDoc:
      allOf:
        - $ref: "#/components/schemas/TimelineRevisionItem"
      type: object
      required:
        - document
      properties:
        document:
          $ref: "#/components/schemas/TimelineNormalized"
    TimelineRestore:
      type: object
      required:
        - revision
        - to
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: The current revision, as the caller has it
        to:
          type: integer
          minimum: 1
          description: The kept revision to bring back
    TimelineAgentClip:
      type: object
      required:
        - id
        - track
        - index
        - take_id
        - take_title
        - kind
        - in
        - out
        - hold
        - at
        - end
        - length
        - at_f
        - end_f
        - length_f
        - gain_db
        - mute
        - transition_in
        - alternatives
        - shot
        - number
        - offline
        - link
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TimelineClipId"
        track:
          type: string
        index:
          type: integer
          minimum: 0
          description: Its place on its track
        take_id:
          type:
            - string
            - "null"
          format: uuid
        take_title:
          type:
            - string
            - "null"
        kind:
          type: string
          enum:
            - video
            - image
            - audio
            - slot
          description: "Slot: an empty slot (or a line placeholder)"
        in:
          type:
            - number
            - "null"
        out:
          type:
            - number
            - "null"
        hold:
          type:
            - number
            - "null"
        at:
          type: number
          minimum: 0
          description: Sequence seconds
        end:
          type: number
          minimum: 0
        length:
          type: number
          minimum: 0
        at_f:
          type: integer
          minimum: 0
          description: Frames, on the target's grid
        end_f:
          type: integer
          minimum: 0
        length_f:
          type: integer
          minimum: 0
        gain_db:
          type: number
        mute:
          type: boolean
        transition_in:
          type:
            - integer
            - "null"
          description: A dissolve's frames
        alternatives:
          type: array
          items:
            type: string
            format: uuid
        shot:
          oneOf:
            - $ref: "#/components/schemas/TimelineShotRef"
            - type: "null"
        number:
          type:
            - integer
            - "null"
          description: "V1: the shot number"
        offline:
          type: boolean
        link:
          oneOf:
            - $ref: "#/components/schemas/TimelineClipId"
            - type: "null"
          description: "An audio-track clip: the V1 clip it is linked to"
    TimelineAgentView:
