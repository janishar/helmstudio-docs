      description: "In one transaction: `control: stop`, every queued run of the batch `cancelled` at once (never sent), every takes already stored are kept), and Runs pipelines asks for afterwards are created `cancelled`. that never started `cancelled` and ends with `status: stopped`. Finished rows and their takes stay. 409 when `status` is `done`, `failed` or `stopped`, or `control` is already `stop`."
