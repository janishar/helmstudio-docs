      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Runs and events
      operationId: studioCreateRun
      summary: Run a workflow in the session
      description: "Resolves the graph (node schema defaults, then the workflow's params, then `inputs`) and stores the run `queued` in lane `interactive`, attempt 1. The dispatcher releases it the fair order. 422 for an unknown `workflow_id`, an input key that is not a param of the workflow's nodes, or a value of the wrong type, out of `min`/`max` or not in `enum` (the detail names the key, e.g. `echo.steps: must be between 1 and 200`). Image values (`ImageRef`, alone or in `rows` items) are 422 when the take is unknown, another user's, deleted or a pending upload (`encode.refs[2].image: take <id> not found`, items numbered from 1 as in `<image{n}>`), not an image (`… take <id> is not an image`), without a size (`… take <id> has no size`), or its object is missing; a rows value outside `min`/`max` (`encode.refs: at most 10 items`), an item field not in `item`, or an image param left null (`image.image: an image is required`) is 422 too. of dev`. `speak.voice: a voice is required`, `speak.voice: voice <id> not found` (unknown, another user's, deleted, not a voice, or a starter voice no live host publishes), `speak.voice: this workflow cannot use a designed voice` (the voice fit's reason for that param), `speak.voice: voice <name> is for <family>`; sends its clip, resolved like a media value even after its take was deleted (`speak.voice: the clip of voice <name> is gone` when its object is missing); in a workflow whose media is audio a mention in a prompt param is `prompt.text: mentions are not read aloud; use a dialogue script`. When no host is eligible (none live with the env and the workflow), the run is created already `failed` with error `no live host for env <env>` (still 202) and nothing is sent. planned peak; body with `host` (Create's Run on) is eligible on that host only: when it cannot take the run now the answer is 422 with the eligibility text and nothing is stored. on a host where the add-on is present: set to a host without it, 422 `<node>: <title> not downloaded on host <host>`; otherwise the run fails `<node>: <title> not downloaded on any live host for env <env>`. `addons`, swapped by `addons_with` while a named input is wired or rows param holds a row: MiniMax H3's `lora: turbo` needs Turbo LoRA, with a reference Turbo Ref LoRA), with the same texts. 409 when the caller already has 100 runs queued or running (any session): `You have 100 runs queued or running; wait for some to finish.` A user workflow (`workflow_id` a UUID of the caller's; another user's is 422 `unknown workflow <id>`) runs as it is stored now: studio checks it with the graph rules against the live palette and any problem is 422 `workflow cannot run: <first problem's message>`; the run keeps that version (`workflow_version`) and the resolved graph as its snapshot, which the dispatcher sends however the workflow changes later. `inputs` may also hold `<node>.bypass: true|false` for a bypassable node; an input naming a param that is wired from upstream is 422 (`sample.steps: wired from count.value; it cannot be set`). `@handle` mentions in the prompt params are expanded after every value is merged and checked, against the caller's elements now: 422 `prompt.text: unknown element @<handle>` (each distinct one, joined by `; `), `encode.refs: at most 10 images; <n> used, @<handle> +<k>, … do not fit`, `prompt.text: at most 4000 characters once elements are added (<n>)`. The resolved graph is what is checked for a host, stored as the run's snapshot, sent and recorded in the take; `Run.inputs` stays as requested. LoRA values (`LoraRef`, a Lora field of a `rows` item: the `<family>/lora-stack` node) are then resolved as the caller, items numbered from 1: 422 `lora.rows[2].lora: LoRA <id> not found` (unknown, another user's, deleted, pending or rejected, or a shared id no live host of the env lists: one message, nothing leaks), `lora.rows[2].lora: LoRA <name> does not fit qwen-image (it is for <family>)` (or `(its model is unknown)`), `lora.rows[2].lora: LoRA <name> is already in row 1`; strength and mode are checked by the run rules (`lora.rows[1].strength: must be between 0 and 2`), the row count by `max` (`lora.rows: at most 8 items`). A shared LoRA no live host of the env has at dispatch fails the run `no live host for env <env> has LoRA <name>`. `looks` are applied in the same resolver as the mentions, after the values are merged and checked, and before the LoRA values are resolved, against the caller's looks and the live starter looks now; `Run.looks` keeps them as requested. 422 (items from 1, in request order, each distinct one; with unknown handles those come first): `looks[2]: unknown look <id>` (unknown, an element, another user's, deleted, or a starter look no live host publishes), `looks[2]: look <name> does not fit this workflow (<reason>)` (the fit reasons, e.g. `this workflow has no LoRA stack`, `LoRA <name> is on no live host`, `LoRA <name> is for <family>`), `encode.refs: at most 10 images; 9 used, @fox +1, look Noir +1 do not fit`, `lora.rows: at most 8 LoRAs; 7 used, look Noir +2 do not fit`, `prompt.text: at most 4000 characters once elements and looks are added (<n>)`. Video: a `frames` param takes `\"auto\"` only when its schema declares `auto` (else `duration.frames: auto length is not offered`); an int with `values` / `values_by` takes only those (`sample2.steps: must be one of 3`); a rows param with an Image field and `min` ≥ 1 needs that many items at run (`keyframes.images: at least 1 items`); item fields left out take their defaults and the merged item is checked (`encode.beats[1].text: must be between 1 and 500 characters`); keyframe positions (`position: seconds`) are checked against the clip: `keyframes.images[2].seconds: frame 50 is past the clip's last frame 48`, `keyframes.images[2].seconds: frame 0 is already used by row 1`; a LoRA a model's lora block lists as `prefused` for its variant: `lora.rows[1].lora: LoRA <name> is already part of the distilled weights`; a bake-only stack's `mode: adapter` fails `enum` (`lora.rows[1].mode: must be one of bake`). with its wires first; a rows value while a `not_with` input is wired is 422 `generate.refs: must stay empty while generate.first is wired`; a media field of a rows item is resolved like a media param, items from 1: `generate.videos[2].video: take <id> not found`, `… take <id> is not a video`, `generate.audios[1].audio: take <id> has no sound`, `… take <id> lasts 1.5 s; this input takes at least 2.0 s`, `… the part lasts 16.0 s; this input takes at most 15.0 s`, `… in must be before out`, `… out <x> is past the take's end <d>`; a missing media field `generate.videos[1].video: a take is required`; then the items together: `generate.videos: the takes last 16.5 s in all; at most 15.0 s`. The counts are the rows `max` (`generate.videos: at most 3 items`). the rows of media and before the voices are resolved, against the caller's elements and voices now; 422, each line's first problem, line order, joined by `; `: `dialogue.script line 3: write @name: text or @name (style): text`, `… line 3: nothing to say`, `… line 3: at most 600 characters (612)`, `… line 3: the style is at most 200 characters (215)`, `… line 3: unknown element @jon`, `… line 3: @jon has no voice` (none, or one gone since), `… line 4: voice Kai does not fit this workflow (this workflow cannot use a designed voice)` (the voice fit of the lines' voice field, narrowed by `only`); then `dialogue.script: the script is empty` (no line, and no `lines` given), `dialogue.lines: at most 40 lines`, `dialogue.lines: give the script or the lines, not both`. Lines given directly (the Graph view, an agent) are resolved item by item like a voice param: `dialogue.lines[2].voice: a voice is required`, `… voice <id> not found`, `… this workflow cannot use a designed voice`, `… voice <name> is for <family>`."
      parameters:
        - $ref: "#/components/parameters/SessionId"
