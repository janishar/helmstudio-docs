      description: "Built from the registry `<host>.<env>.models` keys of every host with a present `hosts` key (fresh or offline) and studio's model jobs; nothing in it is per user. `hosts`: those hosts by name, `live` = a fresh key. `models`: the union of their models by `title` then `id`; each variant's descriptive fields from the freshest live key that publishes it (else the freshest key); `hosts` of a variant: every host whose models key lists the model, by name (a host with no env for the model is not listed). A variant host's `state`: `downloading` while a download job of that (host, model, variant) is queued or running (`job`), else the key's `presence`. Not paginated."
