        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/takes/{take_id}/uses:
    get:
      tags:
        - Takes and uploads
      operationId: studioListTakeUses
      summary: '"Use in…": the workflows this take can go into, each with its inputs pre-filled'
      description: "The templates a live host could run now (published, model variant present, `ltx/distill`'s LoRA on the host) and the caller's own non-text workflows, in `GET /v1/studio/workflows` order, that have exactly one input this take fits (an image take: an `image` param or an Image rows param; a video or audio take: a `media` param whose `accepts`, `grid`, `max_s`, `min_s` and `max_frames` it passes), each with `inputs` as `POST …/use` answers them. block: every input), not on an `optional` node, and not a rows param excluded by a wired `not_with` input (MiniMax H3: an image goes to Image to video's first frame and References, not Text to video). rows param with exactly one media field counts too, by the take's own kind only (a video into `videos`, an audio take into `audios`; a video's sound never into audio rows by offer), with the take as item 1 (`in` 0, `out` = min(duration, the field's `max_s`, the rows' `max_total_s`) on `trim`): an audio take offers MiniMax H3 References, whose run still needs an image or video reference. Empty when none fits. 404 for a take that is unknown, another user's, deleted or a pending upload."
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "200":
          description: The offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TakeUses"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/studio/takes/{take_id}/pipeline:
    post:
      tags:
        - Takes and uploads
      operationId: studioSaveTakeAsPipeline
      summary: "\"Save as pipeline\": a new pipeline of the caller's from the chain of runs that made this take"
      description: "Walks the take's lineage and saves the pipeline it builds: inputs node `inputs` → `step_1` … `step_n` (oldest first) → output `output`; 201 with `problems` like POST `/v1/studio/pipelines`, `version` 1, `based_on` null. 404 for a take that is unknown, another user's or deleted. 409 at 100 pipelines. 422 with the reason when the lineage is not a chain it can save: `an upload has no lineage to save`, `take <id> was made from several runs' takes; a pipeline is a chain`, `take <id> in the lineage was deleted`, `workflow <id> no longer exists`, `the lineage is longer than 8 steps`, `take <id> mixes several sources in <param>`. Each step's `looks` = the ids of its take's `made_with.looks` (one gone since shows as an `unknown_look` problem)."
      parameters:
