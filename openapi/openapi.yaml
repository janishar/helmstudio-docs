      required:
        - workflow_id
        - inputs
      properties:
        workflow_id:
          type: string
        inputs:
          $ref: "#/components/schemas/RunInputs"
        workflow_status:
          type: string
          enum:
            - current
            - changed
            - deleted
          description: "Reuse only (not use): how the workflow now compares with the one that made the take (studioReuseTake)"
        elements_status:
          type: array
          items:
            $ref: "#/components/schemas/ElementStatus"
          description: "Reuse only: one per `made_with.elements` entry, same order; absent or empty when the take mentioned none"
        loras_status:
          type: array
          items:
            $ref: "#/components/schemas/LoraStatus"
          description: "Reuse only: one per `made_with.loras` entry, same order; absent or empty without LoRAs"
        looks:
          $ref: "#/components/schemas/LookIds"
          description: "Reuse only: the ids of `made_with.looks`, in order, as recorded (send them back as RunRequest.looks); absent or empty without looks"
        looks_status:
          type: array
          items:
            $ref: "#/components/schemas/LookStatus"
          description: "Reuse only: one per `made_with.looks` entry, same order; absent or empty without looks"
    MadeWithLook:
      type: object
      required:
        - id
        - source
        - name
        - version
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/LookId"
        source:
          $ref: "#/components/schemas/LibrarySource"
        name:
          type: string
          description: As it was when the run was made
        version:
          type: integer
          minimum: 1
          description: "The version that was applied (a starter look: the pack's `version`)"
    MadeWithVoice:
      type: object
      required:
        - id
        - name
        - version
        - source
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$
          description: The library item (an own voice may be deleted since; a starter voice `<family>/<id>`)
        name:
          type: string
          description: As it was when the run was made
        version:
          type: integer
          minimum: 1
          description: "The version that ran (a starter voice: the pack's `version`)"
        source:
          $ref: "#/components/schemas/VoiceSource"
    LookStatus:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/LookId"
        status:
          type: string
          enum:
            - current
            - changed
            - deleted
            - missing
          description: "Current: the same version is there now; changed: another version now (edited since, or a pack that bumped it); deleted: an own look deleted since; missing: a starter look no live host publishes now (it may come back). Running a deleted or missing one is 422 `looks[<i>]: unknown look <id>`"
    MadeWithLora:
      type: object
      required:
        - node
        - id
        - source
        - name
        - strength
        - mode
        - sha256
      additionalProperties: false
      properties:
        node:
          type: string
          description: The lora-stack node id
        id:
          type: string
          description: The LoRA (an own one may be deleted since)
        source:
          $ref: "#/components/schemas/LoraSource"
        name:
          type: string
          description: As it was when the run was made
        strength:
          type: number
        mode:
          type: string
          enum:
            - adapter
            - bake
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: "The file's content hash: what exactly ran"
    LoraStatus:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - current
            - missing
            - deleted
          description: "Current: the caller can use it now; missing: shared, no live host lists it now; deleted: own, deleted since"
    MadeWithElement:
      type: object
      required:
        - id
        - handle
        - name
        - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The library item (it may be deleted since)
        handle:
          type: string
          description: As mentioned
        name:
          type: string
        version:
          type: integer
          minimum: 1
          description: The version that was expanded
    ElementStatus:
      type: object
      required:
        - id
        - handle
        - status
        - current_handle
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
          description: As recorded (the prompt that comes back mentions this one)
        status:
          type: string
          enum:
            - current
            - changed
            - deleted
          description: "Current: same version now; changed: edited since (another version); deleted"
        current_handle:
          type:
            - string
            - "null"
          description: "Its handle now (differs from `handle` after a rename: the returned prompt then no longer names it); null when deleted"
    LibraryKind:
      type: string
      enum:
        - element
        - look
        - voice
      description: Element (character, location, prop; used with `@handle`); look (film, camera, colour, lighting; chosen from the visual picker, sent as RunRequest.looks); chosen in the voice picker, sent as a voice param's VoiceRef). Clients show an unknown kind as is
    LibraryGroup:
      type: string
      enum:
        - character
        - location
        - prop
        - film
        - camera
        - colour
        - lighting
        - preset
        - cloned
        - designed
    LibrarySource:
      type: string
      enum:
        - mine
        - starter
      description: "Mine: the caller's own (id a UUID, editable); starter: a look or a voice shipped by a pack and published by a runner (id `<family>/<pack id>`, read-only, everyone sees it)"
    LibraryNeed:
      type: string
      enum:
        - text
        - images
        - lora
      description: "What an item brings to a run: text (non-empty `text`: every family with a prompt), images (reference rows), lora (a LoRA stack)"
    VoiceSource:
      type: string
      enum:
        - preset
        - cloned
        - designed
      description: "Where a saved voice comes from (= its group): preset (a pack's speaker, a starter voice), cloned, designed"
    VoiceInfo:
      type: object
      required:
        - source
      additionalProperties: false
      description: "A voice's own fields. preset: `family`, `speaker`, `language` (and `style`) from the pack; designed: `design`, optional `language` and `style` from the caller; a designed voice may also have `clip` and `consent`"
      properties:
        source:
          $ref: "#/components/schemas/VoiceSource"
        family:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: "Preset only: the family whose voice params take it"
        speaker:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          description: "Preset only: the model's speaker id (ryan, uncle_fu)"
        design:
          type: string
          minLength: 1
          maxLength: 2000
          description: 'Designed only: the voice in words ("male, 17, tenor, nervous")'
        language:
          type: string
          pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3}$
          description: A BCP 47 tag (en, en-US, zh, pt-BR); absent = none (the node's own language param decides)
        style:
          type: string
          minLength: 1
          maxLength: 500
          description: How it speaks, in words; absent = none
        clip:
          $ref: "#/components/schemas/VoiceClip"
          description: "Cloned (required) or designed (optional): the part of a take it clones"
        consent:
          const: true
          description: 'With `clip` (required then): the owner ticked "I have the right to use this voice"'
      allOf:
        - if:
            properties:
              source:
                const: preset
            required:
              - source
          then:
            required:
              - family
              - speaker
              - language
            not:
              anyOf:
                - required:
                    - design
                - required:
                    - clip
                - required:
                    - consent
          else:
            not:
              anyOf:
                - required:
                    - family
                - required:
                    - speaker
        - if:
            properties:
              source:
                const: designed
            required:
              - source
          then:
            required:
              - design
        - if:
            properties:
              source:
                const: cloned
            required:
              - source
          then:
            required:
              - clip
            not:
              required:
                - design
        - if:
            required:
              - clip
          then:
            required:
              - consent
          else:
            not:
              required:
                - consent
    VoiceClip:
      type: object
      required:
        - take_id
        - in
        - out
      additionalProperties: false
      description: "Audio take, or a video take's sound) and the part in..out, snapped and 3-30 s long. The take is kept while the voice exists: deleted from the gallery it is hidden everywhere else, but its object is not swept, so the voice keeps playing and running."
      properties:
        take_id:
          type: string
          format: uuid
        in:
          type: number
          minimum: 0
          maximum: 86400
        out:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
    VoiceDesign:
      type: object
      additionalProperties: false
      description: "A voice's fields as the caller writes them (POST and PUT of a `kind: voice`); trimmed. cloned: `clip` (or `from_take`) and `consent`, no `design`"
      properties:
        design:
          type: string
          maxLength: 4000
          description: Trimmed; must then be 1-2000 characters; a designed voice only
        clip:
          $ref: "#/components/schemas/MediaRef"
          description: The part of a take to clone (checked as a media param with trim, accepts audio, 3-30 s); not with `from_take`
        consent:
          type: boolean
          description: "Required true with a clip: the owner has the right to use this voice"
        language:
          type:
            - string
            - "null"
          maxLength: 35
          description: A BCP 47 tag; null or absent = none
        style:
          type: string
          maxLength: 1000
          description: Trimmed; must then be at most 500 characters; "" or absent = none
    LibraryImage:
      type: object
      required:
        - take_id
        - url
        - thumb_url
        - width
        - height
      properties:
        take_id:
          type: string
          format: uuid
        url:
          $ref: "#/components/schemas/SignedUrl"
        thumb_url:
          $ref: "#/components/schemas/SignedUrl"
          description: The take's thumbnail (Take.thumb_url)
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    LookLora:
      type: object
      required:
        - lora
        - name
        - strength
      additionalProperties: false
      description: One LoRA of a look, appended to the look stack at `strength` when the look is applied
      properties:
        lora:
          oneOf:
            - $ref: "#/components/schemas/LoraRef"
            - type: "null"
          description: The LoRA; null only for a starter look whose file no live host has (the look then does not fit anything)
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: "Own look: the LoRA's name now (as recorded when it is gone); starter look: the file name without .safetensors"
        strength:
          type: number
          minimum: 0
          maximum: 2
    LibraryItem:
      type: object
      description: "A library item: one record shape for elements and looks. one whose take was deleted is left out, so a stored item may show 0 images. `fits` / `reason` only when the list was asked with `workflow`."
      required:
        - id
        - kind
        - group
        - name
        - handle
        - text
        - images
        - thumb_url
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: ^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$
          description: "Own: a UUID; starter look: `<family>/<pack look id>`"
        kind:
          $ref: "#/components/schemas/LibraryKind"
        group:
          $ref: "#/components/schemas/LibraryGroup"
        name:
          type: string
          minLength: 1
          maxLength: 80
        handle:
          type:
            - string
            - "null"
          pattern: ^[a-z](?:[a-z0-9_-]{0,38}[a-z0-9])?$
          description: What `@` mentions; always set for an element, always null for a look
        text:
          type: string
          maxLength: 2000
          description: "An element: appended where it is mentioned; a look: appended to the prompt when chosen; empty = none"
        images:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/LibraryImage"
          description: An element 1-4 when saved, a look 0-4; a starter look none (its picture is only `thumb_url`)
        thumb_url:
          oneOf:
            - $ref: "#/components/schemas/SignedUrl"
            - type: "null"
          description: The first image's thumb_url; else (a look) the thumb of the take it was saved from (`from_take_id`), or a starter look's pack image; the picker plays `voice.clip` in..out); else null
        version:
          type: integer
          minimum: 1
          description: "1 on create, +1 on every PUT; send it back in LibraryItemUpdate. A starter look or voice: the pack's `version`"
        created_at:
          type: string
          format: date-time
          description: "A starter look: the oldest `published_at` of the live hosts publishing it"
        updated_at:
          type: string
          format: date-time
          description: "A starter look: = created_at"
        source:
          $ref: "#/components/schemas/LibrarySource"
        family:
          type:
            - string
            - "null"
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: "A starter look: its pack's family (where it comes from; whether it fits is `fits`); own items: null (any family)"
        loras:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/LookLora"
          description: A look's LoRAs in order; always empty for an element
        needs:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            $ref: "#/components/schemas/LibraryNeed"
          description: "Computed, in the order text, images, lora: non-empty text, at least one image, at least one LoRA"
        from_take_id:
          type:
            - string
            - "null"
          format: uuid
          description: 'A look made with "Save as look": the take; null for every other item)'
        fits:
          type: boolean
          description: "Only with `GET /library?workflow=`: whether the item can be applied to that workflow now"
        reason:
          type:
            - string
            - "null"
          description: "With `fits`: why not (`this workflow has no LoRA stack`, a voice: `voice Ryan is for qwen3-tts`); null when it fits"
        voice:
          $ref: "#/components/schemas/VoiceInfo"
          description: Kind voice only (required then, absent otherwise)
        voice_id:
          type:
            - string
            - "null"
          pattern: ^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[a-z0-9][a-z0-9_-]{0,63}/[a-z0-9][a-z0-9-]{0,63})$
          description: "An element only (always sent for one, absent otherwise): the voice its @handle speaks in a dialogue script, one of the caller's voices or a starter voice; null = none (always null for a location or prop, and on read once that voice is deleted or no live host publishes it)"
      allOf:
        - if:
            properties:
              kind:
                const: element
            required:
              - kind
          then:
            properties:
              group:
                enum:
                  - character
                  - location
                  - prop
              handle:
                type: string
          else:
            not:
              required:
                - voice_id
        - if:
            properties:
              kind:
                const: look
            required:
              - kind
          then:
            properties:
              group:
                enum:
                  - film
                  - camera
                  - colour
                  - lighting
              handle:
                type: "null"
        - if:
            properties:
              kind:
                const: voice
            required:
              - kind
          then:
            required:
              - voice
            properties:
              group:
                enum:
                  - preset
                  - cloned
                  - designed
              handle:
                type: "null"
              text:
                const: ""
              images:
                maxItems: 0
              loras:
                maxItems: 0
              needs:
                maxItems: 0
          else:
            not:
              required:
                - voice
    LibraryItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/LibraryItem"
    LibraryImageRef:
      type: object
      required:
        - take_id
      additionalProperties: false
      properties:
        take_id:
          type: string
          format: uuid
    LookLoraRef:
      type: object
      required:
        - lora
        - strength
      additionalProperties: false
      properties:
        lora:
          $ref: "#/components/schemas/LoraRef"
        strength:
          type: number
          minimum: 0
          maximum: 2
          description: The strength the look applies it at
    LibraryFromTake:
      type: object
      required:
        - take_id
      additionalProperties: false
      description: '"Save as look": fill the fields the body leaves out from a take the caller made with a run'
      properties:
        take_id:
          type: string
          format: uuid
        in:
          type: number
          minimum: 0
          maximum: 86400
          description: "A voice only: the clip's start (snapped; default 0)"
        out:
          type: number
          exclusiveMinimum: 0
          maximum: 86400
          description: "A voice only: the clip's end (snapped; default min(duration, 30))"
        prompt:
          type: boolean
          default: true
          description: "When `text` is absent: copy the take's `made_with.prompt` as typed with `@@` turned into `@` (trimmed, cut to 2000 code points)"
        loras:
          type: boolean
          default: true
          description: "When `loras` is absent: copy the take's `made_with.loras` the caller can use now, `{lora, strength}`, first per id, at most 4"
    LibraryItemCreate:
      type: object
      required:
        - kind
        - group
        - name
      additionalProperties: false
      description: An element needs `handle` and 1-4 `images`; a look has no `handle`, 0-4 images, 0-4 `loras`, and needs text, an image or a LoRA
      properties:
        kind:
          $ref: "#/components/schemas/LibraryKind"
        group:
          $ref: "#/components/schemas/LibraryGroup"
        name:
          type: string
          maxLength: 200
          description: Trimmed; must then be 1-80 characters
        handle:
          type:
            - string
            - "null"
          maxLength: 200
          description: "An element: a slug (LibraryItem.handle), unique per owner; the client proposes one from the name. A look: absent or null"
        text:
          type: string
          maxLength: 4000
          description: 'Trimmed; must then be at most 2000 characters; missing = "" (a look with from_take: copied)'
        images:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/LibraryImageRef"
          description: "Takes of the caller, images, distinct, in order (the first is the thumbnail): an element 1-4, a look 0-4; missing = []"
        loras:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/LookLoraRef"
          description: "A look only: 0-4 LoRAs the caller can use now, distinct; missing = [] (with from_take: copied)"
        from_take:
          $ref: "#/components/schemas/LibraryFromTake"
        voice:
          $ref: "#/components/schemas/VoiceDesign"
          description: "A voice only (required then): its description, language and style"
        voice_id:
          type:
            - string
            - "null"
          maxLength: 130
          description: "An element of group character only: its voice (`{voice_id}` of VoiceRef: an own voice's UUID or a starter voice's `<family>/<id>`); missing or null = none"
      allOf:
        - if:
            properties:
              kind:
                const: element
            required:
              - kind
          then:
            required:
              - handle
              - images
            properties:
              group:
                enum:
                  - character
                  - location
                  - prop
              handle:
                type: string
              loras:
                maxItems: 0
            not:
              required:
                - from_take
        - if:
            properties:
              kind:
                const: look
            required:
              - kind
          then:
            properties:
              group:
                enum:
                  - film
                  - camera
                  - colour
                  - lighting
              handle:
                type: "null"
    LibraryItemUpdate:
      type: object
      required:
        - group
        - name
        - text
        - images
        - version
      additionalProperties: false
      description: Every field (checked like LibraryItemCreate for the item's kind); an element also needs `handle`
      properties:
        group:
          $ref: "#/components/schemas/LibraryGroup"
        name:
          type: string
          maxLength: 200
        handle:
          type:
            - string
            - "null"
          maxLength: 200
        text:
          type: string
          maxLength: 4000
        images:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/LibraryImageRef"
        loras:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/LookLoraRef"
          description: A look only; missing = []
        voice:
          $ref: "#/components/schemas/VoiceDesign"
          description: A designed voice only (required then)
        voice_id:
          type:
            - string
            - "null"
          maxLength: 130
          description: A character element only; missing or null = none (PUT replaces it)
        version:
          type: integer
          minimum: 1
          description: The version the edit started from (409 when stale)
    UploadCreate:
      type: object
      required:
        - filename
        - content_type
        - bytes
      additionalProperties: false
      if:
        properties:
          content_type:
            enum:
              - audio/wav
              - audio/mpeg
              - audio/mp4
        required:
          - content_type
      then:
        required:
          - duration_s
      else:
        not:
          required:
            - duration_s
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: The file's name; only its base name (without extension) is kept, as the title
        content_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - audio/wav
            - audio/mpeg
            - audio/mp4
        bytes:
          type: integer
          minimum: 1
          maximum: 52428800
        duration_s:
          type: number
          exclusiveMinimum: 0
          maximum: 600
          description: "Audio only (required): its length as the browser decoded it; studio records it, the runner reads the file itself"
    UploadLimits:
      type: object
      required:
        - image_max_side
      additionalProperties: false
      properties:
        image_max_side:
          type: integer
          minimum: 1
          maximum: 16384
          description: The largest `max` of a `width` or `height` param on any node schema with a `Canvas` output (8192 with MiniMax H3 Image, 4096 with Qwen Image alone); 16384 (the upload cap) when no runner publishes one
    Upload:
      type: object
      required:
        - take_id
        - upload_url
        - content_type
        - bytes
        - expires_at
      properties:
        take_id:
          type: string
          format: uuid
          description: Pass to /v1/studio/uploads/{take_id}/complete; becomes the take's id
        upload_url:
          type: string
          description: "Signed single-use link: PUT the bytes here with exactly this Content-Type and Content-Length"
          examples:
            - /files/u/7d1e.../uploads/9b2f....png?exp=1767225600&bytes=48213&ct=image%2Fpng&sig=ab12
        content_type:
          type: string
        bytes:
          type: integer
        expires_at:
          type: string
          format: date-time
    LoraSource:
      type: string
      enum:
        - shared
        - mine
      description: "Shared: a file on the GPU hosts (registry `<host>.<env>.loras`), usable by everyone; mine: the caller's own upload"
    LoraState:
      type: string
      enum:
        - pending
        - ready
        - rejected
      description: "Own LoRAs: pending (created, not completed), ready (checked and indexed), rejected (a check failed: `reason`); shared ones are always ready"
    LoraKeyStyle:
      type: string
      enum:
        - peft
        - kohya
        - comfyui
      description: How the file names its tensors
    Lora:
      type: object
      description: A LoRA in the library. Shared and own LoRAs have one shape; `hosts` is set only for shared ones, `reason` only for a rejected one. `rank`, `key_style`, `sha256` are null until an own LoRA is ready.
      required:
        - id
        - source
        - name
        - family
        - rank
        - size_bytes
        - key_style
        - licence
        - sha256
        - hosts
        - state
        - reason
        - thumb_url
        - created_at
      properties:
        id:
          type: string
          pattern: ^([0-9a-f]{64}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$
          description: "Shared: the file's SHA-256; mine: a UUID"
        source:
          $ref: "#/components/schemas/LoraSource"
        name:
          type: string
          minLength: 1
          maxLength: 80
        family:
          type: string
          description: The model family it fits (`qwen-image`), or `unknown` (it fits no family published now, or not checked yet)
          examples:
            - qwen-image
            - unknown
        rank:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 4096
          description: The largest A/B rank
        size_bytes:
          type: integer
          minimum: 1
        key_style:
          oneOf:
            - $ref: "#/components/schemas/LoraKeyStyle"
            - type: "null"
        licence:
          type:
            - string
            - "null"
          maxLength: 200
          description: From the file's metadata (`modelspec.license`, else `license`); null when it names none
        sha256:
          type:
            - string
            - "null"
          pattern: ^[0-9a-f]{64}$
        hosts:
          type: array
          items:
            type: string
            pattern: ^[a-z0-9]{1,32}$
          description: "Shared: the live hosts that have it (sorted); mine: [] (any host fetches it on first use)"
        state:
          $ref: "#/components/schemas/LoraState"
        reason:
          type:
            - string
            - "null"
          description: "Rejected: why (the complete call's 422 detail); null otherwise"
        thumb_url:
          oneOf:
            - $ref: "#/components/schemas/SignedUrl"
            - type: "null"
          description: The thumbnail of the caller's oldest take made with it; null when none
        created_at:
          type: string
          format: date-time
          description: "Mine: the upload's creation; shared: the file's mtime (the oldest over its hosts)"
        prefused:
          type: string
          minLength: 1
          description: "Shared only: the title of a model a host publishes with this LoRA pre-fused into its weights (its file cannot be deleted: delete the model instead); absent otherwise"
    LoraList:
      type: object
      required:
        - loras
      properties:
        loras:
          type: array
          items:
            $ref: "#/components/schemas/Lora"
        usage:
          $ref: "#/components/schemas/LoraUsage"
    LoraUsage:
      type: object
      required:
        - count
        - bytes
        - max_count
        - max_bytes
      description: The caller's own LoRAs against the quota, counted as the upload's 409s count them (every state; pending and ready bytes plus deleted ones until the sweep), whatever the filters
      properties:
        count:
          type: integer
          minimum: 0
        bytes:
          type: integer
          minimum: 0
        max_count:
          type: integer
          const: 50
        max_bytes:
          type: integer
          const: 21474836480
    LoraPatch:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 200
          description: Trimmed; must then be 1-80 characters
    LoraUploadCreate:
      type: object
      required:
        - filename
        - bytes
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Must end in .safetensors; the name without it becomes the LoRA's name
        bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
    LoraUpload:
      type: object
      required:
        - lora
        - upload_url
        - content_type
        - bytes
        - expires_at
      properties:
        lora:
          $ref: "#/components/schemas/Lora"
          description: State pending; pass its id to /v1/studio/loras/{lora_id}/complete
        upload_url:
          type: string
          description: "Signed single-use link: PUT the file here with exactly this Content-Type and Content-Length"
          examples:
            - /files/u/7d1e.../loras/2c4e....safetensors?exp=1767225600&bytes=18874368&ct=application%2Foctet-stream&sig=ab12
        content_type:
          type: string
          const: application/octet-stream
        bytes:
          type: integer
        expires_at:
          type: string
          format: date-time
    BatchStatus:
      type: string
      enum:
        - queued
        - running
        - waiting
        - paused
        - done
        - failed
        - stopped
      description: "Queued: stored, the engine has not started it; running; waiting: the engine reports running but every row that has not ended is `waiting` on a gate (pick to continue); paused (`reason` says why: by you, three rows in a row failed with one error, or the engine restarted: press Resume); done: every row ended (some may have failed); failed: the engine could not run it at all (`reason`); stopped: by Stop. events, except `queued`."
    BatchControl:
      type: string
      enum:
        - run
        - pause
        - stop
      description: What the owner asked for last (Pause, Resume, Stop); `status` follows once the engine confirms. While `pause` or `paused`, the dispatcher holds the batch's queued runs
    BatchCounts:
      type: object
      required:
        - total
        - queued
        - running
        - succeeded
        - failed
        - cancelled
      description: Rows by `BatchRow.status`; queued, running, waiting, succeeded, failed and cancelled add up to total
      properties:
        total:
          type: integer
          minimum: 1
          maximum: 500
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
          description: Rows parked on a gate ("waiting for a pick")
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
    Batch:
      type: object
      required:
        - id
        - title
        - workflow_id
        - workflow_title
        - session_id
        - status
        - control
        - reason
        - counts
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        workflow_id:
          type: string
        workflow_title:
          type: string
          description: The title in the batch's snapshot
        session_id:
          type:
            - string
            - "null"
          format: uuid
          description: The session its runs are in; null after that session was deleted
        status:
          $ref: "#/components/schemas/BatchStatus"
        control:
          $ref: "#/components/schemas/BatchControl"
        reason:
          type:
            - string
            - "null"
          description: Why it is paused or failed; null otherwise
        counts:
          $ref: "#/components/schemas/BatchCounts"
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
          description: The engine first reported running
        finished_at:
          type:
            - string
            - "null"
          format: date-time
          description: Done, failed or stopped
        pipeline_id:
          type:
            - string
            - "null"
          format: uuid
          description: "A batch of a pipeline: the pipeline (it may be deleted since); absent or null for a batch of one workflow, whose `workflow_*` then describe it. For a pipeline batch `workflow_id` / `workflow_title` are its first step's"
        pipeline_title:
          type:
            - string
            - "null"
          description: "With pipeline_id: the title in the batch's snapshot"
        pipeline_version:
          type:
            - integer
            - "null"
          minimum: 1
          description: "With pipeline_id: the version it was submitted with"
        collection:
          type:
            - string
            - "null"
          description: "With pipeline_id: the collection its output node names (the first output, by node id)"
        bounds:
          $ref: "#/components/schemas/PipelineBounds"
          description: "A pipeline batch: its worst case per row at Submit"
        models:
          type: object
          additionalProperties:
            type: string
          description: "A pipeline batch: judge, write and decide node id → the ask workflow it runs (resolved at Submit, in the snapshot)"
        memory:
          oneOf:
            - $ref: "#/components/schemas/BatchMemory"
            - type: "null"
          description: "A pipeline batch: the memory snapshot it reads; null until pipelines took it"
        again_of:
          type:
            - string
            - "null"
          format: uuid
          description: Made by "Run again" of this batch
        same_decisions:
          type: boolean
        egress:
          type: array
          items:
            $ref: "#/components/schemas/PipelineEgress"
          description: "A pipeline batch: what leaves the machine, as at Submit"
        reserved:
          type: array
          items:
            $ref: "#/components/schemas/PipelineReserved"
          description: "A pipeline batch: local servers' reserved memory"
        director:
          oneOf:
            - $ref: "#/components/schemas/BatchDirector"
            - type: "null"
          description: The batch's director chat; null when its pipeline has no director
        remote:
          oneOf:
            - $ref: "#/components/schemas/BatchRemote"
            - type: "null"
          description: Remote calls so far against the caps; null when the pipeline's remote is off
        timeline_id:
          type:
            - string
            - "null"
          format: uuid
          description: A sequence's Re-render (`pipeline_id` null, `pipeline_title` "Re-render · <name>", `pipeline_version` = the revision); absent or null otherwise
    BatchDirector:
      type: object
      required:
        - node
        - state
        - wakes
        - max_wakes
      properties:
        node:
          type: string
          description: The director agent node
        state:
          type: string
          enum:
            - idle
            - waiting
            - thinking
            - off
          description: "Idle: asleep until a message or a row ends; waiting: its turn's call is queued or held (Pause); thinking: a call or its tools run; off: the batch ended or max_wakes reached (POST …/chat is 409)"
        wakes:
          type: integer
          minimum: 0
        max_wakes:
          type: integer
          minimum: 1
          maximum: 500
    BatchRemote:
      type: object
      required:
        - calls
        - tokens
        - network_failures
        - max_calls
        - max_tokens
      properties:
        calls:
          type: integer
          minimum: 0
          description: Requests sent (re-asks included; network retries not)
        tokens:
          type: integer
          minimum: 0
          description: Tokens the providers reported
        network_failures:
          type: integer
          minimum: 0
          description: Transport failures (retried); counted apart from answers and verdicts
        max_calls:
          type: integer
          minimum: 1
        max_tokens:
          type: integer
          minimum: 1
    BatchMemory:
      type: object
      required:
        - examples
        - notes
        - taken_at
      properties:
        examples:
          type: integer
          minimum: 0
        notes:
          type: integer
          minimum: 0
        taken_at:
          type: string
          format: date-time
    BatchAgain:
      type: object
      required:
        - decisions
      additionalProperties: false
      properties:
        decisions:
          type: string
          enum:
            - same
            - again
          description: "Again: ask the models again"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Absent = `<source title> again`
    BatchRowStatus:
      type: string
      enum:
        - queued
        - running
        - waiting
        - succeeded
        - failed
        - cancelled
      description: "A run's statuses plus waiting: parked on a gate for a pick (pipeline batches only)"
    BatchRow:
      type: object
      required:
        - row
        - attempt
        - inputs
        - status
        - run_id
        - take_ids
        - thumb_url
        - error
        - started_at
        - finished_at
      properties:
        row:
          type: integer
          minimum: 1
          maximum: 500
        attempt:
          type: integer
          minimum: 1
          description: 1; +1 on every Retry
        inputs:
          $ref: "#/components/schemas/RunInputs"
          description: "What the row runs with: the base inputs, then its own values, then its seed (a pipeline batch: `<inputs node>.<input>` keys)"
        looks:
          $ref: "#/components/schemas/LookIds"
          description: "A batch of one workflow: the row's looks (its cell, else BatchCreate.looks); absent or empty = none"
        status:
          $ref: "#/components/schemas/BatchRowStatus"
          description: Queued until its run starts (also while the run waits in the queue or is held), running while it runs, waiting while parked on a gate, then the row's end
        run_id:
          type:
            - string
            - "null"
          format: uuid
          description: "The current attempt's run (a pipeline row: its latest run); null before it has one"
        take_ids:
          type: array
          items:
            type: string
            format: uuid
          description: "The current attempt's takes (deleted ones left out); a pipeline row: the takes its output received, once it succeeded"
        thumb_url:
          oneOf:
            - $ref: "#/components/schemas/SignedUrl"
            - type: "null"
          description: The first take's thumbnail (Take.thumb_url); null without one
        error:
          type:
            - string
            - "null"
          description: Set when failed
        started_at:
          type:
            - string
            - "null"
          format: date-time
          description: Its run reported running
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        node:
          type:
            - string
            - "null"
          description: "Pipeline batches: the node the row is at now (parked on, or running); null when ended or not started"
        parked:
          oneOf:
            - $ref: "#/components/schemas/BatchRowParked"
            - type: "null"
          description: "Pipeline batches: set while status is waiting"
        cells:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/BatchCell"
          description: "Pipeline batches: the run table's cells, one per node the row reached, in the order first reached; absent for a batch of one workflow"
    BatchRowParked:
      type: object
      required:
        - gate
        - visit
        - keep
        - candidates
      properties:
        gate:
          type: string
          description: The gate node id
        kind:
          type: string
          enum:
            - gate
            - judge
          description: ; absent = gate
        suggested:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
          description: "A judge: its pick, pre-selected ([] when no take passed)"
        decision_id:
          type: string
        visit:
          type: integer
          minimum: 1
          description: Which visit of the gate (1 + times its loop went round)
        keep:
          type: integer
          minimum: 1
          maximum: 8
          description: Pick 1 to keep of the candidates
        candidates:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            format: uuid
          description: The takes to pick from (the gate's step's latest takes)
    CellStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
        - waiting
        - picked
        - rejected
      description: "A step attempt: its runs' state (queued while none of them has started); a gate attempt: waiting, picked or rejected; an output: succeeded. write, decide: queued / running, then succeeded or failed; memory: succeeded"
    BatchCell:
      type: object
      required:
        - node
        - kind
        - attempts
      properties:
        node:
          type: string
          description: The pipeline node id
        kind:
          type: string
          enum:
            - step
            - gate
            - output
            - judge
            - write
            - decide
            - memory
            - agent
            - custom
        attempts:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/BatchCellAttempt"
          description: One per visit (loop attempts stacked), oldest first
        loop:
          description: "A judge with a branch or a decide: its capped loop for the cell's \"retried <turns> of <max>\", \"gave up → <then>\""
          type: object
          required:
            - turns
            - max
            - then
            - gave_up
          properties:
            turns:
              type: integer
              minimum: 0
              maximum: 10
            max:
              type: integer
              minimum: 1
              maximum: 10
            then:
              type:
                - string
                - "null"
              description: The node the cap sends the row to
            gave_up:
              type: boolean
    BatchCellAttempt:
      type: object
      required:
        - visit
        - status
        - run_ids
        - take_ids
        - seeds
        - seconds
        - error
        - thumb_url
      properties:
        visit:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/CellStatus"
        run_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
          description: "A step: its runs, by seed index"
        take_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
          description: "A step: its takes; a gate: the picked ones; an output: what it received"
        candidates:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
          description: "A gate: the takes it offered"
        seeds:
          type: array
          maxItems: 8
          items:
            type: integer
            minimum: 0
          description: "A step: the seed of each run, by seed index"
        seconds:
          type:
            - number
            - "null"
          minimum: 0
          description: "A step: the runs' time on their hosts, summed (started to finished); null until one finished"
        error:
          type:
            - string
            - "null"
        thumb_url:
          oneOf:
            - $ref: "#/components/schemas/SignedUrl"
            - type: "null"
          description: The first of take_ids (else candidates)
        decision_id:
          type: string
        judged:
          $ref: "#/components/schemas/CellJudged"
        route:
          type: object
          required:
            - label
            - to
          properties:
            label:
              type: string
            to:
              type: string
          description: "A decide: the route taken"
        branch:
          type: integer
          minimum: 0
          maximum: 23
          description: "A fanned-out step: one attempt per (visit, branch); branch = the item index"
        agent:
          description: An agent attempt (`4 turns · 6 tools · 14 shots`)
          type: object
          required:
            - turns
            - tool_calls
            - tokens
            - items
            - route
          properties:
            turns:
              type: integer
              minimum: 0
            tool_calls:
              type: integer
              minimum: 0
            tokens:
              type: integer
              minimum: 0
            items:
              type: integer
              minimum: 0
              maximum: 24
              description: Its list's length (0 without one)
            route:
              type:
                - string
                - "null"
    CellJudged:
      type: object
      required:
        - verdict
        - picked
        - of
        - keep
        - first_failed
        - suggested
        - agreed
        - takes
      description: "A judge attempt (the run table's judged cell: \"picked 1 of 4\", the first failed criterion; the attempts side by side with each take's reason)"
      properties:
        verdict:
          type: string
          enum:
            - pass
            - fail
        picked:
          type: integer
          minimum: 0
          maximum: 8
        of:
          type: integer
          minimum: 1
          maximum: 8
        keep:
          type: integer
          minimum: 1
          maximum: 8
        first_failed:
          type:
            - string
            - "null"
          description: The best take's first false must; null when it passed
        suggested:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
        agreed:
          type:
            - boolean
            - "null"
          description: "Suggest: the user's pick equalled the suggestion; null before a pick and in Auto"
        takes:
          type: array
          maxItems: 8
          items:
            type: object
            required:
              - take_id
              - passes
              - first_failed
              - reason
            properties:
              take_id:
                type: string
                format: uuid
              passes:
                type: boolean
              first_failed:
                type:
                  - string
                  - "null"
              reason:
                type: string
                maxLength: 300
              checks:
                type: array
                maxItems: 12
                items:
                  type: boolean
                description: Every criterion's answer, musts then nices
    BatchPage:
      type: object
      required:
        - batches
        - next_cursor
      properties:
        batches:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
        next_cursor:
          type:
            - string
            - "null"
          description: Pass as `cursor` for the next page; null on the last page
    BatchRowPage:
      type: object
      required:
        - rows
        - next_cursor
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BatchRow"
        next_cursor:
          type:
            - string
            - "null"
    BatchLines:
      type: object
      required:
        - param
        - values
      additionalProperties: false
      description: 'Pasted lines: one row per value, set as `param` (a string, text or enum param; or an image param, or a rows param whose item has one Image field and no other required field: then each value is a take id and becomes `{take_id}`, or the one-item list `[{<field>: {take_id}}]`; else 422); clients drop blank lines. Gallery multi-select "Use in…" makes its batch this way'
      properties:
        param:
          type: string
          pattern: ^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$
          examples:
            - prompt.text
        values:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
    BatchTable:
      type: object
      required:
        - columns
        - rows
      additionalProperties: false
      description: "A CSV parsed by the client or the CLI: each cell typed by its param (clients convert CSV text with node_schemas); a null cell leaves that input unset for the row (a seed: random)"
      properties:
        columns:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^([a-z][a-z0-9_]*\.[a-z][a-z0-9_]*|looks)$
          description: "Param paths; `looks` (a batch of one workflow only) is the row's looks: a cell is a list of look ids (null = BatchCreate.looks)"
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: array
            items:
              anyOf:
                - $ref: "#/components/schemas/ParamValue"
                - $ref: "#/components/schemas/LookIds"
          description: Each as long as columns (else 422)
    BatchGrid:
      type: object
      required:
        - axes
      additionalProperties: false
      description: Rows = the cartesian product of the axes, the first axis varying slowest
      properties:
        axes:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required:
              - param
              - values
            additionalProperties: false
            properties:
              param:
                type: string
                pattern: ^([a-z][a-z0-9_]*\.[a-z][a-z0-9_]*|looks)$
                description: "A param path, or `looks` (a batch of one workflow only: each value a list of look ids, the row's looks)"
              values:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  anyOf:
                    - $ref: "#/components/schemas/ParamValue"
                    - $ref: "#/components/schemas/LookIds"
    BatchSeeds:
      type: object
      required:
        - count
      additionalProperties: false
      description: Repeat each row `count` times with consecutive seeds `start`, `start`+1, … in the workflow's one `seed`-type param (422 when it has none or several); these replace any value of it from `inputs` or the rows. Repeats sit next to each other (input row 1's repeats are rows 1..count).
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 8
        start:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Absent = drawn at random at Submit and stored
    BatchCreate:
      type: object
      required:
        - rows
      additionalProperties: false
      description: Exactly one of workflow_id (a batch of one workflow) or pipeline_id (a batch of a saved pipeline)
      oneOf:
        - required:
            - workflow_id
        - required:
            - pipeline_id
      properties:
        workflow_id:
          type: string
        pipeline_id:
          type: string
          format: uuid
          description: One of the caller's pipelines; its inputs are the columns
        session_id:
          type: string
          format: uuid
          description: Absent = a new session titled like the batch
        title:
          type: string
          maxLength: 200
          description: Trimmed; empty or missing = "<workflow or pipeline title> × <row count>"
        inputs:
          $ref: "#/components/schemas/RunInputs"
          description: Base inputs for every row; missing = {}
        rows:
          description: Exactly one of lines, table, grid
          oneOf:
            - type: object
              required:
                - lines
              additionalProperties: false
              properties:
                lines:
                  $ref: "#/components/schemas/BatchLines"
            - type: object
              required:
                - table
              additionalProperties: false
              properties:
                table:
                  $ref: "#/components/schemas/BatchTable"
            - type: object
              required:
                - grid
              additionalProperties: false
              properties:
                grid:
                  $ref: "#/components/schemas/BatchGrid"
        seeds:
          $ref: "#/components/schemas/BatchSeeds"
        looks:
          $ref: "#/components/schemas/LookIds"
          description: "A batch of one workflow: the looks of every row whose own `looks` cell (table column or grid axis `looks`) is absent or null; missing = []. A pipeline batch takes its looks from its steps (422 here)"
    BatchEvent:
      description: "One stored event of the batch: the whole batch, or one whole row"
      oneOf:
        - $ref: "#/components/schemas/BatchStatusEvent"
        - $ref: "#/components/schemas/BatchRowEvent"
        - $ref: "#/components/schemas/BatchChatEvent"
      discriminator:
        propertyName: type
        mapping:
          batch: "#/components/schemas/BatchStatusEvent"
          row: "#/components/schemas/BatchRowEvent"
          chat: "#/components/schemas/BatchChatEvent"
    BatchStatusEvent:
      type: object
      required:
        - seq
        - type
        - ts
        - data
      properties:
        seq:
          type: integer
          minimum: 1
          description: Per-batch cursor
        type:
          type: string
