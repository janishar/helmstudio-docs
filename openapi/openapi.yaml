      operationId: studioUploadLimits
      summary: The sizes the web optimises an upload to, derived from the registry
      description: "Computed from every node schema any runner publishes, never a constant: the web reads it once per session and scales an image down only when its long side is over `image_max_side`."
      responses:
        "200":
