      operationId: studioReplaceLibraryItem
      summary: Replace an item's group, name, handle, text and images
      description: "Optimistic concurrency like workflows: `version` is the one the edit started from; stale = 409 `element changed since you opened it (now version <n>)` (a look: `look changed since you opened it (now version <n>)`), nothing changes. A look is checked like POST with `kind: look` (no `from_take`; `from_take_id` stays). clip may be changed (checked like POST; `from_take_id` follows it; a clip needs `consent` again). element's `voice_id` is checked like POST (a stored one that is gone since may be sent back: it saves null). Checked like POST (the handle may stay its own). On success `version` + 1, `updated_at` now. Takes made before keep their resolved graph; their reuse answers this element `changed`. `kind` never changes. `voice` required; stale = 409 `voice changed since you opened it (now version <n>)`); takes made before keep the voice they ran with (`made_with.voices` records the version)."
      parameters:
