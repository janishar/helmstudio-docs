  /v1/studio/loras:
    get:
      tags:
        - Library and LoRAs
      operationId: studioListLoras
      summary: The LoRAs the caller can use (shared ones of the live hosts, and the caller's own); not paginated
      description: "Shared LoRAs are the union of every live host's registry `<host>.<env>.loras` (one entry per id, `hosts` = the live hosts that list it, sorted; `family` = the first not `unknown` over those hosts); own LoRAs are the caller's rows in every `state` (owner-scoped; another user's never appear). Filters combine with AND: `source`, `family` (exact, `unknown` included), `q` (every whitespace-separated word occurs, case-insensitively, in `name`). Order: own first, newest `created_at` first; then shared by `name` (case-insensitive, code points), then `id`. `thumb_url` is the caller's oldest take whose `made_with.loras` has the id (never another user's)."
      parameters:
        - name: source
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoraSource"
        - name: family
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: "Only LoRAs detected for this family (`unknown`: those that fit none)"
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
          description: Words of the name; blank = no filter
      responses:
        "200":
          description: LoRAs
          content:
            application/json:
