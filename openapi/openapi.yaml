  /v1/studio/admin/hosts/{host}/unload:
    post:
      tags:
        - "Admin: models and hosts"
      operationId: studioAdminUnload
      summary: Unload components, cached handles, or everything on a host (pins included)
      description: "Admin only (403). Studio sends `req.runner.unload` with `by: admin` to each env concerned: `all` = every env of the host, no `components` (everything: pinned components, adapters, cached handles); `entries` = one request per env with that env's entries (pinned ones too; an entry not resident is skipped); `cached_env` = that env, `cached_only`. An env whose key is idle is asked at once; a busy one after its run ends (\"a running run finishes first\"): until every request of this call is answered, or 60 s after the host went idle, the dispatcher releases nothing to the host. Pins stay set. The result shows in `GET /v1/studio/hosts`. 404 for a host with no present hosts key. 422 `env <env> is not on host <host>`."
      parameters:
        - $ref: "#/components/parameters/HostName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostUnload"
      responses:
        "202":
          description: Asked (or waiting for the run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostUnloadAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
